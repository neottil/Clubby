# NOTA: questo file è un template. I placeholder ${...} vengono sostituiti
# dalla pipeline con envsubst a partire dai GitHub Secrets, e il risultato non
# viene mai committato (vedi k8s/rendered/, ignorato da git).
apiVersion: v1
kind: Secret
metadata:
  name: clubby-auth-secrets
  namespace: ${KUBE_NAMESPACE}
type: Opaque
stringData:
  DB_PASSWORD: "${AUTH_DB_PASSWORD}"
  # Chiave privata RSA con cui vengono firmati i token, generata da Infra.
  # Deve restare stabile nel tempo: se cambia, tutti i token e i refresh token
  # in circolazione smettono di valere e ogni utente deve rifare l'accesso.
  # Gli a capo sono codificati come "\n" letterali (vedi crypto/tokens.ts, che
  # li ripristina prima di leggere la chiave): un PEM multilinea dentro un
  # valore YAML sarebbe fragile da rendere con envsubst.
  AUTH_JWT_PRIVATE_KEY: "${AUTH_JWT_PRIVATE_KEY}"
  # Password temporanea del primo amministratore, generata da Infra e mostrata
  # una sola volta nel riepilogo della sua run. Usata SOLO se il database degli
  # utenti è ancora vuoto, e comunque con l'obbligo di sostituirla al primo
  # accesso. Il resto dell'anagrafica sta nel ConfigMap: non è sensibile.
  INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
