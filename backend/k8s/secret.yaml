# NOTA: questo file è un template. I placeholder ${...} vengono sostituiti dalla pipeline
# Build & Deploy con envsubst, a partire dai GitHub Secrets, e il risultato non viene mai
# committato nel repo (vedi k8s/rendered/, ignorato da git).
#
# Qui non c'è alcun segreto legato all'autenticazione: il backend verifica i
# token con la chiave PUBBLICA dell'authorizer (scaricata dal suo JWKS) e per
# le operazioni sugli utenti inoltra il token dell'admin che le ha richieste.
# Non possiede quindi nessuna credenziale che gli permetta di emettere token o
# di modificare account per conto proprio.
apiVersion: v1
kind: Secret
metadata:
  name: clubby-secrets
  namespace: ${KUBE_NAMESPACE}
type: Opaque
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
