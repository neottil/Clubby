# Ingress del backend: possiede la richiesta del certificato TLS (annotazione
# cert-manager) per l'host condiviso con il frontend — l'Ingress del frontend
# (frontend/k8s/ingress.yaml) referenzia lo stesso secretName ma SENZA
# l'annotazione cert-manager, per non far litigare i due Ingress sulla stessa
# richiesta di certificato. Traefik unisce le regole di più Ingress sullo
# stesso host: qui solo /api, l'altro fa da default per "/".
#
# Il backend non ha un hostname proprio: espone già tutte le sue route sotto
# il prefisso /api (vedi backend/src/server.ts), e il client frontend chiama
# ${VITE_API_BASE_URL}/api/... — un solo host condiviso, routing per path.
#
# Assume Traefik come Ingress Controller (incluso di default in k3s, ingressClassName
# "traefik") e cert-manager con il ClusterIssuer "letsencrypt", entrambi configurati da
# scripts/setup-vps-k3s.sh. Adatta ingressClassName/annotazione per un cluster diverso.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clubby-backend
  namespace: ${KUBE_NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${APP_DOMAIN}
      secretName: clubby-tls
  rules:
    - host: ${APP_DOMAIN}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clubby-backend
                port:
                  number: 80
