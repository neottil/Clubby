apiVersion: v1
kind: ConfigMap
metadata:
  name: clubmanager-config
  namespace: ${KUBE_NAMESPACE}
data:
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  KEYCLOAK_URL: "${KEYCLOAK_URL}"
  KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
  KEYCLOAK_ADMIN_CLIENT_ID: "${KEYCLOAK_ADMIN_CLIENT_ID}"
  PORT: "${BACKEND_PORT}"
