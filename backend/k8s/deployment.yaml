apiVersion: apps/v1
kind: Deployment
metadata:
  name: clubby-backend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: clubby-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clubby-backend
  template:
    metadata:
      labels:
        app: clubby-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - containerPort: ${BACKEND_PORT}
          envFrom:
            - configMapRef:
                name: clubby-config
            - secretRef:
                name: clubby-secrets
          # Moduli opzionali qui e non nel ConfigMap di proposito: le variabili
          # lette con envFrom non si aggiornano in un container già avviato, e
          # un deploy che cambia solo il ConfigMap non modifica il Deployment,
          # quindi non fa ripartire il pod. Scritte nel Deployment, accendere o
          # spegnere un modulo cambia la spec e provoca il rollout.
          env:
            - name: ENABLE_MODULE_TESSERAMENTO
              value: "${ENABLE_MODULE_TESSERAMENTO}"
            - name: ENABLE_MODULE_RICEVUTE
              value: "${ENABLE_MODULE_RICEVUTE}"
            # Logo stampato sulle ricevute: stessa Variable del frontend.
            - name: LOGO_FILE
              value: "${LOGO_FILE}"
            # Come sopra: cambia il comportamento a runtime, quindi deve far
            # ripartire il pod quando cambia.
            - name: RECHARGE_MODE
              value: "${RECHARGE_MODE}"
          # Il picco di memoria è la generazione dei PDF delle ricevute: un
          # OOMKilled durante un'emissione vuol dire che il limite è basso.
          # Senza limite, quel picco toglierebbe memoria al database sulla
          # stessa VPS (spec 007).
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: ${BACKEND_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ${BACKEND_PORT}
            initialDelaySeconds: 10
            periodSeconds: 20
