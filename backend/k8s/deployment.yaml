apiVersion: apps/v1
kind: Deployment
metadata:
  name: clubby-backend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: clubby-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clubby-backend
  template:
    metadata:
      labels:
        app: clubby-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - containerPort: ${BACKEND_PORT}
          envFrom:
            - configMapRef:
                name: clubby-config
            - secretRef:
                name: clubby-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: ${BACKEND_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ${BACKEND_PORT}
            initialDelaySeconds: 10
            periodSeconds: 20
