openapi: 3.1.0
info:
  title: Clubby Backend
  version: 1.0.0
  description: |
    API applicative di Clubby: soci, attività, istruttori, incontri, voucher,
    tesseramenti, ricevute e amministrazione.

    **Autenticazione**: ogni endpoint sotto `/api` richiede un access token emesso
    dall'authorizer (`Authorization: Bearer <token>`), verificato con le chiavi
    pubbliche del suo JWKS. Gli account e i token sono documentati in
    `authorizer/docs/openapi.yaml`.

    **Chi può fare cosa**: ruolo nel club (`socio` o `istruttore`) e privilegio
    `admin` sono indipendenti e arrivano nel claim `roles` del token.
    - *admin*: tutto;
    - *istruttore*: registra e modifica gli incontri che tiene, nelle attività a cui
      è abilitato; vede i nominativi dei soci e i saldi dei voucher;
    - *socio*: vede solo i propri dati, attraverso la scheda socio collegata al suo
      account. Senza scheda collegata riceve elenchi vuoti.

    **Importi**: i valori letti da colonne decimali del database (costi, importi,
    saldi dei singoli oggetti) arrivano come stringhe con due decimali, es. `"25.00"`.
    Sono invece numeri JSON il costo del listino (`costo_default`), la quota nelle
    impostazioni e i totali degli elenchi paginati. In ingresso gli importi sono
    numeri.

    **Metodi**: `POST` crea o esegue un'azione, `PUT` sostituisce l'intera risorsa,
    `PATCH` ne modifica una parte (si aggiornano solo i campi inviati). Sulle quattro
    modifiche parziali (soci, attività, incontri, impostazioni) `PUT` resta per ora
    come alias deprecato di `PATCH` (spec 008, fase 1).

    **Date**: le date di calendario sono stringhe `YYYY-MM-DD`; gli istanti
    (`created_at`, `updated_at`) sono date-time ISO in UTC.

    **Elenchi paginati** (incontri, movimenti, voci registrabili): parametri `limit`
    (default 25, massimo 200) e `offset`. `total` è il numero di righe che
    soddisfano il filtro, non quelle restituite; i totali di importo coprono
    l'intero risultato filtrato. Nella risposta `limit` riporta il valore
    richiesto, oppure il numero di righe restituite se non è stato indicato.

    **Errori**: sempre nella forma `{ "error": "messaggio" }`. Un corpo che non è un
    oggetto JSON valido produce un 400.
servers:
  - url: http://localhost:3000
    description: Sviluppo locale
  - url: https://{appDomain}
    description: Cluster (variabile APP_DOMAIN dell'Environment)
    variables:
      appDomain:
        default: app.tuodominio.it

security:
  - bearerAuth: []

tags:
  - name: Account
  - name: Soci
  - name: Attività
  - name: Istruttori
  - name: Incontri
  - name: Voucher
  - name: Tesseramenti
    description: |
      **Modulo opzionale.** Presenti solo dove la variabile `ENABLE_MODULE_TESSERAMENTO`
      dell'ambiente vale `true`; altrove rispondono `404` come un percorso inesistente,
      qualunque sia il ruolo di chi chiama.
  - name: Documenti
    description: |
      Voci ancora da documentare ed emissione delle ricevute in PDF.

      **Modulo opzionale.** Presenti solo dove la variabile `ENABLE_MODULE_RICEVUTE`
      dell'ambiente vale `true`; altrove rispondono `404` come un percorso inesistente,
      qualunque sia il ruolo di chi chiama.
  - name: Impostazioni
  - name: Amministrazione
    description: |
      Gli endpoint sugli account sono inoltrati all'authorizer con il token dell'admin
      che chiama: si applicano i controlli dell'authorizer sull'identità reale e i suoi
      errori tornano con lo stesso codice. `utente_id` accetta sia l'id dell'account sia
      la sua email.
  - name: Servizio

paths:
  /api/auth/socio:
    get:
      tags: [Account]
      summary: Scheda socio di chi chiama
      description: Sola lettura. Il collegamento fra account e socio lo fa sempre un admin.
      responses:
        '200':
          description: Scheda socio collegata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '204':
          description: L'account non è ancora collegato a una scheda socio
        '401':
          $ref: '#/components/responses/NonAutenticato'

  /api/version:
    get:
      tags: [Servizio]
      summary: Versione del backend in esecuzione
      description: |
        Pubblica: la legge la pagina Info anche prima dell'accesso, quindi un
        token assente o non valido viene ignorato. Stesso modello di
        `GET /version` dell'authorizer.
      security: []
      responses:
        '200':
          description: |
            Tag dell'immagine deployata (`APP_VERSION`), `null` se l'ambiente
            non la dichiara — in locale, di norma.
          content:
            application/json:
              schema:
                type: object
                required: [version, db]
                properties:
                  version:
                    type: [string, 'null']
                    example: 1.4.0
                  db:
                    type: [string, 'null']
                    description: |
                      Versione dello schema: numero dell'ultima migrazione
                      applicata (tabella `migrazione`). `null` se il registro
                      manca o il database non risponde — l'endpoint non fallisce.
                    example: '003'

  /health:
    get:
      tags: [Servizio]
      summary: Sonda di liveness
      security: []
      responses:
        '200':
          description: Servizio in esecuzione
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------------------
  /api/soci:
    get:
      tags: [Soci]
      summary: Elenco dei soci
      description: |
        - admin: tutti i soci, scheda completa;
        - istruttore: tutti i soci, solo id e nominativo;
        - socio: un elenco con la sola propria scheda, vuoto se non collegato.

        Senza `limit`/`offset`: l'elenco completo in ordine di cognome e nome (per i menu
        di scelta). Con `limit` o `offset`: una pagina, con ricerca e ordinamento applicati
        dal database. L'istruttore cerca e ordina solo per cognome e nome.

        A modulo tesseramento attivo la pagina dell'admin porta anche `numero_tessera`
        (il numero del tesseramento più recente), su cui si cerca e si ordina.
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          description: Solo con paginazione. `numero_tessera` solo per l'admin, a modulo tesseramento attivo
          schema:
            type: string
            enum: [cognome, nome, email, telefono, data_iscrizione, numero_tessera]
            default: cognome
        - $ref: '#/components/parameters/Dir'
        - name: senza_account
          in: query
          description: Solo con paginazione e solo admin; le schede non collegate ad alcun account
          schema:
            type: string
            enum: ['1']
        - $ref: '#/components/parameters/LimitElenco'
        - $ref: '#/components/parameters/OffsetElenco'
      responses:
        '200':
          description: Soci, completi o a pagina
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/Socio'
                        - $ref: '#/components/schemas/SocioRidotto'
                  - allOf:
                      - $ref: '#/components/schemas/PaginaBase'
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              anyOf:
                                - $ref: '#/components/schemas/Socio'
                                - $ref: '#/components/schemas/SocioRidotto'
        '401':
          $ref: '#/components/responses/NonAutenticato'
    post:
      tags: [Soci]
      summary: Crea un socio
      description: Solo admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoSocio'
      responses:
        '201':
          description: Socio creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'

  /api/soci/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Soci]
      summary: Dettaglio di un socio
      description: Admin, oppure il socio stesso.
      responses:
        '200':
          description: Scheda socio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    patch:
      tags: [Soci]
      summary: Modifica un socio
      description: |
        Solo admin. Si aggiornano solo i campi presenti. L'email di un socio collegato
        a un account non è modificabile: è quella con cui la persona accede.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaSocio'
      responses:
        '200':
          description: Socio aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    put:
      tags: [Soci]
      summary: Modifica un socio (deprecato, usare PATCH)
      deprecated: true
      description: |
        **Deprecato** (spec 008, fase 1): alias di `PATCH`, con lo stesso corpo e le
        stesse risposte. Ogni chiamata lascia nel log del backend la riga
        `[deprecato] PUT <percorso>: usare PATCH`; nella fase 2 risponde 404.

        Solo admin. Si aggiornano solo i campi presenti. L'email di un socio collegato
        a un account non è modificabile: è quella con cui la persona accede.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaSocio'
      responses:
        '200':
          description: Socio aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    delete:
      tags: [Soci]
      summary: Elimina un socio
      description: Solo admin. Elimina anche incontri, voucher e tesseramenti del socio.
      responses:
        '204':
          description: Socio eliminato
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  # ---------------------------------------------------------------------------
  /api/attivita:
    get:
      tags: [Attività]
      summary: Listino delle attività
      description: |
        - istruttore (non admin): solo le attività attive a cui è abilitato;
        - admin: le attività attive, oppure tutte con `tutte=1`;
        - socio: le attività attive.

        In ordine di nome.
      parameters:
        - name: tutte
          in: query
          description: Con `1` include le attività disattivate. Considerato solo per gli admin.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Attività
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attivita'
        '401':
          $ref: '#/components/responses/NonAutenticato'
    post:
      tags: [Attività]
      summary: Crea un'attività
      description: Solo admin. Il nome è unico senza distinzione di maiuscole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome:
                  type: string
                costo_default:
                  type: number
                  minimum: 0
                  default: 0
                attiva:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Attività creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attivita'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '409':
          $ref: '#/components/responses/Conflitto'

  /api/attivita/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Attività]
      summary: Modifica un'attività
      description: Solo admin. Si aggiornano solo i campi presenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome:
                  type: string
                costo_default:
                  type: number
                  minimum: 0
                attiva:
                  type: boolean
      responses:
        '200':
          description: Attività aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attivita'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
    put:
      tags: [Attività]
      summary: Modifica un'attività (deprecato, usare PATCH)
      deprecated: true
      description: |
        **Deprecato** (spec 008, fase 1): alias di `PATCH`, con lo stesso corpo e le
        stesse risposte. Ogni chiamata lascia nel log del backend la riga
        `[deprecato] PUT <percorso>: usare PATCH`; nella fase 2 risponde 404.

        Solo admin. Si aggiornano solo i campi presenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome:
                  type: string
                costo_default:
                  type: number
                  minimum: 0
                attiva:
                  type: boolean
      responses:
        '200':
          description: Attività aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attivita'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
    delete:
      tags: [Attività]
      summary: Elimina un'attività
      description: Solo admin. Rifiutato se l'attività ha incontri collegati; in quel caso si può disattivarla.
      responses:
        '204':
          description: Attività eliminata
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          description: L'attività ha incontri collegati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  # ---------------------------------------------------------------------------
  /api/istruttori:
    get:
      tags: [Istruttori]
      summary: Istruttori attivi
      description: |
        Account istruttore attivi, con il nominativo della scheda socio collegata
        (`null` se non collegata). Per gli admin ogni riga include anche `attivita_ids`.
      responses:
        '200':
          description: Istruttori, in ordine di email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Istruttore'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '503':
          $ref: '#/components/responses/AuthorizerIrraggiungibile'

  /api/istruttori/{id}/attivita:
    parameters:
      - name: id
        in: path
        required: true
        description: Id dell'account istruttore
        schema:
          type: string
          format: uuid
    get:
      tags: [Istruttori]
      summary: Abilitazioni di un istruttore
      description: Solo admin.
      responses:
        '200':
          description: Id delle attività abilitate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abilitazioni'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    put:
      tags: [Istruttori]
      summary: Sostituisce le abilitazioni di un istruttore
      description: Solo admin. L'elenco inviato sostituisce per intero quello attuale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Abilitazioni'
      responses:
        '200':
          description: Abilitazioni salvate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abilitazioni'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          description: Una delle attività indicate non esiste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  # ---------------------------------------------------------------------------
  /api/incontri:
    get:
      tags: [Incontri]
      summary: Elenco paginato degli incontri
      description: |
        Quali incontri si ricevono:
        - `ambito=istruttore`: quelli tenuti da chi chiama (vuoto se non è istruttore);
        - `ambito=socio`: quelli a cui chi chiama ha partecipato come socio;
        - senza `ambito`: tutti per un admin (filtrabili con `socio_id` e
          `istruttore_id`), altrimenti come `ambito=socio`.

        Per chi non è admin `socio_id` e `istruttore_id` sono ignorati. Filtri e
        ordinamento sono applicati dal database; `totale_costo` somma l'intero
        risultato filtrato.
      parameters:
        - name: ambito
          in: query
          schema:
            type: string
            enum: [socio, istruttore]
        - name: socio_id
          in: query
          description: Solo admin, senza ambito
          schema:
            type: string
            format: uuid
        - name: istruttore_id
          in: query
          description: Solo admin, senza ambito
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: |
            Ricerca parola per parola: ogni parola deve comparire nel cognome, nel nome o
            nell'attività, in qualunque ordine (es. "rossi mar" trova Mario Rossi)
          schema:
            type: string
        - name: attivita_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Da'
        - $ref: '#/components/parameters/A'
        - name: sort
          in: query
          schema:
            type: string
            enum: [socioNome, data_incontro, attivita, istruttore, costo]
            default: data_incontro
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina di incontri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaIncontri'
        '401':
          $ref: '#/components/responses/NonAutenticato'
    post:
      tags: [Incontri]
      summary: Registra un incontro
      description: |
        Admin o istruttore. Per un istruttore l'istruttore dell'incontro è sempre chi
        chiama (`istruttore_id` inviato è ignorato) e deve essere abilitato all'attività.

        Se il socio ha un voucher, nella stessa transazione viene creato un addebito pari
        al costo, datato come l'incontro. Il saldo può andare, o restare, sotto zero: la
        conferma la chiede l'interfaccia, il backend non rifiuta (spec 010).

        Un incontro di gruppo non ha un endpoint proprio: il frontend chiama questa
        creazione una volta per socio, con gli stessi dati comuni e la nota di ciascuno.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoIncontro'
      responses:
        '201':
          description: Incontro creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incontro'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          description: Socio o attività non trovati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  /api/incontri/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Incontri]
      summary: Dettaglio di un incontro
      description: Admin, il socio che vi ha partecipato o l'istruttore che lo ha tenuto.
      responses:
        '200':
          description: Incontro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incontro'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    patch:
      tags: [Incontri]
      summary: Modifica un incontro
      description: |
        Admin, oppure l'istruttore che lo ha tenuto, che non può cambiare `istruttore_id`
        e può scegliere solo attività a cui è abilitato. Il socio non è modificabile.

        Il movimento di addebito collegato segue le modifiche: importo se cambia il costo,
        data e descrizione se cambiano data o attività. Un nuovo costo si addebita anche
        se il voucher è già sotto zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaIncontro'
      responses:
        '200':
          description: Incontro aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incontro'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    put:
      tags: [Incontri]
      summary: Modifica un incontro (deprecato, usare PATCH)
      deprecated: true
      description: |
        **Deprecato** (spec 008, fase 1): alias di `PATCH`, con lo stesso corpo e le
        stesse risposte. Ogni chiamata lascia nel log del backend la riga
        `[deprecato] PUT <percorso>: usare PATCH`; nella fase 2 risponde 404.

        Admin, oppure l'istruttore che lo ha tenuto, che non può cambiare `istruttore_id`
        e può scegliere solo attività a cui è abilitato. Il socio non è modificabile.

        Il movimento di addebito collegato segue le modifiche: importo se cambia il costo,
        data e descrizione se cambiano data o attività. Un nuovo costo si addebita anche
        se il voucher è già sotto zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaIncontro'
      responses:
        '200':
          description: Incontro aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incontro'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    delete:
      tags: [Incontri]
      summary: Elimina un incontro
      description: Admin, oppure l'istruttore che lo ha tenuto. Elimina anche il movimento di addebito collegato.
      responses:
        '204':
          description: Incontro eliminato
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  # ---------------------------------------------------------------------------
  /api/voucher:
    get:
      tags: [Voucher]
      summary: Elenco dei voucher con saldo
      description: |
        - admin e istruttore: tutti i voucher, filtrabili con `socio_id`;
        - socio: solo il proprio (vuoto se non collegato), `socio_id` ignorato.

        Senza `limit`/`offset`: l'elenco completo, dal più recente. Con `limit` o `offset`:
        una pagina, dove ogni riga porta anche il nominativo del socio, con ricerca (sul
        nominativo) e ordinamento applicati dal database.
      parameters:
        - name: socio_id
          in: query
          schema:
            type: string
            format: uuid
        - name: escludi_socio_id
          in: query
          description: Solo con paginazione; tutti i voucher tranne quello di questo socio
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          description: Solo con paginazione
          schema:
            type: string
            enum: [socioNome, data_creazione, saldo_iniziale, saldo_residuo]
            default: socioNome
        - $ref: '#/components/parameters/Dir'
        - $ref: '#/components/parameters/LimitElenco'
        - $ref: '#/components/parameters/OffsetElenco'
      responses:
        '200':
          description: Voucher, completi o a pagina
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Voucher'
                  - allOf:
                      - $ref: '#/components/schemas/PaginaBase'
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/Voucher'
                                - type: object
                                  required: [nome, cognome]
                                  properties:
                                    nome:
                                      type: string
                                    cognome:
                                      type: string
        '401':
          $ref: '#/components/responses/NonAutenticato'
    post:
      tags: [Voucher]
      summary: Attiva il voucher di un socio
      description: |
        Solo admin, un voucher per socio. `ricarica` è il credito acquistato: diventa la
        prima ricarica ("Acquisto voucher"), registrabile. `saldo_iniziale` è il
        credito importato da un voucher già in uso prima di Clubby: non è una ricarica e
        non è registrabile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoVoucher'
      responses:
        '201':
          description: Voucher attivato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
        '400':
          description: Dati non validi, oppure il socio ha già un voucher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          description: Socio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  /api/voucher/{id}/movimenti:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Voucher]
      summary: Movimenti di un voucher
      description: Admin, oppure il socio titolare. Paginati, dal più recente.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina di movimenti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMovimenti'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
    post:
      tags: [Voucher]
      summary: Registra una ricarica
      description: |
        Solo admin; datata `data_movimento`, oppure oggi. Gli addebiti non si inseriscono da
        qui: nascono solo dagli incontri, e un `tipo` diverso da `ricarica` è rifiutato con 400.

        `importo` è quanto **paga** il socio. Quanto viene accreditato sul voucher lo decide
        il server secondo la variabile d'ambiente `RECHARGE_MODE`:

        - `free` (predefinita): accreditato quanto pagato;
        - `percentage`: accreditato l'importo più la percentuale configurata
          (`percentuale_ricarica` in `/api/impostazioni`);
        - `map`: l'importo deve corrispondere a un taglio di `/api/ricarica-tagli`, da cui si
          legge il valore accreditato — un importo non previsto è rifiutato con 400.

        Nella risposta `importo` è il credito accreditato e `importo_pagato` quanto è stato
        pagato, quando le due cose differiscono. Le ricevute contano il pagato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoMovimento'
      responses:
        '201':
          description: Movimento registrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movimento'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/ricarica-tagli:
    get:
      tags: [Voucher]
      summary: Tagli di ricarica configurati
      description: |
        Solo admin. Dal più economico: è l'ordine in cui compaiono nella select della
        ricarica. Usati dove la variabile d'ambiente `RECHARGE_MODE` vale `map`, ma
        configurabili anche prima di attivarla.
      responses:
        '200':
          description: Tagli configurati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaglioRicarica'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    post:
      tags: [Voucher]
      summary: Aggiunge un taglio di ricarica
      description: |
        Solo admin. `importo` è quanto paga il socio, `valore` quanto gli viene
        accreditato sul voucher. Rifiutato con 400 se esiste già un taglio con lo stesso
        importo, o se il valore è inferiore all'importo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importo, valore]
              properties:
                importo:
                  $ref: '#/components/schemas/Importo'
                valore:
                  $ref: '#/components/schemas/Importo'
      responses:
        '201':
          description: Taglio creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaglioRicarica'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'

  /api/ricarica-tagli/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Voucher]
      summary: Rimuove un taglio di ricarica
      description: |
        Solo admin. Le ricariche già registrate non cambiano: hanno il proprio valore
        scritto sulla riga del movimento, non un riferimento al taglio.
      responses:
        '204':
          description: Taglio rimosso
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/voucher/{id}/ultima-ricarica:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Voucher]
      summary: Ultima ricarica di un voucher
      description: |
        Admin, oppure il socio titolare — stesso confine dei movimenti: è una riga dello
        storico contabile, non un saldo, quindi un istruttore non la vede.

        Endpoint a sé e non due campi negli elenchi dei voucher: serve solo alla scheda del
        proprio voucher, e negli elenchi verrebbe calcolato per ogni riga di ogni pagina.
      responses:
        '200':
          description: Ultima ricarica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UltimaRicarica'
        '204':
          description: Il voucher non ha ancora ricevuto ricariche
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  # ---------------------------------------------------------------------------
  /api/tesseramenti:
    get:
      tags: [Tesseramenti]
      summary: Situazione dei tesseramenti
      description: |
        Solo admin. Ogni socio con l'ultimo rinnovo.

        Senza `limit`/`offset`: l'elenco completo in ordine di cognome e nome. Con `limit` o
        `offset`: una pagina, con lo `stato` di ogni socio calcolato dal database (in scadenza
        = entro 30 giorni), ricerca, filtro per stato e ordinamento, più `conteggi`: quanti
        soci ci sono in ogni stato, su tutti i soci e non sulla pagina. Ordinando per stato,
        prima gli scaduti, poi quelli in scadenza, gli attivi e i mai tesserati.
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: stato
          in: query
          description: Solo con paginazione
          schema:
            $ref: '#/components/schemas/StatoTesseramento'
        - name: sort
          in: query
          description: Solo con paginazione
          schema:
            type: string
            enum: [socioNome, ultimo_rinnovo, scadenza, stato, rinnovi]
            default: socioNome
        - $ref: '#/components/parameters/Dir'
        - $ref: '#/components/parameters/LimitElenco'
        - $ref: '#/components/parameters/OffsetElenco'
      responses:
        '200':
          description: Situazione per socio, completa o a pagina
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/SituazioneTesseramento'
                  - allOf:
                      - $ref: '#/components/schemas/PaginaBase'
                      - type: object
                        required: [conteggi]
                        properties:
                          data:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/SituazioneTesseramento'
                                - type: object
                                  required: [stato]
                                  properties:
                                    stato:
                                      $ref: '#/components/schemas/StatoTesseramento'
                          conteggi:
                            type: object
                            required: [attivo, in_scadenza, scaduto, mai]
                            properties:
                              attivo:
                                type: integer
                              in_scadenza:
                                type: integer
                              scaduto:
                                type: integer
                              mai:
                                type: integer
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    post:
      tags: [Tesseramenti]
      summary: Registra un rinnovo
      description: |
        Solo admin. Registra un rinnovo, o il primo tesseramento. La nuova scadenza
        deve seguire la data del rinnovo e l'eventuale scadenza precedente. Senza
        `importo` si usa la quota delle impostazioni. `numero_tessera` è obbligatorio
        e appartiene a un solo socio: già usato da un altro → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoRinnovo'
      responses:
        '201':
          description: Rinnovo registrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tesseramento'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          description: Socio non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'
        '409':
          $ref: '#/components/responses/Conflitto'

  /api/tesseramenti/rinnovi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del tesseramento (non del socio)
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tesseramenti]
      summary: Corregge il numero di tessera
      description: |
        Modifica parziale (`PATCH`): cambia solo il numero, non sostituisce il tesseramento.
        Solo admin, e solo sul **tesseramento in corso** del socio: il più recente, con
        la scadenza non ancora passata. Su un tesseramento superato da un rinnovo o
        scaduto → 409. Date e quota non si modificano. Stesse regole del rinnovo sul
        numero: obbligatorio, al massimo 30 caratteri, di un solo socio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero_tessera]
              properties:
                numero_tessera:
                  type: string
                  maxLength: 30
      responses:
        '200':
          description: Tesseramento aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tesseramento'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'

  /api/tesseramenti/{socioId}:
    parameters:
      - name: socioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tesseramenti]
      summary: Storico dei rinnovi di un socio
      description: |
        Admin, **o il socio stesso**: è l'unica rotta dell'area aperta oltre l'admin.
        Il confronto è con la scheda socio collegata all'account, non con il parametro:
        chiedere l'id di un altro risponde 403. In ordine di scadenza, dalla più recente.
        Ogni riga porta il proprio `stato`: quello della prima è lo stato del socio,
        `mai` se l'elenco è vuoto.
      responses:
        '200':
          description: Rinnovi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tesseramento'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  # ---------------------------------------------------------------------------
  /api/documenti/voci:
    get:
      tags: [Documenti]
      summary: Voci ancora da documentare
      description: |
        Solo admin. Tre fonti: ricariche dei voucher, quote dei tesseramenti e incontri
        non coperti da un voucher. Addebiti e saldi iniziali dei voucher sono esclusi.

        Prima i tesseramenti, poi tutto il resto dalla data più recente.
        `totale_importo` somma l'intero risultato filtrato.

        Per default contiene solo ciò che resta da registrare: le voci già comprese in
        una ricevuta tornano solo con `includi_emesse=1`.
      parameters:
        - name: socio_id
          in: query
          schema:
            type: string
            format: uuid
        - name: includi_emesse
          in: query
          description: Solo il valore esatto `1` comprende anche le voci già documentate.
          schema:
            type: string
            enum: ['1']
        - $ref: '#/components/parameters/Da'
        - $ref: '#/components/parameters/A'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina di voci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaVoci'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'

  # ---------------------------------------------------------------------------
  /api/documenti/anteprima:
    post:
      tags: [Documenti]
      summary: Anteprima di una ricevuta
      description: |
        Solo admin. Genera il PDF e lo restituisce **senza scrivere niente**: nessun
        documento viene creato e nessun numero viene consumato.

        `numero_provvisorio` è quello che il documento avrebbe se venisse confermato
        adesso; fra l'anteprima e la conferma un altro admin può emettere, quindi il
        PDF definitivo viene rigenerato con il numero vero.

        L'importo è sempre ricalcolato dal database: quello eventualmente mandato dal
        client viene ignorato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissioneInput'
      responses:
        '200':
          description: PDF dell'anteprima, in base64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnteprimaDocumento'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'

  # ---------------------------------------------------------------------------
  /api/documenti:
    get:
      tags: [Documenti]
      summary: Ricevute emesse
      description: |
        Solo admin. Elenco paginato dei documenti, **senza** i byte dei PDF: quelli si
        scaricano uno alla volta da `/api/documenti/{id}`.
      parameters:
        - name: socio_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Da'
        - $ref: '#/components/parameters/A'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina di ricevute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDocumenti'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    post:
      tags: [Documenti]
      summary: Emette una ricevuta
      description: |
        Solo admin. Assegna il numero definitivo, genera il PDF, lo conserva e lega le
        voci al documento — tutto in un'unica transazione.

        Una ricevuta emessa **non si annulla e non si elimina**: è per questo che
        esiste l'anteprima.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissioneInput'
      responses:
        '201':
          description: Ricevuta emessa, con il PDF in base64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoEmesso'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '409':
          description: |
            Una delle voci selezionate è stata documentata nel frattempo. L'importo non
            sarebbe più quello visto in anteprima, quindi non viene emesso niente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  # ---------------------------------------------------------------------------
  /api/documenti/{id}:
    get:
      tags: [Documenti]
      summary: Scarica una ricevuta
      description: |
        Restituisce il PDF conservato, con `Content-Type: application/pdf`.

        È l'**unica** rotta dell'area aperta oltre l'admin: la può leggere anche il
        socio a cui la ricevuta è intestata, perché è ciò che rende utile l'icona
        nei suoi movimenti. Il controllo confronta `socio_id` del documento con la
        scheda di chi chiama, non il ruolo: un socio che prova l'id di un altro
        riceve `403`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Il PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  # ---------------------------------------------------------------------------
  /api/impostazioni:
    get:
      tags: [Impostazioni]
      summary: Parametri dell'associazione
      description: Solo admin.
      responses:
        '200':
          description: Impostazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impostazioni'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    patch:
      tags: [Impostazioni]
      summary: Modifica i parametri dell'associazione
      description: Solo admin. Si aggiornano solo i campi presenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Impostazioni'
      responses:
        '200':
          description: Impostazioni aggiornate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impostazioni'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
    put:
      tags: [Impostazioni]
      summary: Modifica i parametri dell'associazione (deprecato, usare PATCH)
      deprecated: true
      description: |
        **Deprecato** (spec 008, fase 1): alias di `PATCH`, con lo stesso corpo e le
        stesse risposte. Ogni chiamata lascia nel log del backend la riga
        `[deprecato] PUT <percorso>: usare PATCH`; nella fase 2 risponde 404.

        Solo admin. Si aggiornano solo i campi presenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Impostazioni'
      responses:
        '200':
          description: Impostazioni aggiornate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impostazioni'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'

  # ---------------------------------------------------------------------------
  /api/admin/users:
    get:
      tags: [Amministrazione]
      summary: Account con il socio collegato
      description: |
        Solo admin. Account dell'authorizer, arricchiti con i dati della scheda socio collegata.

        Senza `limit`/`offset`: l'elenco completo, in ordine di email. Con `limit` o `offset`:
        una pagina, con in cima gli account non collegati e poi gli altri per nominativo, più
        `da_collegare` (account attivi senza scheda, su tutti gli account). La paginazione è
        fatta dal backend dopo aver unito account e soci, che stanno in due database diversi.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/LimitElenco'
        - $ref: '#/components/parameters/OffsetElenco'
      responses:
        '200':
          description: Account, completi o a pagina
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/UtenteAmministrabile'
                  - allOf:
                      - $ref: '#/components/schemas/PaginaBase'
                      - type: object
                        required: [da_collegare]
                        properties:
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/UtenteAmministrabile'
                          da_collegare:
                            type: integer
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '503':
          $ref: '#/components/responses/AuthorizerIrraggiungibile'

  /api/admin/associa-viewer:
    post:
      tags: [Amministrazione]
      summary: Collega un account a un socio
      description: |
        Solo admin. Copia sul socio l'email dell'account. Rifiutato se l'account è già
        collegato a un altro socio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socio_id, utente_id]
              properties:
                socio_id:
                  type: string
                  format: uuid
                utente_id:
                  $ref: '#/components/schemas/RiferimentoUtente'
      responses:
        '200':
          $ref: '#/components/responses/Messaggio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          description: Account o socio non trovati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errore'

  /api/admin/associa-viewer/{socioId}:
    delete:
      tags: [Amministrazione]
      summary: Scollega l'account da un socio
      description: Solo admin. Lo stato dell'account non cambia.
      parameters:
        - name: socioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account scollegato
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/admin/ruolo:
    post:
      tags: [Amministrazione]
      summary: Assegna il ruolo nel club
      description: Solo admin. Chiude le sessioni dell'interessato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utente_id, ruolo]
              properties:
                utente_id:
                  $ref: '#/components/schemas/RiferimentoUtente'
                ruolo:
                  type: string
                  enum: [socio, istruttore]
      responses:
        '200':
          $ref: '#/components/responses/Messaggio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/admin/amministratore:
    post:
      tags: [Amministrazione]
      summary: Concede o toglie il privilegio admin
      description: Solo admin, non su sé stessi. Qualunque valore di `admin` diverso da `true` toglie il privilegio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utente_id, admin]
              properties:
                utente_id:
                  $ref: '#/components/schemas/RiferimentoUtente'
                admin:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Messaggio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/admin/attivo:
    post:
      tags: [Amministrazione]
      summary: Attiva o disattiva un account
      description: |
        Solo admin, non su sé stessi. La disattivazione chiude le sessioni; il
        collegamento alla scheda socio resta. Qualunque valore di `attivo` diverso da
        `true` disattiva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utente_id, attivo]
              properties:
                utente_id:
                  $ref: '#/components/schemas/RiferimentoUtente'
                attivo:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Messaggio'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

  /api/admin/reset-password:
    post:
      tags: [Amministrazione]
      summary: Azzera la password di un account
      description: |
        Solo admin. Restituisce una password temporanea, visibile solo in questa
        risposta, da sostituire al primo accesso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpoUtente'
      responses:
        '200':
          description: Password temporanea
          content:
            application/json:
              schema:
                type: object
                required: [password_temporanea]
                properties:
                  password_temporanea:
                    type: string
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/AccessoNegato'
        '404':
          $ref: '#/components/responses/NonTrovato'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emesso dall'authorizer.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Da:
      name: da
      in: query
      description: Data iniziale inclusa
      schema:
        type: string
        format: date
    A:
      name: a
      in: query
      description: Data finale inclusa
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitElenco:
      name: limit
      in: query
      description: Con limit o offset la risposta è una pagina; senza, l'elenco completo
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    OffsetElenco:
      name: offset
      in: query
      description: Con limit o offset la risposta è una pagina; senza, l'elenco completo
      schema:
        type: integer
        minimum: 0
        default: 0
    Q:
      name: q
      in: query
      description: Ricerca parola per parola, in qualunque ordine (solo con paginazione, tranne dove indicato)
      schema:
        type: string
    Dir:
      name: dir
      in: query
      description: Solo con paginazione
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    RichiestaNonValida:
      description: Dati mancanti o non validi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonAutenticato:
      description: Token mancante, non valido o scaduto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    AccessoNegato:
      description: Chi chiama non ha i permessi per questa operazione
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonTrovato:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    Conflitto:
      description: Esiste già un elemento con lo stesso nome
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    AuthorizerIrraggiungibile:
      description: Il servizio di autenticazione non risponde
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    Messaggio:
      description: Operazione eseguita
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

  schemas:
    Errore:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: Accesso riservato agli amministratori

    Importo:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Importo decimale serializzato come stringa
      example: '25.00'

    PaginaBase:
      type: object
      description: Campi comuni degli elenchi a pagine
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          description: Righe che soddisfano i filtri, non quelle restituite
        limit:
          type: integer
        offset:
          type: integer

    StatoTesseramento:
      type: string
      enum: [attivo, in_scadenza, scaduto, mai]

    RiferimentoUtente:
      type: string
      description: Id dell'account oppure la sua email
      example: mario.rossi@example.com

    CorpoUtente:
      type: object
      required: [utente_id]
      properties:
        utente_id:
          $ref: '#/components/schemas/RiferimentoUtente'

    Socio:
      type: object
      required: [id, nome, cognome, email, telefono, data_iscrizione, id_viewer, note, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        cognome:
          type: string
        email:
          type: [string, 'null']
        telefono:
          type: [string, 'null']
        data_iscrizione:
          type: string
          format: date
        id_viewer:
          type: [string, 'null']
          format: uuid
          description: Id dell'account collegato
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        numero_tessera:
          type: [string, 'null']
          description: |
            Numero del tesseramento più recente; null se non ne ha uno. Solo nella pagina
            dell'admin (`GET /api/soci` con paginazione), a modulo tesseramento attivo.

    SocioRidotto:
      type: object
      description: Socio come lo vede un istruttore
      required: [id, nome, cognome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        cognome:
          type: string

    NuovoSocio:
      type: object
      required: [nome, cognome]
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        telefono:
          type: string
        data_iscrizione:
          type: string
          format: date
          description: Omessa = oggi
        note:
          type: string

    ModificaSocio:
      type: object
      minProperties: 1
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        telefono:
          type: string
        note:
          type: string

    Attivita:
      type: object
      required: [id, nome, costo_default, attiva, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        costo_default:
          type: number
          description: Costo proposto quando si registra un incontro
        attiva:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Istruttore:
      type: object
      required: [id, email, nome, cognome]
      properties:
        id:
          type: string
          format: uuid
          description: Id dell'account
        email:
          type: string
        nome:
          type: [string, 'null']
        cognome:
          type: [string, 'null']
        attivita_ids:
          type: array
          description: Solo per gli admin
          items:
            type: string
            format: uuid

    Abilitazioni:
      type: object
      required: [attivita_ids]
      properties:
        attivita_ids:
          type: array
          items:
            type: string
            format: uuid

    Incontro:
      type: object
      required: [id, socio_id, data_incontro, attivita_id, istruttore_id, costo, note, note_markdown, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        socio_id:
          type: string
          format: uuid
        data_incontro:
          type: string
          format: date
        attivita_id:
          type: string
          format: uuid
        attivita:
          type: string
          description: Nome dell'attività
        istruttore_id:
          type: [string, 'null']
          format: uuid
          description: Account dell'istruttore che lo ha tenuto
        costo:
          $ref: '#/components/schemas/Importo'
        note:
          type: [string, 'null']
        note_markdown:
          type: boolean
          description: Le note sono in Markdown
        documento_id:
          type: [string, 'null']
          format: uuid
          description: |
            La ricevuta che comprende questa riga. Presente solo a modulo ricevute attivo
            e per chi ne è intestatario: l'admin sempre, il socio sui propri dati. Un
            istruttore che guarda gli incontri che ha solo tenuto non riceve il campo.
        documento_anno:
          type: [integer, 'null']
          description: Anno della ricevuta; con il numero forma il codice mostrato e il nome del file.
          example: 2026
        documento_numero:
          type: [integer, 'null']
          description: Numero della ricevuta nell'anno.
          example: 60
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RigaIncontro:
      description: Incontro in un elenco, con il nominativo del socio
      allOf:
        - $ref: '#/components/schemas/Incontro'
        - type: object
          required: [nome, cognome, attivita]
          properties:
            nome:
              type: string
            cognome:
              type: string

    NuovoIncontro:
      type: object
      required: [socio_id, data_incontro, attivita_id, costo]
      properties:
        socio_id:
          type: string
          format: uuid
        data_incontro:
          type: string
          format: date
        attivita_id:
          type: string
          format: uuid
        istruttore_id:
          type: [string, 'null']
          format: uuid
          description: Considerato solo per gli admin
        costo:
          type: number
          minimum: 0
        note:
          type: string
        note_markdown:
          type: boolean
          default: false

    ModificaIncontro:
      type: object
      minProperties: 1
      properties:
        data_incontro:
          type: string
          format: date
        attivita_id:
          type: string
          format: uuid
        istruttore_id:
          type: [string, 'null']
          format: uuid
          description: Considerato solo per gli admin
        costo:
          type: number
          minimum: 0
        note:
          type: string
        note_markdown:
          type: boolean

    PaginaIncontri:
      type: object
      required: [data, total, totale_costo, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RigaIncontro'
        total:
          type: integer
        totale_costo:
          type: number
        limit:
          type: integer
        offset:
          type: integer

    Voucher:
      type: object
      required: [id, socio_id, data_creazione, saldo_iniziale, saldo_residuo, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        socio_id:
          type: string
          format: uuid
        data_creazione:
          type: string
          format: date
        saldo_iniziale:
          $ref: '#/components/schemas/Importo'
        saldo_residuo:
          $ref: '#/components/schemas/Importo'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UltimaRicarica:
      type: object
      required: [data_movimento, importo]
      properties:
        data_movimento:
          type: string
          format: date
        importo:
          $ref: '#/components/schemas/Importo'

    NuovoVoucher:
      type: object
      required: [socio_id]
      properties:
        socio_id:
          type: string
          format: uuid
        ricarica:
          type: number
          exclusiveMinimum: 0
          description: Credito acquistato
        saldo_iniziale:
          type: number
          minimum: 0
          default: 0
          description: Credito importato da un voucher precedente a Clubby

    Movimento:
      type: object
      required: [id, voucher_id, incontro_id, tipo, data_movimento, importo, importo_pagato, descrizione, created_at]
      properties:
        id:
          type: string
          format: uuid
        voucher_id:
          type: string
          format: uuid
        incontro_id:
          type: [string, 'null']
          format: uuid
          description: Incontro che ha generato l'addebito
        tipo:
          type: string
          enum: [ricarica, addebito]
        data_movimento:
          type: string
          format: date
        importo:
          $ref: '#/components/schemas/Importo'
        importo_pagato:
          description: |
            Solo per le ricariche con valore extra (`RECHARGE_MODE` `percentage` o `map`):
            quanto ha pagato davvero il socio, quando è meno del credito accreditato in
            `importo`. `null` quando le due cose coincidono. È questo che le ricevute
            contano come incasso.
          oneOf:
            - $ref: '#/components/schemas/Importo'
            - type: 'null'
        descrizione:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        documento_id:
          type: [string, 'null']
          format: uuid
          description: |
            La ricevuta che comprende questa ricarica. `null` su addebiti e rettifiche,
            che non sono voci documentabili, e sulle ricariche marcate come emesse prima
            che l'applicazione producesse documenti.
        documento_anno:
          type: [integer, 'null']
          description: Anno della ricevuta. Con `documento_numero` forma il codice mostrato all'utente e il nome del file (`ricevuta_<anno>_<numero>.pdf`).
          example: 2026
        documento_numero:
          type: [integer, 'null']
          description: Numero della ricevuta nell'anno. `null` esattamente quando lo è `documento_id`.
          example: 60

    TaglioRicarica:
      type: object
      required: [id, importo, valore]
      properties:
        id:
          type: string
          format: uuid
        importo:
          $ref: '#/components/schemas/Importo'
        valore:
          $ref: '#/components/schemas/Importo'
        created_at:
          type: string
          format: date-time

    NuovoMovimento:
      type: object
      required: [importo]
      properties:
        importo:
          type: number
          exclusiveMinimum: 0
        descrizione:
          type: string
        data_movimento:
          type: string
          format: date
          description: Data della ricarica; omessa = oggi
        tipo:
          type: string
          enum: [ricarica]
          description: Facoltativo; l'unico valore ammesso è `ricarica`

    PaginaMovimenti:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Movimento'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Tesseramento:
      type: object
      required: [id, socio_id, data_rinnovo, scadenza, importo, created_at]
      properties:
        id:
          type: string
          format: uuid
        socio_id:
          type: string
          format: uuid
        data_rinnovo:
          type: string
          format: date
        scadenza:
          type: string
          format: date
        importo:
          $ref: '#/components/schemas/Importo'
        numero_tessera:
          type: [string, 'null']
          maxLength: 30
          description: null sui tesseramenti registrati prima che il numero si chiedesse
        stato:
          $ref: '#/components/schemas/StatoTesseramento'
          description: Solo nello storico di un socio; calcolato con la stessa regola della situazione
        created_at:
          type: string
          format: date-time
        documento_id:
          type: [string, 'null']
          format: uuid
          description: |
            La ricevuta che comprende questa riga. Presente solo a modulo ricevute attivo
            e per chi ne è intestatario: l'admin sempre, il socio sui propri dati. Un
            istruttore che guarda gli incontri che ha solo tenuto non riceve il campo.
        documento_anno:
          type: [integer, 'null']
          description: Anno della ricevuta; con il numero forma il codice mostrato e il nome del file.
          example: 2026
        documento_numero:
          type: [integer, 'null']
          description: Numero della ricevuta nell'anno.
          example: 60

    SituazioneTesseramento:
      type: object
      required: [socio_id, nome, cognome, ultimo_rinnovo, scadenza, rinnovi]
      properties:
        socio_id:
          type: string
          format: uuid
        nome:
          type: string
        cognome:
          type: string
        ultimo_rinnovo:
          type: [string, 'null']
          format: date
          description: null se il socio non è mai stato tesserato
        scadenza:
          type: [string, 'null']
          format: date
        numero_tessera:
          type: [string, 'null']
          description: Numero del tesseramento più recente; null se non ne ha uno
        rinnovi:
          type: integer

    NuovoRinnovo:
      type: object
      required: [socio_id, scadenza, numero_tessera]
      properties:
        socio_id:
          type: string
          format: uuid
        scadenza:
          type: string
          format: date
        data_rinnovo:
          type: string
          format: date
          description: Omessa = oggi
        importo:
          type: number
          minimum: 0
          description: Omesso = quota delle impostazioni
        numero_tessera:
          type: string
          maxLength: 30
          description: Il numero stampato sulla tessera; spazi ai lati tolti, vuoto → 400

    VoceDocumento:
      type: object
      required: [id, tipo, data, socio_id, nome, cognome, descrizione, importo]
      properties:
        id:
          type: string
          format: uuid
          description: Id della riga d'origine (movimento, tesseramento o incontro)
        tipo:
          type: string
          enum: [ricarica, tesseramento, incontro]
        data:
          type: string
          format: date
        socio_id:
          type: string
          format: uuid
        nome:
          type: string
        cognome:
          type: string
        descrizione:
          type: string
        importo:
          $ref: '#/components/schemas/Importo'
        emessa_il:
          type: string
          format: date-time
          nullable: true
          description: Quando è stato emesso il documento che comprende questa voce.
        documento_id:
          type: string
          format: uuid
          nullable: true
          description: |
            La ricevuta che comprende la voce. Resta `null` sulle voci marcate come
            emesse prima che l'applicazione producesse documenti: sono storico.
        documento_anno:
          type: [integer, 'null']
          description: Anno della ricevuta. Con `documento_numero` forma il codice mostrato all'utente e il nome del file (`ricevuta_<anno>_<numero>.pdf`).
          example: 2026
        documento_numero:
          type: [integer, 'null']
          description: Numero della ricevuta nell'anno. `null` esattamente quando lo è `documento_id`.
          example: 60

    PaginaVoci:
      type: object
      required: [data, total, totale_importo, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VoceDocumento'
        total:
          type: integer
        totale_importo:
          type: number
        limit:
          type: integer
        offset:
          type: integer

    RiferimentoVoce:
      type: object
      required: [tipo, id]
      description: La coppia che identifica una voce fra le tre origini possibili.
      properties:
        tipo:
          type: string
          enum: [ricarica, tesseramento, incontro]
        id:
          type: string
          format: uuid

    EmissioneInput:
      type: object
      required: [socio_id, causale, voci]
      properties:
        socio_id:
          type: string
          format: uuid
          description: Una ricevuta è intestata a una persona sola.
        causale:
          type: string
          description: Testo libero, obbligatorio, stampato sul documento.
        voci:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/RiferimentoVoce'

    AnteprimaDocumento:
      type: object
      required: [pdf_base64, numero_provvisorio, anno, importo, importo_lettere, nome_file]
      properties:
        pdf_base64:
          type: string
          description: Il PDF, codificato in base64.
        numero_provvisorio:
          type: integer
          description: |
            Il numero che il documento avrebbe se confermato adesso. Non è riservato:
            un'altra emissione nel frattempo lo sposta.
        anno:
          type: integer
        importo:
          $ref: '#/components/schemas/Importo'
        importo_lettere:
          type: string
          example: centosessanta/00
        nome_file:
          type: string
          description: Nome proposto per il download, nella forma ricevuta_<anno>_<numero>.pdf.
          example: ricevuta_2026_41.pdf

    DocumentoEmesso:
      type: object
      required: [id, anno, numero, data_documento, importo, importo_lettere, nome_file, pdf_base64]
      properties:
        id:
          type: string
          format: uuid
        anno:
          type: integer
        numero:
          type: integer
        data_documento:
          type: string
          format: date
        importo:
          $ref: '#/components/schemas/Importo'
        importo_lettere:
          type: string
        nome_file:
          type: string
          description: Nome proposto per il download, nella forma ricevuta_<anno>_<numero>.pdf.
          example: ricevuta_2026_41.pdf
        pdf_base64:
          type: string

    Documento:
      type: object
      required: [id, anno, numero, data_documento, socio_id, intestatario, causale, importo]
      properties:
        id:
          type: string
          format: uuid
        anno:
          type: integer
        numero:
          type: integer
        data_documento:
          type: string
          format: date
        socio_id:
          type: string
          format: uuid
        intestatario:
          type: string
          description: |
            Nome e cognome come erano al momento dell'emissione: il documento deve
            restare leggibile com'era, anche se il socio cambia cognome.
        causale:
          type: string
        importo:
          $ref: '#/components/schemas/Importo'
        importo_lettere:
          type: string
        nome_file:
          type: string
          description: Nome proposto per il download, nella forma ricevuta_<anno>_<numero>.pdf.
          example: ricevuta_2026_41.pdf
        emesso_da:
          type: string
          nullable: true
          description: Id dell'account che ha confermato l'emissione.
        created_at:
          type: string
          format: date-time
        nome:
          type: string
          description: Nome ATTUALE del socio, dalla giuntura con la sua scheda.
        cognome:
          type: string

    PaginaDocumenti:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Documento'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Impostazioni:
      type: object
      properties:
        quota_tesseramento:
          type: number
          minimum: 0
          description: Quota proposta a ogni rinnovo del tesseramento
        percentuale_ricarica:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Percentuale di valore aggiunto a una ricarica, usata solo dove
            `RECHARGE_MODE` vale `percentage`. 0 = nessun extra.
        ricevuta_intestazione:
          type: string
          maxLength: 2000
          description: |
            Testo multiriga stampato in cima alle ricevute: denominazione, indirizzo,
            codice fiscale, numero di registro. Il **logo** non sta qui — arriva
            dall'immagine, da `branding/`, scelto per ambiente da `LOGO_FILE`.
        ricevuta_pie_pagina:
          type: string
          maxLength: 2000
          description: |
            Piè di pagina delle ricevute, tipicamente la clausola sull'esenzione
            dall'imposta di bollo.

    UtenteAmministrabile:
      type: object
      required: [id, email, ruolo, admin, attivo, cambio_password_richiesto, ultimo_accesso, created_at, socio_id, nome, cognome, telefono]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        ruolo:
          type: string
          enum: [socio, istruttore]
        admin:
          type: boolean
        attivo:
          type: boolean
        cambio_password_richiesto:
          type: boolean
        ultimo_accesso:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        socio_id:
          type: [string, 'null']
          format: uuid
          description: Scheda socio collegata
        nome:
          type: [string, 'null']
        cognome:
          type: [string, 'null']
        telefono:
          type: [string, 'null']
