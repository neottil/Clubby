server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File di runtime, da un ConfigMap montato al deploy
    # (frontend/k8s/configmap.yaml), non dal bundle: il bundle è compilato una
    # volta sola per tutti i club e non sa né con quale tag verrà deployato né
    # per quale club. Match esatto (=): ha precedenza sul "location /" sotto,
    # che altrimenti dirotterebbe la richiesta su index.html via try_files.
    # no-store: un cambio di configurazione deve valere al primo ricaricamento.

    # Versione dell'immagine in esecuzione, mostrata dalla pagina Info.
    location = /version.json {
        alias /etc/frontend-config/version.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Configurazione del club (nome, indirizzi, tema, logo), letta all'avvio.
    location = /config.json {
        alias /etc/frontend-config/config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Manifest dell'app installabile (spec 012): nome, icone e colori del
    # club, quindi anch'esso dal ConfigMap e non dal bundle. Quello in dist/
    # (public/manifest.webmanifest) serve solo in locale e qui resta coperto.
    location = /manifest.webmanifest {
        alias /etc/frontend-config/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-store";
    }

    # File della build con l'hash nel nome: un contenuto nuovo ha un nome
    # nuovo, quindi possono restare in cache a lungo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tutto il resto, e in particolare index.html e il service worker (sw.js),
    # va riconvalidato a ogni richiesta: è da lì che il browser scopre che c'è
    # una versione nuova. Messi in cache, un deploy o un rollback resterebbero
    # invisibili a chi ha già aperto l'app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
