server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Versione dell'immagine in esecuzione, mostrata dalla pagina Info.
    # Arriva da un ConfigMap montato al deploy (frontend/k8s/configmap.yaml),
    # non dal bundle: il bundle è compilato una volta sola e non può sapere con
    # quale tag l'immagine verrà poi deployata (Promote la ri-tagga X.Y.Z senza
    # ribuildarla). Match esatto (=): ha precedenza sul "location /" sotto, che
    # altrimenti dirotterebbe la richiesta su index.html via try_files.
    # In locale (vite dev) il file non esiste: la pagina Info ripiega su 'dev'.
    location = /version.json {
        alias /etc/frontend-version/version.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
