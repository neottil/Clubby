<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- App installabile (spec 012). Il manifest è quello del club, generato
         al deploy accanto a /config.json; colore della barra, icona e nome per
         iOS li aggiorna main.tsx dopo aver letto la configurazione. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2E2A26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clubby" />
    <link rel="apple-touch-icon" href="/branding/icone/logo-180.png" />
    <!-- Titolo e favicon del club li imposta main.tsx dopo aver letto /config.json. -->
    <title>Clubby</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
