# Versione del frontend, esposta a runtime su GET /version.json.
#
# Non è una VITE_* compilata nel bundle: quelle si fissano al momento della
# build, mentre APP_VERSION qui è il tag dell'immagine che QUESTO deploy sta
# mettendo in esecuzione — tag di data da Build & Deploy (es.
# "main-20260728_1553"), versione reale "X.Y.Z" da Promote, che ri-tagga
# l'immagine senza ribuildarla e quindi non potrebbe mai aggiornare un valore
# compilato dentro il bundle. Stessa logica di APP_VERSION lato backend
# (backend/k8s/configmap.yaml), servita nel modo che ha senso per nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clubby-frontend-config
  namespace: ${KUBE_NAMESPACE}
data:
  version.json: |
    {"version":"${APP_VERSION}"}
