apiVersion: apps/v1
kind: Deployment
metadata:
  name: clubmanager-frontend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: clubmanager-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clubmanager-frontend
  template:
    metadata:
      labels:
        app: clubmanager-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        # Montato come DIRECTORY (non subPath sul singolo file): con subPath
        # kubelet copia il file una volta sola e non lo aggiorna più quando il
        # ConfigMap cambia, quindi /version.json resterebbe fermo alla prima
        # versione deployata su quel pod.
        - name: version
          configMap:
            name: clubmanager-frontend-config
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          ports:
            - containerPort: 80
          volumeMounts:
            # Fuori da /usr/share/nginx/html: montarci dentro nasconderebbe
            # gli asset statici dell'immagine. nginx.conf lo espone su
            # /version.json con una location dedicata.
            - name: version
              mountPath: /etc/frontend-version
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
