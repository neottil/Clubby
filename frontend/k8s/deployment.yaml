apiVersion: apps/v1
kind: Deployment
metadata:
  name: clubby-frontend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: clubby-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clubby-frontend
  template:
    metadata:
      labels:
        app: clubby-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        # Montato come DIRECTORY (non subPath sul singolo file): con subPath
        # kubelet copia il file una volta sola e non lo aggiorna più quando il
        # ConfigMap cambia, quindi /version.json e /config.json resterebbero
        # fermi al primo deploy su quel pod.
        - name: runtime-config
          configMap:
            name: clubby-frontend-config
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          ports:
            - containerPort: 80
          volumeMounts:
            # Fuori da /usr/share/nginx/html: montarci dentro nasconderebbe
            # gli asset statici dell'immagine. nginx.conf espone i file su
            # /version.json e /config.json con location dedicate.
            - name: runtime-config
              mountPath: /etc/frontend-config
              readOnly: true
          # nginx che serve file statici: pochissimo (spec 007).
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
