name: 'Wait for CloudFormation Stack'
description: 'Waits for a CloudFormation stack to reach a stable state'
inputs:
  stack-name:
    description: 'CloudFormation stack name'
    required: true
  max-wait-time:
    description: 'Maximum wait time in seconds'
    required: false
    default: '1800'
  poll-interval:
    description: 'Poll interval in seconds'
    required: false
    default: '15'
outputs:
  final-status:
    description: 'Final stack status'
    value: ${{ steps.wait-stack.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Wait for stack completion
      id: wait-stack
      shell: bash
      env:
        STACK_NAME: ${{ inputs.stack-name }}
        MAX_WAIT_TIME: ${{ inputs.max-wait-time }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
      run: |
        ELAPSED=0
        
        echo "Waiting for stack $STACK_NAME to reach a stable state..."
        
        while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          
          echo "Current status: $STACK_STATUS (${ELAPSED}s elapsed)"
          
          # Stati di successo
          if [[ "$STACK_STATUS" == "CREATE_COMPLETE" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_COMPLETE" ]]; then
            echo "✓ Stack operation completed successfully: $STACK_STATUS"
            echo "status=$STACK_STATUS" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Stati di fallimento
          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]] || \
             [[ "$STACK_STATUS" == "ROLLBACK_FAILED" ]] || \
             [[ "$STACK_STATUS" == "CREATE_FAILED" ]] || \
             [[ "$STACK_STATUS" == "DELETE_FAILED" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_FAILED" ]]; then
            echo "✗ Stack is in failed state: $STACK_STATUS"
            echo "Fetching failure reasons..."
            aws cloudformation describe-stack-events \
              --stack-name $STACK_NAME \
              --max-items 20 \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`) || contains(ResourceStatus, `ROLLBACK`)].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table
            echo "status=$STACK_STATUS" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Stati di rollback in corso
          if [[ "$STACK_STATUS" == "ROLLBACK_IN_PROGRESS" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_IN_PROGRESS" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS" ]]; then
            echo "⚠ Stack is rolling back, waiting for completion..."
          fi
          
          # Stati in progress
          if [[ "$STACK_STATUS" == "CREATE_IN_PROGRESS" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_IN_PROGRESS" ]] || \
             [[ "$STACK_STATUS" == "UPDATE_COMPLETE_CLEANUP_IN_PROGRESS" ]]; then
            echo "→ Stack operation in progress..."
          fi
          
          sleep $POLL_INTERVAL
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
        done
        
        echo "✗ Timeout reached after ${MAX_WAIT_TIME}s"
        echo "Final stack status: $STACK_STATUS"
        echo "status=TIMEOUT" >> $GITHUB_OUTPUT
        exit 1
