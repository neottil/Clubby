name: Build & Deploy

# Backend, frontend e authorizer sono tre scope completamente indipendenti:
# ognuno ha i propri manifest k8s colocati nel proprio folder (backend/k8s/,
# frontend/k8s/, authorizer/k8s/), il proprio tag Git
# "<scope>-<branch>-<data>" (stesso tag sia da riferimento per il diff della
# prossima run, sia da riferimento per il workflow Tag), e build/deploy che
# girano solo se necessario, senza mai toccare i Deployment k8s degli altri.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      # Scavalca l'analisi del diff: builda e deploya ENTRAMBI gli scope a
      # prescindere da cosa è cambiato rispetto all'ultimo tag. Serve quando lo
      # stato del cluster non è più deducibile dalla history dei commit — il
      # caso tipico è un namespace ricreato da zero (ConfigMap e Secret
      # applicativi non esistono più, ma per il diff "non è cambiato niente" e
      # i job di deploy non girerebbero affatto).
      force_all:
        description: 'Forza rebuild e redeploy di backend, frontend e authorizer, ignorando il diff'
        type: boolean
        default: false

jobs:
  # Calcola le versioni "reali" (da package.json) e decide, per backend e
  # frontend INDIPENDENTEMENTE, cosa serve davvero eseguire.
  versions:
    runs-on: ubuntu-24.04
    environment: development
    outputs:
      server: ${{ steps.v.outputs.server }}
      client: ${{ steps.v.outputs.client }}
      auth: ${{ steps.v.outputs.auth }}
      date_tag: ${{ steps.v.outputs.date_tag }}
      sha: ${{ steps.v.outputs.sha }}
      has_backend: ${{ steps.analyze.outputs.has_backend }}
      has_frontend: ${{ steps.analyze.outputs.has_frontend }}
      has_authorizer: ${{ steps.analyze.outputs.has_authorizer }}
      deploy_backend: ${{ steps.analyze.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.analyze.outputs.deploy_frontend }}
      deploy_authorizer: ${{ steps.analyze.outputs.deploy_authorizer }}
    steps:
      # fetch-depth: 0 necessario per "git tag --merged" e il diff nello step
      # di analisi sotto (serve tutta la history + i tag, non solo l'ultimo commit).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Per ciascuno scope (backend/frontend), cerca l'ultimo tag
      # "<scope>-<branch>-*" di QUESTO branch e diffa SOLO il proprio folder:
      #   - qualcosa sotto <scope>/ (esclusi i manifest) cambiato -> rebuild
      #     (has_<scope>=true)
      #   - solo <scope>/k8s/ cambiato (manifest, non codice) -> nessun
      #     rebuild, ma il manifest va comunque riapplicato riusando l'ultima
      #     immagine di quello scope effettivamente deployata (deploy_<scope>
      #     =true, has_<scope>=false)
      #   - niente cambiato sotto <scope>/ -> il job di deploy di quello scope
      #     non gira affatto, il suo Deployment resta esattamente com'era
      # Se non è mai stata fatta una build per quello scope su questo branch
      # (nessun tag trovato), builda e deploya tutto per sicurezza.
      #
      # Eccezione: alcuni percorsi fuori da <scope>/ finiscono comunque
      # nell'immagine (branding/, scripts/migra.sh) — un loro cambiamento
      # richiede un rebuild, quindi vanno guardati esplicitamente. Solo quei
      # file, non l'intera cartella scripts/ (il resto non finisce
      # nell'immagine).
      #
      # L'input force_all (solo workflow_dispatch) salta l'analisi del tutto e
      # tratta entrambi gli scope come "codice + manifest cambiati". Sui push
      # la variabile è stringa vuota, quindi il confronto con "true" è falso e
      # il comportamento normale resta invariato.
      - name: Analizza modifiche (i tre scope indipendentemente)
        id: analyze
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')

          for SCOPE in backend frontend authorizer; do
            PREV_TAG=$(git tag --merged HEAD --sort=-creatordate -l "${SCOPE}-${BRANCH_SLUG}-*" | head -1)

            if [ "$FORCE_ALL" = "true" ]; then
              echo "[$SCOPE] force_all attivo: rebuild e redeploy forzati, diff ignorato."
              HAS_CODE=true
              HAS_K8S=true
            elif [ -z "$PREV_TAG" ]; then
              echo "[$SCOPE] Nessun tag precedente su questo branch: prima build, eseguo tutto."
              HAS_CODE=true
              HAS_K8S=true
            else
              CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- "${SCOPE}/")
              echo "[$SCOPE] Diff rispetto a $PREV_TAG..HEAD:"
              echo "$CHANGED"

              HAS_CODE=false; HAS_K8S=false
              echo "$CHANGED" | grep -qE "^${SCOPE}/k8s/" && HAS_K8S=true || true
              echo "$CHANGED" | grep -vE "^${SCOPE}/k8s/" | grep -qE "^${SCOPE}/" && HAS_CODE=true || true

              # Percorsi che stanno FUORI da <scope>/ ma finiscono comunque
              # nell'immagine di quello scope: senza guardarli esplicitamente,
              # un commit che tocca solo loro non farebbe partire nessuna
              # build, perché il diff sopra guarda una cartella sola.
              #
              #   scripts/migra.sh  copiato da backend/Dockerfile (lo esegue
              #                     il Job k8s delle migrazioni)
              #   branding/         copiato da backend/Dockerfile (loghi delle
              #                     ricevute) e in frontend/public/ via
              #                     scripts/copia-branding.mjs
              case "$SCOPE" in
                backend)  EXTRA_PATHS="scripts/migra.sh branding/" ;;
                frontend) EXTRA_PATHS="branding/ scripts/copia-branding.mjs" ;;
                *)        EXTRA_PATHS="" ;;
              esac
              if [ -n "$EXTRA_PATHS" ]; then
                # shellcheck disable=SC2086
                EXTRA_CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- $EXTRA_PATHS)
                if [ -n "$EXTRA_CHANGED" ]; then
                  echo "[$SCOPE] cambiato fuori da ${SCOPE}/ ma dentro l'immagine: forzo rebuild."
                  echo "$EXTRA_CHANGED"
                  HAS_CODE=true
                fi
              fi
            fi

            DEPLOY=false
            if $HAS_CODE || $HAS_K8S; then DEPLOY=true; fi

            echo "has_${SCOPE}=$HAS_CODE"     >> "$GITHUB_OUTPUT"
            echo "deploy_${SCOPE}=$DEPLOY"    >> "$GITHUB_OUTPUT"
            echo "[$SCOPE] -> has_${SCOPE}=$HAS_CODE  deploy_${SCOPE}=$DEPLOY"
          done

      - id: v
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "server=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "client=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "auth=$(node -p "require('./authorizer/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "date_tag=${BRANCH_SLUG}-$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Il PDF delle ricevute non sa disegnare gli SVG: il backend cerca l'omonimo
  # PNG o JPEG. Senza, la ricevuta uscirebbe senza logo e nessuno se ne
  # accorgerebbe fino alla prima consegnata.
  #
  # Job a sé e non uno step dentro una build: l'analisi del diff ragiona per
  # cartelle, e un commit che tocca solo branding/ farebbe partire le build
  # solo grazie ai percorsi extra sopra — mentre questo controllo deve girare
  # sempre, anche quando nessuna build parte. Il job resta comunque in piedi
  # (è lo *step* a essere condizionato dal flag), così i needs a valle non
  # incontrano mai uno "skipped".
  valida-branding:
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - uses: actions/checkout@v7

      - name: Ogni logo SVG ha un gemello raster
        if: vars.ENABLE_MODULE_RICEVUTE == 'true'
        run: |
          mancanti=0
          for svg in branding/*.svg; do
            [ -e "$svg" ] || continue
            base="${svg%.svg}"
            if [ ! -f "$base.png" ] && [ ! -f "$base.jpg" ] && [ ! -f "$base.jpeg" ]; then
              echo "::error file=$svg::manca $(basename "$base").png (o .jpg): le ricevute uscirebbero senza logo"
              mancanti=1
            fi
          done
          exit $mancanti

      - name: I raster non sono sovradimensionati
        if: vars.ENABLE_MODULE_RICEVUTE == 'true'
        # Il PDF disegna il logo a 3,2 cm ma incorpora i byte ORIGINALI: un
        # raster enorme non si vede più grande, si paga — su ogni ricevuta, e
        # le ricevute restano archiviate per anni. Le dimensioni in pixel si
        # leggono dall'header IHDR del PNG; per il JPEG basta il peso.
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const MAX_LATO = 1000, MAX_BYTE = 200 * 1024;
            let ko = 0;
            for (const f of fs.readdirSync("branding")) {
              if (!/\.(png|jpe?g)$/i.test(f)) continue;
              const p = path.join("branding", f);
              const buf = fs.readFileSync(p);
              if (buf.length > MAX_BYTE) {
                console.log(`::error file=${p}::${(buf.length / 1024) | 0} KB, oltre il limite di ${MAX_BYTE / 1024} KB`);
                ko = 1;
              }
              if (buf.subarray(1, 4).toString() === "PNG") {
                const w = buf.readUInt32BE(16), h = buf.readUInt32BE(20);
                if (Math.max(w, h) > MAX_LATO) {
                  console.log(`::error file=${p}::${w}x${h} px, lato lungo oltre ${MAX_LATO} px (consigliati 400)`);
                  ko = 1;
                }
              }
            }
            process.exit(ko);
          '

  build-backend:
    needs: versions
    if: needs.versions.outputs.has_backend == 'true'
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # La compilazione avviene qui, nella pipeline: il Dockerfile non esegue
      # alcuna build, si limita a impacchettare backend/dist già pronto.
      - name: Installa dipendenze e builda il backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushati: solo quello di data + latest. Il tag di versione reale
      # (server-vX.Y.Z) viene aggiunto dal workflow Tag dopo un deploy riuscito.
      #
      # Context = radice del repo (non ./backend): backend/Dockerfile copia
      # anche scripts/migra.sh e branding/, che stanno fuori da backend/ (vedi
      # commento in backend/Dockerfile e .dockerignore alla radice).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubby-backend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubby-backend:latest

  build-frontend:
    needs: versions
    if: needs.versions.outputs.has_frontend == 'true'
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Nessuna configurazione del club in questa build: nome, indirizzi di API
      # e authorizer, tema e logo li legge il browser all'avvio da
      # /config.json, generato al deploy per ciascun ambiente
      # (deploy-frontend.yml). L'immagine è così la stessa per tutti i club, e
      # Promote la porta in qualunque ambiente senza ricompilarla.
      - name: Installa dipendenze e builda il frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubby-frontend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubby-frontend:latest

  build-authorizer:
    needs: versions
    if: needs.versions.outputs.has_authorizer == 'true'
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: authorizer/package-lock.json

      # Come per il backend, la compilazione avviene qui: il Dockerfile si
      # limita a impacchettare authorizer/dist già pronto.
      - name: Installa dipendenze e builda l'authorizer
        working-directory: authorizer
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context = ./authorizer: a differenza del backend, qui non serve nulla
      # dalla radice del repo.
      - uses: docker/build-push-action@v7
        with:
          context: ./authorizer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubby-authorizer:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubby-authorizer:latest

  # Test delle API contro le IMMAGINI APPENA BUILDATE, non contro il codice
  # sorgente ricompilato: si prova l'artefatto che verrà deployato, ed è anche
  # il motivo per cui questo job sta dopo le build e non in parallelo.
  #
  # Blocca SOLO i deploy. Un'immagine che non passa i test resta su ghcr.io con
  # il suo tag di data: non è una versione rilasciata (quelle le assegna Tag) e
  # non la mette in servizio nessuno, quindi non vale la pena complicare la
  # pipeline per impedirne la pubblicazione.
  #
  # Il database è un container "service" del job: nasce vuoto, muore con la run.
  # I database dei club vivono nel cluster e il runner non ha né credenziali né
  # rotta per raggiungerli — ma la suite CREA e CANCELLA righe, quindi vale la
  # pena dirlo: le uniche variabili che potrebbero puntarla altrove sono
  # TEST_APP_DB_URL e TEST_AUTH_DB_URL, che qui non vengono impostate.
  #
  # Gira SEMPRE, anche quando cambia solo il frontend. Costa un paio di minuti e
  # in cambio ogni push verifica che baseline e migrazioni si applichino da zero
  # su un database vuoto — cosa che in un ambiente reale succede una volta sola,
  # e che quindi nessun deploy riesce più a smentire.
  test:
    needs: [versions, build-backend, build-authorizer]
    # !cancelled(): le build possono essere "skipped" quando quello scope non è
    # cambiato, e in quel caso si prova l'immagine attualmente in servizio.
    if: |
      !cancelled() &&
      needs.versions.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-authorizer.result == 'success' || needs.build-authorizer.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Senza health check i passi successivi partirebbero mentre Postgres
        # sta ancora inizializzando il proprio volume.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      # fetch-depth: 0 per i tag, usati sotto quando uno scope non è stato
      # ribuildato in questa run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node serve solo a ESEGUIRE la suite (node --test): non si compila più
      # nulla qui, ci hanno già pensato i job di build. Le dipendenze del
      # backend servono perché i test usano il suo driver "pg" per le due
      # operazioni che fanno in SQL — il primo admin e la pulizia finale.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev --prefix backend

      # Stessa regola di resolve-<scope>-image: l'immagine di questa run se lo
      # scope è stato ribuildato, altrimenti l'ultima davvero deployata su
      # questo branch. Non si riusa il job resolve perché quello gira solo per
      # gli scope in deploy, mentre la suite ha bisogno di ENTRAMBI i servizi
      # anche quando ne è cambiato uno solo.
      - name: Determina le immagini da provare
        id: immagini
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          risolvi() {
            scope="$1"; ribuildato="$2"
            if [ "$ribuildato" = "true" ]; then
              echo "${{ needs.versions.outputs.date_tag }}"
              return
            fi
            prev=$(git tag -l "${scope}-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$prev" ]; then
              echo "::error::Nessuna immagine $scope su questo branch, e questa run non ne ha buildata una: impossibile eseguire i test." >&2
              exit 1
            fi
            echo "${prev#${scope}-}"
          }
          BACKEND=$(risolvi backend    '${{ needs.versions.outputs.has_backend }}')
          AUTH=$(risolvi    authorizer '${{ needs.versions.outputs.has_authorizer }}')
          echo "backend=$BACKEND"   >> "$GITHUB_OUTPUT"
          echo "authorizer=$AUTH"   >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND — Authorizer: $AUTH"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un database e un utente omonimo per modulo, come li crea Infra su un
      # ambiente vero (vedi crea_database in infra.yml): lo schema viene poi
      # applicato DALL'UTENTE PROPRIETARIO, così le tabelle nascono sue e i
      # permessi sono gli stessi che avrà in produzione.
      - name: Crea i due database
        env:
          PGPASSWORD: postgres
        run: |
          psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clubby      LOGIN PASSWORD 'clubby';
          CREATE ROLE clubby_auth LOGIN PASSWORD 'clubby_auth';
          CREATE DATABASE clubby      OWNER clubby;
          CREATE DATABASE clubby_auth OWNER clubby_auth;
          SQL

      # pgcrypto è un'estensione "trusted" da PostgreSQL 13: il proprietario del
      # database può crearla senza essere superutente, ed è il motivo per cui
      # queste due righe girano come l'utente del modulo e non come postgres.
      - name: Applica le baseline
        run: |
          PGPASSWORD=clubby      psql -U clubby      -d clubby      -v ON_ERROR_STOP=1 -q -f backend/src/db/schema.sql
          PGPASSWORD=clubby_auth psql -U clubby_auth -d clubby_auth -v ON_ERROR_STOP=1 -q -f authorizer/src/db/schema.sql

      # Le migrazioni si applicano DALL'IMMAGINE del backend, con lo stesso
      # script e lo stesso percorso del Job k8s di migrate-db.yml: sono quindi
      # esattamente quelle che accompagnano il codice che si sta per provare,
      # non quelle presenti nel repository.
      - name: Applica le migrazioni
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_NAME=clubby -e DB_USER=clubby -e DB_PASSWORD=clubby \
            "$REGISTRY/clubby-backend:${{ steps.immagini.outputs.backend }}" \
            sh /app/scripts/migra.sh
          # L'authorizer non ha ancora migrazioni proprie né psql nella propria
          # immagine (vedi authorizer/src/db/migrations/README.md): finché è
          # così, le sue si applicano dal runner.
          DB_HOST=localhost DB_PORT=5432 DB_NAME=clubby_auth DB_USER=clubby_auth DB_PASSWORD=clubby_auth \
            MIGRATIONS_DIR=authorizer/src/db/migrations sh scripts/migra.sh

      # Un solo posto in cui è scritta la configurazione: i container la
      # ricevono con --env-file, e i test leggono da qui i parametri di
      # connessione per le due operazioni che fanno in SQL.
      #
      # RECHARGE_MODE=free è obbligatorio: in modalità "map" la creazione dei
      # dati di prova verrebbe rifiutata, non essendoci tagli configurati.
      # AUTH_JWT_PRIVATE_KEY è assente di proposito: l'authorizer ne genera una
      # effimera all'avvio, che è esattamente ciò che serve a un processo che
      # vive quanto il job.
      - name: Scrivi i file di configurazione
        run: |
          cat > backend/.env <<'ENV'
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=clubby
          DB_USER=clubby
          DB_PASSWORD=clubby
          AUTH_ISSUER=http://localhost:3001
          AUTH_INTERNAL_URL=http://localhost:3001
          ENABLE_MODULE_TESSERAMENTO=true
          ENABLE_MODULE_RICEVUTE=true
          RECHARGE_MODE=free
          PORT=3000
          APP_VERSION=test
          ENV
          cat > authorizer/.env <<'ENV'
          PORT=3001
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=clubby_auth
          DB_USER=clubby_auth
          DB_PASSWORD=clubby_auth
          AUTH_ISSUER=http://localhost:3001
          CORS_ORIGIN=*
          ENV

      # --network host: i due container si vedono fra loro, vedono Postgres e
      # sono raggiungibili dalla suite, che gira sul runner. Su Linux è il modo
      # più semplice di avere un solo "localhost" per tutti.
      #
      # /health è l'endpoint giusto per aspettarli: non richiede autenticazione,
      # mentre /api/version risponde 401 e farebbe fallire il controllo.
      - name: Avvia i servizi dalle immagini
        run: |
          docker run -d --name authorizer --network host --env-file authorizer/.env \
            "$REGISTRY/clubby-authorizer:${{ steps.immagini.outputs.authorizer }}"
          docker run -d --name backend    --network host --env-file backend/.env \
            "$REGISTRY/clubby-backend:${{ steps.immagini.outputs.backend }}"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null \
               && curl -sf http://localhost:3000/health > /dev/null; then
              echo "Servizi pronti dopo ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::I servizi non hanno risposto entro 30 secondi."
          docker ps -a
          exit 1

      - name: Esegui i test delle API
        run: npm run test:api

      # I servizi girano in container: senza questo, un test fallito mostra solo
      # l'asserzione e non il motivo lato server.
      - name: Log dei servizi (solo se qualcosa è fallito)
        if: failure()
        run: |
          echo "=== backend ==="    && docker logs --tail 50 backend    || true
          echo "=== authorizer ===" && docker logs --tail 50 authorizer || true

  # Decide quale immagine backend deployare in QUESTA run (specifico di
  # questa run: branch, history dei tag — resta fuori dal workflow
  # riutilizzabile di deploy, che non deve sapere nulla di tutto questo). Se
  # è stato ribuildato, usa il tag di data appena pushato. Altrimenti (solo
  # un manifest sotto backend/k8s/ è cambiato) NON esiste un tag :latest
  # generico da riusare: cerca l'ultimo tag "backend-<branch>-*" — che
  # identifica esattamente l'ultima immagine backend davvero deployata con
  # successo su questo branch — e riusa quella, senza rebuild.
  resolve-backend-image:
    needs: [versions, build-backend]
    # !cancelled() perché build-backend può essere "skipped" (non "success")
    # quando has_backend è false — di norma GitHub Actions salterebbe anche
    # questo job in quel caso, ma qui deve girare comunque se è cambiato solo
    # un manifest sotto backend/k8s/ (deploy_backend=true, build-backend skipped).
    if: |
      !cancelled() &&
      needs.versions.outputs.deploy_backend == 'true' &&
      needs.versions.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      branch_slug: ${{ steps.image.outputs.branch_slug }}
    steps:
      # fetch-depth: 0 necessario per cercare l'ultimo tag backend-<branch>-*.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina l'immagine backend da usare
        id: image
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.versions.outputs.has_backend }}" = "true" ]; then
            echo "image_tag=${{ needs.versions.outputs.date_tag }}" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git tag -l "backend-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$PREV" ]; then
              echo "ERRORE: nessuna immagine backend risulta mai deployata su questo branch, e questa run non ne ha buildata una nuova. Impossibile continuare." >&2
              exit 1
            fi
            echo "image_tag=${PREV#backend-}" >> "$GITHUB_OUTPUT"
          fi

  # Migrazioni di schema PRIMA dei rollout, mai dopo: il codice nuovo non deve
  # girare su uno schema vecchio. Gira su un Job k8s che usa le immagini appena
  # risolte — già su ghcr.io, ma non ancora in servizio da nessuna parte.
  # !cancelled(): uno dei due resolve può essere "skipped" (quel modulo non cambia),
  # e in quel caso il suo tag arriva vuoto e il relativo database non si tocca.
  # Se il Job fallisce non parte nessuno dei tre deploy, frontend compreso.
  migrate-db:
    needs: [resolve-backend-image, resolve-authorizer-image, test]
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.resolve-backend-image.result == 'success' ||
       needs.resolve-authorizer-image.result == 'success')
    uses: ./.github/workflows/migrate-db.yml
    with:
      environment: development
      backend_image_tag: ${{ needs.resolve-backend-image.outputs.image_tag }}
      authorizer_image_tag: ${{ needs.resolve-authorizer-image.outputs.image_tag }}
    secrets: inherit

  # Applica SOLO i manifest sotto backend/k8s/ e fa il rollout del solo
  # Deployment backend, tramite il workflow riutilizzabile (chiamato anche da
  # promote.yml per la produzione — stessa identica logica di deploy, mai
  # duplicata). Se frontend non cambia, il suo Deployment non viene MAI
  # toccato da questa run.
  deploy-backend:
    needs: [resolve-backend-image, migrate-db, test, valida-branding]
    # !cancelled() obbligatorio, e non per i needs diretti (che qui devono essere
    # tutti "success"): lo skip si propaga in modo TRANSITIVO lungo il grafo.
    # build-authorizer è "skipped" ogni volta che l'authorizer non cambia, e
    # senza !cancelled() quello skip scende fino a qui attraverso test — che gira
    # comunque solo perché il suo !cancelled() lo protegge — saltando il deploy
    # anche con build, test e migrazioni tutti verdi.
    if: |
      !cancelled() &&
      needs.valida-branding.result == 'success' &&
      needs.test.result == 'success' &&
      needs.resolve-backend-image.result == 'success' &&
      needs.migrate-db.result == 'success'
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: development
      image_tag: ${{ needs.resolve-backend-image.outputs.image_tag }}
    secrets: inherit

  # Ciclo di vita del tag "backend-<branch>-<data>": un tag NUOVO se questa
  # run ha ribuildato (riferisce la nuova immagine), altrimenti SPOSTA in
  # avanti il tag ESISTENTE più recente sul commit di questa run (stesso nome
  # quindi stessa immagine referenziata, ma segna "fino a qui è già stato
  # deployato" per il diff della prossima run — altrimenti lo stesso cambio
  # manifest verrebbe rilevato di nuovo ad ogni run successiva). Resta FUORI
  # dal workflow riutilizzabile di deploy: dipende da logica specifica di
  # questa run, non generica "deploya questo tag su questo ambiente".
  register-backend-tag:
    needs: [versions, resolve-backend-image, deploy-backend]
    # !cancelled(): vedi deploy-backend. La condizione resta stretta — si registra
    # il tag solo a deploy riuscito — ma senza !cancelled() il job verrebbe saltato
    # prima ancora di valutarla.
    if: |
      !cancelled() &&
      needs.deploy-backend.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Registra il deploy di backend
        run: |
          if [ "${{ needs.versions.outputs.has_backend }}" = "true" ]; then
            TAG="backend-${{ needs.versions.outputs.date_tag }}"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG=$(git tag -l "backend-${{ needs.resolve-backend-image.outputs.branch_slug }}-*" --sort=-creatordate | head -1)
            git tag -fa "$TAG" -m "$TAG"
            git push origin "$TAG" --force
          fi

  # Vedi commento gemello in resolve-backend-image.
  resolve-frontend-image:
    needs: [versions, build-frontend]
    if: |
      !cancelled() &&
      needs.versions.outputs.deploy_frontend == 'true' &&
      needs.versions.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      branch_slug: ${{ steps.image.outputs.branch_slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina l'immagine frontend da usare
        id: image
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.versions.outputs.has_frontend }}" = "true" ]; then
            echo "image_tag=${{ needs.versions.outputs.date_tag }}" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git tag -l "frontend-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$PREV" ]; then
              echo "ERRORE: nessuna immagine frontend risulta mai deployata su questo branch, e questa run non ne ha buildata una nuova. Impossibile continuare." >&2
              exit 1
            fi
            echo "image_tag=${PREV#frontend-}" >> "$GITHUB_OUTPUT"
          fi

  # Applica SOLO i manifest sotto frontend/k8s/ e fa il rollout del solo
  # Deployment frontend, tramite il workflow riutilizzabile (stesso usato da
  # promote.yml per la produzione). Se backend non cambia, il suo Deployment
  # non viene MAI toccato da questa run.
  # Aspetta le migrazioni come gli altri due deploy, pur non usando il
  # database: se la migrazione fallisce il backend resta alla versione vecchia,
  # e mandare in servizio un frontend nuovo che chiama API non ancora deployate
  # romperebbe l'applicazione. O si aggiorna tutto, o non si aggiorna niente.
  #
  # Il confronto ammette anche "skipped": quando cambia solo il frontend, i due
  # resolve di backend e authorizer non girano e migrate-db viene saltato del
  # tutto. Pretendere "success" bloccherebbe per sempre i deploy di solo
  # frontend — e !cancelled() serve perché un needs saltato salterebbe anche questo.
  deploy-frontend:
    needs: [resolve-frontend-image, migrate-db, test, valida-branding]
    if: |
      !cancelled() &&
      needs.valida-branding.result == 'success' &&
      needs.test.result == 'success' &&
      needs.resolve-frontend-image.result == 'success' &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped')
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: development
      image_tag: ${{ needs.resolve-frontend-image.outputs.image_tag }}
    secrets: inherit

  # Vedi commento gemello in register-backend-tag.
  register-frontend-tag:
    needs: [versions, resolve-frontend-image, deploy-frontend]
    # Vedi commento gemello in register-backend-tag.
    if: |
      !cancelled() &&
      needs.deploy-frontend.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Registra il deploy di frontend
        run: |
          if [ "${{ needs.versions.outputs.has_frontend }}" = "true" ]; then
            TAG="frontend-${{ needs.versions.outputs.date_tag }}"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG=$(git tag -l "frontend-${{ needs.resolve-frontend-image.outputs.branch_slug }}-*" --sort=-creatordate | head -1)
            git tag -fa "$TAG" -m "$TAG"
            git push origin "$TAG" --force
          fi

  # Vedi commento gemello in resolve-backend-image.
  resolve-authorizer-image:
    needs: [versions, build-authorizer]
    if: |
      !cancelled() &&
      needs.versions.outputs.deploy_authorizer == 'true' &&
      needs.versions.result == 'success' &&
      (needs.build-authorizer.result == 'success' || needs.build-authorizer.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      branch_slug: ${{ steps.image.outputs.branch_slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina l'immagine authorizer da usare
        id: image
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.versions.outputs.has_authorizer }}" = "true" ]; then
            echo "image_tag=${{ needs.versions.outputs.date_tag }}" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git tag -l "authorizer-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$PREV" ]; then
              echo "ERRORE: nessuna immagine authorizer risulta mai deployata su questo branch, e questa run non ne ha buildata una nuova. Impossibile continuare." >&2
              exit 1
            fi
            echo "image_tag=${PREV#authorizer-}" >> "$GITHUB_OUTPUT"
          fi

  deploy-authorizer:
    needs: [resolve-authorizer-image, migrate-db, test]
    # Vedi commento gemello in deploy-backend: senza !cancelled() lo skip di una
    # build a monte si propaga fin qui.
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.resolve-authorizer-image.result == 'success' &&
      needs.migrate-db.result == 'success'
    uses: ./.github/workflows/deploy-authorizer.yml
    with:
      environment: development
      image_tag: ${{ needs.resolve-authorizer-image.outputs.image_tag }}
    secrets: inherit

  # Vedi commento gemello in register-backend-tag.
  register-authorizer-tag:
    needs: [versions, resolve-authorizer-image, deploy-authorizer]
    # Vedi commento gemello in register-backend-tag.
    if: |
      !cancelled() &&
      needs.deploy-authorizer.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Registra il deploy di authorizer
        run: |
          if [ "${{ needs.versions.outputs.has_authorizer }}" = "true" ]; then
            TAG="authorizer-${{ needs.versions.outputs.date_tag }}"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG=$(git tag -l "authorizer-${{ needs.resolve-authorizer-image.outputs.branch_slug }}-*" --sort=-creatordate | head -1)
            git tag -fa "$TAG" -m "$TAG"
            git push origin "$TAG" --force
          fi

  # A fine deploy, ripulisce dal registry le immagini taggate con la sola data,
  # mantenendo solo le 3 più recenti per repository immagine. I tag di versione
  # reale (X.Y.Z, assegnati dal workflow Tag) sono esclusi e non vengono mai
  # toccati da questa pulizia.
  #
  # Non usa "actions/delete-package-versions" (dismessa: gira solo forzata su
  # un runtime Node deprecato, warning visibile nel summary di ogni run) — usa
  # direttamente l'API di GitHub Packages via "gh api", stesso approccio già
  # usato in cleanup-build-tags.yml.
  cleanup-registry:
    needs: [versions, deploy-backend, deploy-frontend, deploy-authorizer]
    if: |
      !cancelled() &&
      needs.versions.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.deploy-authorizer.result == 'success' || needs.deploy-authorizer.result == 'skipped') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success' || needs.deploy-authorizer.result == 'success')
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      packages: write
    steps:
      - name: Rimuovi vecchie immagini Docker (mantieni le 3 più recenti per repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for IMG in clubby-backend clubby-frontend clubby-authorizer; do
            echo "=== $IMG ==="
            VERSIONS=$(gh api "/users/$OWNER/packages/container/$IMG/versions?per_page=100" --paginate 2>/dev/null || echo '[]')

            # Esclude le versioni senza tag e quelle con un tag di versione
            # reale (X.Y.Z): l'API cancella per digest, non per singolo tag,
            # e un digest condiviso con un tag reale non va mai toccato.
            NON_REAL=$(echo "$VERSIONS" | jq -c '
              [.[] | select(
                ((.metadata.container.tags // []) | length) > 0 and
                ((.metadata.container.tags // []) | map(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | any | not)
              )] | sort_by(.created_at) | reverse
            ')

            TOTAL=$(echo "$NON_REAL" | jq 'length')
            if [ "$TOTAL" -le 3 ]; then
              echo "  $TOTAL versioni (non di release) presenti, nulla da eliminare (soglia: 3)."
              continue
            fi

            echo "$NON_REAL" | jq -c '.[3:][]' | while read -r v; do
              ID=$(echo "$v" | jq -r '.id')
              TAGS=$(echo "$v" | jq -r '.metadata.container.tags[]?' | tr '\n' ' ')
              echo "  Elimino versione $ID (tag: $TAGS)"
              gh api -X DELETE "/users/$OWNER/packages/container/$IMG/versions/$ID"
            done
          done
