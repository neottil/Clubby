name: Build & Deploy

# Backend e frontend sono due scope completamente indipendenti: ognuno ha i
# propri manifest k8s colocati nel proprio folder (backend/k8s/, frontend/k8s/
# — non più un k8s/templates/app/ condiviso), il proprio tag Git
# "<scope>-<branch>-<data>" (stesso tag sia da riferimento per il diff della
# prossima run, sia da riferimento per il workflow Tag: niente più due
# famiglie di tag separate), e build/deploy che girano solo se necessario,
# senza mai toccare il Deployment k8s dell'altro componente.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch: {}

jobs:
  # Calcola le versioni "reali" (da package.json) e decide, per backend e
  # frontend INDIPENDENTEMENTE, cosa serve davvero eseguire.
  versions:
    runs-on: ubuntu-latest
    environment: development
    outputs:
      server: ${{ steps.v.outputs.server }}
      client: ${{ steps.v.outputs.client }}
      date_tag: ${{ steps.v.outputs.date_tag }}
      sha: ${{ steps.v.outputs.sha }}
      has_backend: ${{ steps.analyze.outputs.has_backend }}
      has_frontend: ${{ steps.analyze.outputs.has_frontend }}
      deploy_backend: ${{ steps.analyze.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.analyze.outputs.deploy_frontend }}
    steps:
      # fetch-depth: 0 necessario per "git tag --merged" e il diff nello step
      # di analisi sotto (serve tutta la history + i tag, non solo l'ultimo commit).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Per ciascuno scope (backend/frontend), cerca l'ultimo tag
      # "<scope>-<branch>-*" di QUESTO branch e diffa SOLO il proprio folder:
      #   - qualcosa sotto <scope>/ (esclusi i manifest) cambiato -> rebuild
      #     (has_<scope>=true)
      #   - solo <scope>/k8s/ cambiato (manifest, non codice) -> nessun
      #     rebuild, ma il manifest va comunque riapplicato riusando l'ultima
      #     immagine di quello scope effettivamente deployata (deploy_<scope>
      #     =true, has_<scope>=false)
      #   - niente cambiato sotto <scope>/ -> il job di deploy di quello scope
      #     non gira affatto, il suo Deployment resta esattamente com'era
      # Se non è mai stata fatta una build per quello scope su questo branch
      # (nessun tag trovato), builda e deploya tutto per sicurezza.
      #
      # Eccezione per backend: scripts/seed-demo-data.sh vive fuori da
      # backend/ ma viene copiato dentro l'immagine da backend/Dockerfile
      # (context di build = radice del repo) — un suo cambiamento richiede
      # comunque un rebuild, quindi va guardato esplicitamente. Solo questo
      # file, non l'intera cartella scripts/ (il resto non finisce
      # nell'immagine).
      - name: Analizza modifiche (backend e frontend indipendentemente)
        id: analyze
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')

          for SCOPE in backend frontend; do
            PREV_TAG=$(git tag --merged HEAD --sort=-creatordate -l "${SCOPE}-${BRANCH_SLUG}-*" | head -1)

            if [ -z "$PREV_TAG" ]; then
              echo "[$SCOPE] Nessun tag precedente su questo branch: prima build, eseguo tutto."
              HAS_CODE=true
              HAS_K8S=true
            else
              CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- "${SCOPE}/")
              echo "[$SCOPE] Diff rispetto a $PREV_TAG..HEAD:"
              echo "$CHANGED"

              HAS_CODE=false; HAS_K8S=false
              echo "$CHANGED" | grep -qE "^${SCOPE}/k8s/" && HAS_K8S=true || true
              echo "$CHANGED" | grep -vE "^${SCOPE}/k8s/" | grep -qE "^${SCOPE}/" && HAS_CODE=true || true

              if [ "$SCOPE" = "backend" ]; then
                EXTRA_CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- "scripts/seed-demo-data.sh")
                if [ -n "$EXTRA_CHANGED" ]; then
                  echo "[$SCOPE] scripts/seed-demo-data.sh cambiato (copiato nell'immagine): forzo rebuild."
                  HAS_CODE=true
                fi
              fi
            fi

            DEPLOY=false
            if $HAS_CODE || $HAS_K8S; then DEPLOY=true; fi

            echo "has_${SCOPE}=$HAS_CODE"     >> "$GITHUB_OUTPUT"
            echo "deploy_${SCOPE}=$DEPLOY"    >> "$GITHUB_OUTPUT"
            echo "[$SCOPE] -> has_${SCOPE}=$HAS_CODE  deploy_${SCOPE}=$DEPLOY"
          done

      - id: v
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "server=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "client=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "date_tag=${BRANCH_SLUG}-$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: versions
    if: needs.versions.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # La compilazione avviene qui, nella pipeline: il Dockerfile non esegue
      # alcuna build, si limita a impacchettare backend/dist già pronto.
      - name: Installa dipendenze e builda il backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushati: solo quello di data + latest. Il tag di versione reale
      # (server-vX.Y.Z) viene aggiunto dal workflow Tag dopo un deploy riuscito.
      #
      # Context = radice del repo (non ./backend): backend/Dockerfile copia
      # anche scripts/seed-demo-data.sh, condiviso con l'uso in locale (vedi
      # commento in backend/Dockerfile e .dockerignore alla radice).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubmanager-backend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubmanager-backend:latest

  build-frontend:
    needs: versions
    if: needs.versions.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le variabili VITE_* sono compilate nel bundle statico da Vite in questo
      # step (pipeline), non nel Dockerfile: Vite le legge solo a build-time.
      # LOGO_FILE non ha prefisso VITE_ perché non è letta dal browser: la
      # legge scripts/apply-logo.mjs (hook "prebuild" di npm) per copiare il
      # logo del tenant da frontend/branding/ in frontend/public/logo.svg
      # prima che Vite lo includa come asset statico.
      #
      # VITE_API_BASE_URL/VITE_KEYCLOAK_URL/VITE_KEYCLOAK_REALM/VITE_KEYCLOAK_CLIENT_ID
      # non sono variabili GitHub separate: derivano da APP_DOMAIN/KEYCLOAK_HOST/
      # KEYCLOAK_REALM/KEYCLOAK_CLIENT_ID (stessi valori usati da backend/Infra),
      # per evitare di dover tenere sincronizzate due variabili identiche.
      - name: Installa dipendenze e builda il frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://${{ vars.APP_DOMAIN }}
          VITE_KEYCLOAK_URL: https://${{ vars.KEYCLOAK_HOST }}
          VITE_KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'clubmanager' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID || 'clubmanager-spa' }}
          VITE_TENANT_NAME: ${{ vars.VITE_TENANT_NAME }}
          VITE_APP_VERSION: ${{ needs.versions.outputs.client }}
          VITE_ACTIVITY_SELECT_VALUES_MAPPING: ${{ vars.VITE_ACTIVITY_SELECT_VALUES_MAPPING }}
          VITE_THEME_PRIMARY: ${{ vars.VITE_THEME_PRIMARY }}
          VITE_THEME_PRIMARY_TEXT: ${{ vars.VITE_THEME_PRIMARY_TEXT }}
          VITE_THEME_DANGER: ${{ vars.VITE_THEME_DANGER }}
          VITE_THEME_SUCCESS: ${{ vars.VITE_THEME_SUCCESS }}
          VITE_THEME_NAV_BG: ${{ vars.VITE_THEME_NAV_BG }}
          VITE_THEME_NAV_TEXT: ${{ vars.VITE_THEME_NAV_TEXT }}
          LOGO_FILE: ${{ vars.LOGO_FILE }}
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubmanager-frontend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubmanager-frontend:latest

  # Decide quale immagine backend deployare in QUESTA run (specifico di
  # questa run: branch, history dei tag — resta fuori dal workflow
  # riutilizzabile di deploy, che non deve sapere nulla di tutto questo). Se
  # è stato ribuildato, usa il tag di data appena pushato. Altrimenti (solo
  # un manifest sotto backend/k8s/ è cambiato) NON esiste un tag :latest
  # generico da riusare: cerca l'ultimo tag "backend-<branch>-*" — che
  # identifica esattamente l'ultima immagine backend davvero deployata con
  # successo su questo branch — e riusa quella, senza rebuild.
  resolve-backend-image:
    needs: [versions, build-backend]
    # always() perché build-backend può essere "skipped" (non "success")
    # quando has_backend è false — di norma GitHub Actions salterebbe anche
    # questo job in quel caso, ma qui deve girare comunque se è cambiato solo
    # un manifest sotto backend/k8s/ (deploy_backend=true, build-backend skipped).
    if: |
      always() &&
      needs.versions.outputs.deploy_backend == 'true' &&
      needs.versions.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      branch_slug: ${{ steps.image.outputs.branch_slug }}
    steps:
      # fetch-depth: 0 necessario per cercare l'ultimo tag backend-<branch>-*.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina l'immagine backend da usare
        id: image
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.versions.outputs.has_backend }}" = "true" ]; then
            echo "image_tag=${{ needs.versions.outputs.date_tag }}" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git tag -l "backend-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$PREV" ]; then
              echo "ERRORE: nessuna immagine backend risulta mai deployata su questo branch, e questa run non ne ha buildata una nuova. Impossibile continuare." >&2
              exit 1
            fi
            echo "image_tag=${PREV#backend-}" >> "$GITHUB_OUTPUT"
          fi

  # Applica SOLO i manifest sotto backend/k8s/ e fa il rollout del solo
  # Deployment backend, tramite il workflow riutilizzabile (chiamato anche da
  # promote.yml per la produzione — stessa identica logica di deploy, mai
  # duplicata). Se frontend non cambia, il suo Deployment non viene MAI
  # toccato da questa run.
  deploy-backend:
    needs: resolve-backend-image
    if: needs.resolve-backend-image.result == 'success'
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: development
      image_tag: ${{ needs.resolve-backend-image.outputs.image_tag }}
    secrets: inherit

  # Ciclo di vita del tag "backend-<branch>-<data>": un tag NUOVO se questa
  # run ha ribuildato (riferisce la nuova immagine), altrimenti SPOSTA in
  # avanti il tag ESISTENTE più recente sul commit di questa run (stesso nome
  # quindi stessa immagine referenziata, ma segna "fino a qui è già stato
  # deployato" per il diff della prossima run — altrimenti lo stesso cambio
  # manifest verrebbe rilevato di nuovo ad ogni run successiva). Resta FUORI
  # dal workflow riutilizzabile di deploy: dipende da logica specifica di
  # questa run, non generica "deploya questo tag su questo ambiente".
  register-backend-tag:
    needs: [versions, resolve-backend-image, deploy-backend]
    if: needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Registra il deploy di backend
        run: |
          if [ "${{ needs.versions.outputs.has_backend }}" = "true" ]; then
            TAG="backend-${{ needs.versions.outputs.date_tag }}"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG=$(git tag -l "backend-${{ needs.resolve-backend-image.outputs.branch_slug }}-*" --sort=-creatordate | head -1)
            git tag -fa "$TAG" -m "$TAG"
            git push origin "$TAG" --force
          fi

  # Vedi commento gemello in resolve-backend-image.
  resolve-frontend-image:
    needs: [versions, build-frontend]
    if: |
      always() &&
      needs.versions.outputs.deploy_frontend == 'true' &&
      needs.versions.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      branch_slug: ${{ steps.image.outputs.branch_slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina l'immagine frontend da usare
        id: image
        run: |
          BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.versions.outputs.has_frontend }}" = "true" ]; then
            echo "image_tag=${{ needs.versions.outputs.date_tag }}" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git tag -l "frontend-${BRANCH_SLUG}-*" --sort=-creatordate | head -1)
            if [ -z "$PREV" ]; then
              echo "ERRORE: nessuna immagine frontend risulta mai deployata su questo branch, e questa run non ne ha buildata una nuova. Impossibile continuare." >&2
              exit 1
            fi
            echo "image_tag=${PREV#frontend-}" >> "$GITHUB_OUTPUT"
          fi

  # Applica SOLO i manifest sotto frontend/k8s/ e fa il rollout del solo
  # Deployment frontend, tramite il workflow riutilizzabile (stesso usato da
  # promote.yml per la produzione). Se backend non cambia, il suo Deployment
  # non viene MAI toccato da questa run.
  deploy-frontend:
    needs: resolve-frontend-image
    if: needs.resolve-frontend-image.result == 'success'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: development
      image_tag: ${{ needs.resolve-frontend-image.outputs.image_tag }}
    secrets: inherit

  # Vedi commento gemello in register-backend-tag.
  register-frontend-tag:
    needs: [versions, resolve-frontend-image, deploy-frontend]
    if: needs.deploy-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Registra il deploy di frontend
        run: |
          if [ "${{ needs.versions.outputs.has_frontend }}" = "true" ]; then
            TAG="frontend-${{ needs.versions.outputs.date_tag }}"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            TAG=$(git tag -l "frontend-${{ needs.resolve-frontend-image.outputs.branch_slug }}-*" --sort=-creatordate | head -1)
            git tag -fa "$TAG" -m "$TAG"
            git push origin "$TAG" --force
          fi

  # A fine deploy, ripulisce dal registry le immagini taggate con la sola data,
  # mantenendo solo le 3 più recenti per repository immagine. I tag di versione
  # reale (X.Y.Z, assegnati dal workflow Tag) sono esclusi e non vengono mai
  # toccati da questa pulizia.
  #
  # Non usa "actions/delete-package-versions" (dismessa: gira solo forzata su
  # un runtime Node deprecato, warning visibile nel summary di ogni run) — usa
  # direttamente l'API di GitHub Packages via "gh api", stesso approccio già
  # usato in cleanup-build-tags.yml.
  cleanup-registry:
    needs: [versions, deploy-backend, deploy-frontend]
    if: |
      always() &&
      needs.versions.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      packages: write
    steps:
      - name: Rimuovi vecchie immagini Docker (mantieni le 3 più recenti per repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for IMG in clubmanager-backend clubmanager-frontend; do
            echo "=== $IMG ==="
            VERSIONS=$(gh api "/users/$OWNER/packages/container/$IMG/versions?per_page=100" --paginate 2>/dev/null || echo '[]')

            # Esclude le versioni senza tag e quelle con un tag di versione
            # reale (X.Y.Z): l'API cancella per digest, non per singolo tag,
            # e un digest condiviso con un tag reale non va mai toccato.
            NON_REAL=$(echo "$VERSIONS" | jq -c '
              [.[] | select(
                ((.metadata.container.tags // []) | length) > 0 and
                ((.metadata.container.tags // []) | map(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | any | not)
              )] | sort_by(.created_at) | reverse
            ')

            TOTAL=$(echo "$NON_REAL" | jq 'length')
            if [ "$TOTAL" -le 3 ]; then
              echo "  $TOTAL versioni (non di release) presenti, nulla da eliminare (soglia: 3)."
              continue
            fi

            echo "$NON_REAL" | jq -c '.[3:][]' | while read -r v; do
              ID=$(echo "$v" | jq -r '.id')
              TAGS=$(echo "$v" | jq -r '.metadata.container.tags[]?' | tr '\n' ' ')
              echo "  Elimino versione $ID (tag: $TAGS)"
              gh api -X DELETE "/users/$OWNER/packages/container/$IMG/versions/$ID"
            done
          done
