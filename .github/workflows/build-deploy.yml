name: Build & Deploy

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch: {}

jobs:
  # Calcola le versioni "reali" (da package.json) e un tag univoco basato sulla
  # data (yyyymmdd_HHMM) usato per taggare immagini Docker e commit durante
  # questa run. Il tag reale (server-vX.Y.Z / client-vX.Y.Z / k8s-vX.Y.Z) viene
  # assegnato solo dopo un deploy riuscito, dal workflow Tag.
  versions:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write
    outputs:
      server: ${{ steps.v.outputs.server }}
      client: ${{ steps.v.outputs.client }}
      k8s: ${{ steps.v.outputs.k8s }}
      date_tag: ${{ steps.v.outputs.date_tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          echo "server=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "client=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "k8s=$(node -p "require('./k8s/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Tag "di build" sul repo, univoco per run grazie alla data: permette di
      # risalire esattamente al commit buildato/deployato da questa run, anche
      # quando i package.json non sono stati bumpati. Il workflow Tag lo rimuove
      # dopo aver assegnato il tag reale.
      - name: Crea tag di build sul repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "build-${{ steps.v.outputs.date_tag }}" -m "Build ${{ steps.v.outputs.date_tag }}"
          git push origin "build-${{ steps.v.outputs.date_tag }}"

      - name: Scrivi versions.json
        run: |
          cat > versions.json <<EOF
          {
            "server": "${{ steps.v.outputs.server }}",
            "client": "${{ steps.v.outputs.client }}",
            "k8s": "${{ steps.v.outputs.k8s }}",
            "date_tag": "${{ steps.v.outputs.date_tag }}",
            "sha": "${{ steps.v.outputs.sha }}"
          }
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: versions
          path: versions.json

  build-backend:
    needs: versions
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # La compilazione avviene qui, nella pipeline: il Dockerfile non esegue
      # alcuna build, si limita a impacchettare backend/dist già pronto.
      - name: Installa dipendenze e builda il backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushati: solo quello di data + latest. Il tag di versione reale
      # (server-vX.Y.Z) viene aggiunto dal workflow Tag dopo un deploy riuscito.
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubmanager-backend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubmanager-backend:latest

  build-frontend:
    needs: versions
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le variabili VITE_* sono compilate nel bundle statico da Vite in questo
      # step (pipeline), non nel Dockerfile: Vite le legge solo a build-time.
      # LOGO_FILE non ha prefisso VITE_ perché non è letta dal browser: la
      # legge scripts/apply-logo.mjs (hook "prebuild" di npm) per copiare il
      # logo del tenant da frontend/branding/ in frontend/public/logo.svg
      # prima che Vite lo includa come asset statico.
      #
      # VITE_API_BASE_URL/VITE_KEYCLOAK_URL/VITE_KEYCLOAK_REALM/VITE_KEYCLOAK_CLIENT_ID
      # non sono variabili GitHub separate: derivano da APP_DOMAIN/KEYCLOAK_HOST/
      # KEYCLOAK_REALM/KEYCLOAK_CLIENT_ID (stessi valori usati da backend/Infra),
      # per evitare di dover tenere sincronizzate due variabili identiche.
      - name: Installa dipendenze e builda il frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://${{ vars.APP_DOMAIN }}
          VITE_KEYCLOAK_URL: https://${{ vars.KEYCLOAK_HOST }}
          VITE_KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'clubmanager' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID || 'clubmanager-spa' }}
          VITE_TENANT_NAME: ${{ vars.VITE_TENANT_NAME }}
          VITE_ACTIVITY_SELECT_VALUES_MAPPING: ${{ vars.VITE_ACTIVITY_SELECT_VALUES_MAPPING }}
          VITE_THEME_PRIMARY: ${{ vars.VITE_THEME_PRIMARY }}
          VITE_THEME_PRIMARY_TEXT: ${{ vars.VITE_THEME_PRIMARY_TEXT }}
          VITE_THEME_DANGER: ${{ vars.VITE_THEME_DANGER }}
          VITE_THEME_SUCCESS: ${{ vars.VITE_THEME_SUCCESS }}
          VITE_THEME_NAV_BG: ${{ vars.VITE_THEME_NAV_BG }}
          VITE_THEME_NAV_TEXT: ${{ vars.VITE_THEME_NAV_TEXT }}
          LOGO_FILE: ${{ vars.LOGO_FILE }}
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clubmanager-frontend:${{ needs.versions.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/clubmanager-frontend:latest

  deploy:
    needs: [versions, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7

      # Sostituisce i placeholder ${VAR} nei template k8s/templates/app/*.yaml
      # (solo backend/frontend: namespace, Postgres e Keycloak sono gestiti dal
      # workflow Infra, non da questo) con i valori reali presi da GitHub
      # Variables/Secrets. L'output (k8s/rendered/) non viene mai committato:
      # contiene credenziali in chiaro (vedi .gitignore).
      - name: Renderizza manifest k8s
        env:
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clubmanager-backend:${{ needs.versions.outputs.date_tag }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clubmanager-frontend:${{ needs.versions.outputs.date_tag }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || 3000 }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || 5432 }}
          DB_NAME: ${{ vars.DB_NAME || 'clubmanager' }}
          DB_USER: ${{ vars.DB_USER || 'clubmanager' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KEYCLOAK_URL: https://${{ vars.KEYCLOAK_HOST }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'clubmanager' }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ vars.KEYCLOAK_ADMIN_CLIENT_ID || 'clubmanager-backend' }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p k8s/rendered
          VARS='$KUBE_NAMESPACE $BACKEND_IMAGE $FRONTEND_IMAGE $BACKEND_PORT $DB_HOST $DB_PORT $DB_NAME $DB_USER $DB_PASSWORD $KEYCLOAK_URL $KEYCLOAK_REALM $KEYCLOAK_ADMIN_CLIENT_ID $KEYCLOAK_ADMIN_CLIENT_SECRET $APP_DOMAIN'
          for f in k8s/templates/app/*.yaml; do
            envsubst "$VARS" < "$f" > "k8s/rendered/$(basename "$f")"
          done

      - name: Copia manifest sulla VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: "k8s/rendered/*"
          target: ${{ vars.DEPLOY_PATH || '/opt/clubmanager/k8s' }}
          strip_components: 2

      - name: Applica manifest e verifica rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          NS: ${{ vars.KUBE_NAMESPACE }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          envs: NS,GHCR_USER,GHCR_PAT
          script: |
            set -e
            # Vedi commento in infra.yml: kubectl (symlink a k3s) senza
            # KUBECONFIG esplicito risolve su /etc/rancher/k3s/k3s.yaml
            # (root:root), illeggibile dall'utente di deploy.
            export KUBECONFIG="$HOME/.kube/config"

            # I package ghcr.io sono privati di default: senza questo Secret
            # (referenziato da imagePullSecrets nei Deployment) i pod restano
            # in ImagePullBackOff. GHCR_PAT è un token dedicato (read:packages),
            # non il GITHUB_TOKEN della run: quello è valido solo per la durata
            # della pipeline, i pod invece devono poter fare pull in qualunque
            # momento futuro (restart, rischedulazione, ecc.).
            kubectl create secret docker-registry ghcr-secret -n "$NS" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USER" \
              --docker-password="$GHCR_PAT" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f ${{ vars.DEPLOY_PATH || '/opt/clubmanager/k8s' }}
            kubectl rollout status deployment/clubmanager-backend -n ${{ vars.KUBE_NAMESPACE }} --timeout=180s
            kubectl rollout status deployment/clubmanager-frontend -n ${{ vars.KUBE_NAMESPACE }} --timeout=180s

  # A fine deploy, ripulisce dal registry le immagini taggate con la sola data,
  # mantenendo solo le 3 più recenti per repository immagine. I tag di versione
  # reale (X.Y.Z, assegnati dal workflow Tag) sono esclusi e non vengono mai
  # toccati da questa pulizia.
  cleanup-registry:
    needs: [versions, deploy]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      packages: write
    strategy:
      matrix:
        image: [clubmanager-backend, clubmanager-frontend]
    steps:
      - name: Rimuovi vecchi tag di data (mantieni le 3 più recenti)
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
          ignore-versions: '^\d+\.\d+\.\d+$'
          token: ${{ secrets.GITHUB_TOKEN }}
