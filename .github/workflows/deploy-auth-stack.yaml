name: Deploy CloudFormation Auth

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      template-path:
        required: true
        type: string
      environment:
        required: true
        type: string
      tenant-config:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Auth-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Load tenant config
        id: tenant
        run: |
          source "infra/tenants/${{ inputs.tenant-config }}.env"
          echo "tenant-id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "frontend-redirect-uris=$FRONTEND_REDIRECT_URIS" >> $GITHUB_OUTPUT
          echo "frontend-logout-uris=$FRONTEND_LOGOUT_URIS" >> $GITHUB_OUTPUT

      - name: Create and Execute ChangeSet
        run: |
          set -e
          CHANGE_SET_NAME="gh-deploy-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          STACK_NAME="${{ inputs.stack-name }}"

          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" 2>/dev/null; then
            CHANGE_SET_TYPE="UPDATE"
          else
            CHANGE_SET_TYPE="CREATE"
          fi

          echo "Creating ChangeSet ($CHANGE_SET_TYPE)..."

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --template-body "file://${{ inputs.template-path }}" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --parameters \
              ParameterKey=Environment,ParameterValue=${{ steps.tenant.outputs.environment }} \
              ParameterKey=AwsRegion,ParameterValue=${{ inputs.aws-region }} \
              ParameterKey=FrontendRedirectUris,ParameterValue="${{ steps.tenant.outputs.frontend-redirect-uris }}" \
              ParameterKey=FrontendLogoutUris,ParameterValue="${{ steps.tenant.outputs.frontend-logout-uris }}" \
            --capabilities CAPABILITY_NAMED_IAM

          set +e
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME"
          WAIT_EXIT=$?
          set -e

          STATUS=$(aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query 'Status' --output text)

          REASON=$(aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query 'StatusReason' --output text 2>/dev/null || echo "")

          echo "ChangeSet status: $STATUS — $REASON"

          if [ "$STATUS" = "FAILED" ]; then
            if [[ "$REASON" == *"didn't contain changes"* ]] || [[ "$REASON" == *"No updates"* ]]; then
              echo "No changes to apply."
              exit 0
            fi
            exit 1
          fi

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME"

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ inputs.stack-name }}
          max-wait-time: '300'
          poll-interval: '10'
