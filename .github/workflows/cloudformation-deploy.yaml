name: CloudFormation Deploy

on:
  push:
    branches: [main, develop]

  # Permette esecuzione manuale con scelta del tenant
  workflow_dispatch:
    inputs:
      tenant-config:
        description: 'File di configurazione tenant (es. asd1.prod)'
        required: true
        default: 'asd1.dev'

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Determina quali stack deployare in base ai file modificati
  # ---------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run-auth:     ${{ steps.changes.outputs.run-auth }}
      run-db:       ${{ steps.changes.outputs.run-db }}
      run-backend:  ${{ steps.changes.outputs.run-backend }}
      run-frontend: ${{ steps.changes.outputs.run-frontend }}
      tenant-config: ${{ steps.tenant.outputs.tenant-config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine tenant config
        id: tenant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONFIG="${{ github.event.inputs.tenant-config }}"
          else
            # Mappa branch → tenant config di default
            case "${{ github.ref_name }}" in
              main)    CONFIG="asd1.prod" ;;
              develop) CONFIG="asd1.dev"  ;;
              *)       CONFIG="asd1.dev"  ;;
            esac
          fi
          echo "tenant-config=$CONFIG" >> $GITHUB_OUTPUT
          echo "Using tenant config: $CONFIG"

      - name: Detect changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          check() {
            local pattern=$1; local key=$2
            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "run-${key}=true" >> $GITHUB_OUTPUT
            else
              echo "run-${key}=false" >> $GITHUB_OUTPUT
            fi
          }

          check '^(\.github/workflows/|infra/auth/)' auth
          check '^(\.github/workflows/|infra/db/)' db
          check '^(\.github/workflows/|infra/backend/|backend/)' backend
          check '^(\.github/workflows/|infra/frontend/|frontend/)' frontend

  # ---------------------------------------------------------------
  # 1. Deploy Auth Stack
  # ---------------------------------------------------------------
  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-auth == 'true'
    uses: ./.github/workflows/deploy-auth-stack.yaml
    with:
      environment:   ${{ needs.detect-changes.outputs.tenant-config }}
      aws-region:    eu-central-1
      stack-name:    clubmanager-auth-${{ needs.detect-changes.outputs.tenant-config }}
      template-path: infra/auth/template.yaml
      tenant-config: ${{ needs.detect-changes.outputs.tenant-config }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # Recupera outputs Auth (sempre, anche se auth non è stato deployato)
  # ---------------------------------------------------------------
  auth-stack-outputs:
    needs: [detect-changes, deploy-auth]
    if: always() && (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped')
    uses: ./.github/workflows/auth-stack-outputs.yaml
    with:
      environment:  ${{ needs.detect-changes.outputs.tenant-config }}
      aws-region:   eu-central-1
      stack-name:   clubmanager-auth-${{ needs.detect-changes.outputs.tenant-config }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # 2. Deploy DB Stack
  # ---------------------------------------------------------------
  deploy-db:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-db == 'true'
    uses: ./.github/workflows/deploy-db-stack.yaml
    with:
      aws-region:    eu-central-1
      stack-name:    clubmanager-db-${{ needs.detect-changes.outputs.tenant-config }}
      template-path: infra/db/template.yaml
      tenant-config: ${{ needs.detect-changes.outputs.tenant-config }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # Recupera outputs DB
  # ---------------------------------------------------------------
  db-stack-outputs:
    needs: [detect-changes, deploy-db]
    if: always() && (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped')
    uses: ./.github/workflows/db-stack-outputs.yaml
    with:
      aws-region:   eu-central-1
      stack-name:   clubmanager-db-${{ needs.detect-changes.outputs.tenant-config }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # 3. Deploy Backend Stack
  # ---------------------------------------------------------------
  deploy-backend:
    needs: [auth-stack-outputs, db-stack-outputs, detect-changes]
    if: needs.detect-changes.outputs.run-backend == 'true'
    uses: ./.github/workflows/deploy-backend-stack.yaml
    with:
      environment:        ${{ needs.detect-changes.outputs.tenant-config }}
      aws-region:         eu-central-1
      stack-name:         clubmanager-backend-${{ needs.detect-changes.outputs.tenant-config }}
      template-path:      infra/backend/template.yaml
      tenant-config:      ${{ needs.detect-changes.outputs.tenant-config }}
      user-pool-id:       ${{ needs.auth-stack-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ needs.auth-stack-outputs.outputs.user-pool-client-id }}
      db-cluster-arn:     ${{ needs.db-stack-outputs.outputs.db-cluster-arn }}
      db-secret-arn:      ${{ needs.db-stack-outputs.outputs.db-secret-arn }}
      lambda-subnet-ids:  ${{ needs.db-stack-outputs.outputs.lambda-subnet-ids }}
      lambda-sg-id:       ${{ needs.db-stack-outputs.outputs.lambda-security-group-id }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # 4. Deploy Frontend Stack
  # ---------------------------------------------------------------
  backend-stack-outputs:
    needs: [detect-changes, deploy-backend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    uses: ./.github/workflows/backend-stack-outputs.yaml
    with:
      aws-region:   eu-central-1
      stack-name:   clubmanager-backend-${{ needs.detect-changes.outputs.tenant-config }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-frontend:
    needs: [auth-stack-outputs, backend-stack-outputs, detect-changes]
    if: needs.detect-changes.outputs.run-frontend == 'true'
    uses: ./.github/workflows/deploy-frontend-stack.yaml
    with:
      environment:         ${{ needs.detect-changes.outputs.tenant-config }}
      aws-region:          eu-central-1
      stack-name:          clubmanager-frontend-${{ needs.detect-changes.outputs.tenant-config }}
      template-path:       infra/frontend/template.yaml
      tenant-config:       ${{ needs.detect-changes.outputs.tenant-config }}
      user-pool-id:        ${{ needs.auth-stack-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ needs.auth-stack-outputs.outputs.user-pool-client-id }}
      cognito-domain:      ${{ needs.auth-stack-outputs.outputs.cognito-domain }}
      api-base-url:        ${{ needs.backend-stack-outputs.outputs.api-invoke-url }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ---------------------------------------------------------------
  # Crea test user (solo la prima volta o se auth cambia)
  # ---------------------------------------------------------------
  create-test-user:
    needs: auth-stack-outputs
    if: needs.auth-stack-outputs.result == 'success'
    uses: ./.github/workflows/create-test-user.yaml
    with:
      aws-region:          eu-central-1
      stack-name:          clubmanager-auth-${{ needs.detect-changes.outputs.tenant-config }}
      user-pool-id:        ${{ needs.auth-stack-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ needs.auth-stack-outputs.outputs.user-pool-client-id }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
