name: Deploy CloudFormation Auth

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/cloudformation-auth.yaml'
      - 'infra/auth/**'

env:
  AWS_REGION: eu-central-1
  ENV: ${{ github.ref_name }}
  STACK_NAME: clubmanager-auth-${{ github.ref_name }}
  TEMPLATE_PATH: infra/auth/template.yaml

permissions:
  id-token: write
  contents: read

jobs:
  deploy-auth:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-CF-Auth-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create and Execute ChangeSet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -e
        CHANGE_SET_NAME="gh-deploy-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"
        
        # Determina se lo stack esiste
        if aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} 2>/dev/null; then
          CHANGE_SET_TYPE="UPDATE"
          echo "Stack exists, using UPDATE change set type"
        else
          CHANGE_SET_TYPE="CREATE"
          echo "Stack does not exist, using CREATE change set type"
        fi
        
        echo "Creating ChangeSet $CHANGE_SET_NAME with type $CHANGE_SET_TYPE"
        
        aws cloudformation create-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --template-body file://${{ env.TEMPLATE_PATH }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --change-set-type $CHANGE_SET_TYPE \
          --parameters \
            ParameterKey=Environment,ParameterValue=${{ env.ENV }} \
            ParameterKey=AwsRegion,ParameterValue=${{ env.AWS_REGION }} \
            ParameterKey=FrontendRedirectUris,ParameterValue=http://localhost:5173/callback \
            ParameterKey=FrontendLogoutUris,ParameterValue=http://localhost:5173/ \
          --capabilities CAPABILITY_NAMED_IAM
        
        echo "Waiting for ChangeSet to be created..."
        # Disabilita set -e temporaneamente per il wait
        set +e
        # Cattura il codice di ritorno del wait senza interrompere lo script
        aws cloudformation wait change-set-create-complete \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME"
        WAIT_EXIT_CODE=$?
        set -e  # Riattiva set -e

        echo "Wait exit code: $WAIT_EXIT_CODE"
        
        # Controlla sempre lo stato del ChangeSet
        STATUS=$(aws cloudformation describe-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --query 'Status' \
          --output text)
        
        REASON=$(aws cloudformation describe-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --query 'StatusReason' \
          --output text || echo "")
        
        echo "ChangeSet status: $STATUS"
        echo "ChangeSet reason: $REASON"
        
        if [ "$STATUS" = "FAILED" ]; then
          if [[ "$REASON" == *"didn't contain changes"* ]] || [[ "$REASON" == *"No updates are to be performed"* ]]; then
            echo "No changes to apply, exiting successfully."
            exit 0
          else
            echo "ChangeSet failed for another reason: $REASON"
            exit 1
          fi
        fi
        
        echo "Executing ChangeSet..."
        aws cloudformation execute-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME"

    - name: Wait for stack completion
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: ./.github/actions/wait-cloudformation-stack
      with:
        stack-name: ${{ env.STACK_NAME }}
        max-wait-time: '120'
        poll-interval: '10'

    - name: Get Auth Stack Outputs
      id: auth-outputs
      run: |
        AUTH_STACK_NAME="clubmanager-auth-${{ env.ENV }}"
        
        USER_POOL_ID=$(aws cloudformation describe-stacks \
          --stack-name $AUTH_STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
          --output text)
        
        USER_PPOL_CLIENT_ID=$(aws cloudformation describe-stacks \
          --stack-name $AUTH_STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
          --output text)
        
        echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT
        echo "user-pool-client-id=$USER_PPOL_CLIENT_ID" >> $GITHUB_OUTPUT

    - name: Create Test User in Cognito
      run: |        
        EMAIL="test@clubmanager.it"
        PASSWORD="TestPassword123!"
        USER_POOL_ID="${{ steps.auth-outputs.outputs['user-pool-id'] }}"
        CLIENT_ID="${{ steps.auth-outputs.outputs['user-pool-client-id'] }}"
        
        echo "Checking if user $EMAIL exists..."
        
        # Verifica se utente esiste (cattura exit code)
        set +e
        aws cognito-idp admin-get-user \
          --user-pool-id "$USER_POOL_ID" \
          --username "$EMAIL" &>/dev/null
        USER_EXISTS=$?
        set -e
        
        if [ $USER_EXISTS -eq 0 ]; then
          echo "User $EMAIL already exists, skipping creation"
        else
          echo "Creating new user $EMAIL..."
          
          # Crea utente
          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --user-attributes Name=email,Value="$EMAIL" Name=email_verified,Value=true \
            --temporary-password "TempPass123!" \
            --message-action SUPPRESS
          
          echo "User created successfully"
        fi
        
        # Imposta password permanente (funziona sempre)
        echo "Setting permanent password..."
        aws cognito-idp admin-set-user-password \
          --user-pool-id "$USER_POOL_ID" \
          --username "$EMAIL" \
          --password "$PASSWORD" \
          --permanent
        
        echo "✓ Test user ready: $EMAIL / $PASSWORD"
        
        # Abilita auth flows
        echo "Configuring auth flows..."
        aws cognito-idp update-user-pool-client \
          --user-pool-id "$USER_POOL_ID" \
          --client-id "$CLIENT_ID" \
          --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH
        
        echo "✓ Auth flow enabled"

    - name: Show Outputs
      if: always()
      run: |
        aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs' \
          --output table
