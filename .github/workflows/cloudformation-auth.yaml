name: Deploy CloudFormation Auth

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/cloudformation-auth.yaml'
      - 'infra/auth/**'

env:
  AWS_REGION: eu-central-1
  STACK_NAME: clubmanager-auth-test
  TEMPLATE_PATH: infra/auth/template.yaml
  PARAMS_PATH: infra/auth/parameters.json

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-CF-Auth-${{ github.sha }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy CloudFormation Stack
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set +e
        aws cloudformation deploy \
          --template-file ${{ env.TEMPLATE_PATH }} \
          --stack-name ${{ env.STACK_NAME }} \
          --parameters file://${{ env.PARAMS_PATH }} \
          --capabilities CAPABILITY_NAMED_IAM \
          --no-fail-on-empty-changeset
        
        EXIT_CODE=$?
        echo "cloudformation deploy exit code: $EXIT_CODE"
        exit $EXIT_CODE
        
    - name: Show Outputs
      if: always()
      run: |
        aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs' \
          --output table
