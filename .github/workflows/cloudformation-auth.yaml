name: Deploy CloudFormation Auth

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/cloudformation-auth.yaml'
      - 'infra/auth/**'

env:
  AWS_REGION: eu-central-1
  STACK_NAME: clubmanager-auth-test
  TEMPLATE_PATH: infra/auth/template.yaml
  PARAMS_PATH: infra/auth/parameters.json

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-CF-Auth-${{ github.sha }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create and Execute ChangeSet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -e
        CHANGE_SET_NAME="gh-deploy-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"

        echo "Creating ChangeSet $CHANGE_SET_NAME"

        aws cloudformation create-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --template-body file://${{ env.TEMPLATE_PATH }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --change-set-type CREATE \
          --parameter file://${{ env.PARAMS_PATH }} \
          --capabilities CAPABILITY_NAMED_IAM

        echo "Waiting for ChangeSet to be created..."
        aws cloudformation wait change-set-create-complete \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME"

        STATUS=$(aws cloudformation describe-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --query 'Status' \
          --output text)

        REASON=$(aws cloudformation describe-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME" \
          --query 'StatusReason' \
          --output text || echo "")

        echo "ChangeSet status: $STATUS"
        echo "ChangeSet reason: $REASON"

        if [ "$STATUS" = "FAILED" ]; then
          if [[ "$REASON" == *"The submitted information didn't contain changes"* ]]; then
            echo "No changes to apply, exiting successfully."
            exit 0
          else
            echo "ChangeSet failed for another reason."
            exit 1
          fi
        fi

        echo "Executing ChangeSet..."
        aws cloudformation execute-change-set \
          --stack-name ${{ env.STACK_NAME }} \
          --change-set-name "$CHANGE_SET_NAME"

        echo "Waiting for stack to complete..."
        aws cloudformation wait stack-create-complete \
          --stack-name ${{ env.STACK_NAME }} || \
        aws cloudformation wait stack-update-complete \
          --stack-name ${{ env.STACK_NAME }}

    - name: Show Outputs
      if: always()
      run: |
        aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs' \
          --output table
