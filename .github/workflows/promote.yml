name: Promote

# Attivazione MANUALE, con l'ambiente di destinazione e la versione da
# deployare come INPUT ESPLICITI (backend_version/frontend_version/
# authorizer_version, es. "1.4.0" — non un tag Git per esteso, solo il numero)
# — non decide nulla, non tagga nulla: quello è compito esclusivo di tag.yml.
# Questo workflow fa solo il deploy della versione indicata, già promossa da
# Tag in precedenza, nell'ambiente scelto.
#
# Ogni club è un Environment GitHub a sé, con namespace clubby-<env>-app e
# clubby-<env>-db sullo stesso cluster (vedi .github/actions/ambiente): la
# stessa versione si porta in un club alla volta, scegliendo l'Environment.
# development resta escluso: lì deploya Build & Deploy a ogni push, e una
# promozione manuale ne scavalcherebbe lo stato.
#
# Separato da tag.yml perché tag/versioning e deploy hanno un ciclo di vita
# diverso: taggare una versione è una decisione (rara, revisionabile via
# GitHub Release), farla girare in un ambiente è un'operazione che può servire
# ripetere (es. per riallineare un club dopo un incidente) senza dover
# ripassare da Tag. Rilanciabile più volte con lo stesso input, in sicurezza.
#
# Accetta uno o più scope: puoi promuovere solo backend, solo frontend, solo
# authorizer, o più d'uno nella stessa run — ognuno deploya indipendentemente
# tramite lo stesso workflow riutilizzabile usato da Build & Deploy per lo
# sviluppo (deploy-backend.yml/deploy-frontend.yml/deploy-authorizer.yml).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente di destinazione (il club): deve esistere come Environment del repo, con le proprie Variables/Secrets'
        type: environment
        required: true
      backend_version:
        description: 'Versione backend da deployare (es. 1.4.0) — deve esistere già come tag backend-vX.Y.Z (creato da Tag)'
        required: false
        default: ''
      frontend_version:
        description: 'Versione frontend da deployare (es. 1.4.0) — deve esistere già come tag frontend-vX.Y.Z (creato da Tag)'
        required: false
        default: ''
      authorizer_version:
        description: 'Versione authorizer da deployare (es. 1.0.0) — deve esistere già come tag authorizer-vX.Y.Z (creato da Tag)'
        required: false
        default: ''

jobs:
  # Valida gli input PRIMA di deployare qualunque cosa: un input libero come
  # questo (nessun menu a tendina, solo testo) rischia di deployare
  # un'immagine sbagliata/inesistente su un typo. Verifica che il tag di
  # versione esista davvero nel repo, altrimenti fallisce subito con un
  # errore chiaro invece di procedere.
  validate:
    runs-on: ubuntu-24.04
    outputs:
      backend_image_tag: ${{ steps.check.outputs.backend_image_tag }}
      frontend_image_tag: ${{ steps.check.outputs.frontend_image_tag }}
      authorizer_image_tag: ${{ steps.check.outputs.authorizer_image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Solo il nome: che sia usabile come namespace lo verificano i workflow
      # di deploy, con la stessa action che ne ricava i namespace.
      - name: Verifica l'ambiente di destinazione
        env:
          AMBIENTE: ${{ inputs.environment }}
        run: |
          if [ "$AMBIENTE" = "development" ]; then
            echo "::error::development non si promuove: lì deploya Build & Deploy a ogni push. Scegli l'ambiente di un club."
            exit 1
          fi
          echo "Ambiente di destinazione: $AMBIENTE"

      - name: Verifica input e tag di versione esistenti
        id: check
        run: |
          if [ -z "${{ inputs.backend_version }}" ] && [ -z "${{ inputs.frontend_version }}" ] && [ -z "${{ inputs.authorizer_version }}" ]; then
            echo "::error::Specifica almeno una fra backend_version, frontend_version e authorizer_version."
            exit 1
          fi

          if [ -n "${{ inputs.backend_version }}" ]; then
            TAG="backend-v${{ inputs.backend_version }}"
            if ! git tag -l "$TAG" | grep -qx "$TAG"; then
              echo "::error::Tag '$TAG' non trovato nel repo. Esegui prima il workflow Tag per crearlo, poi rilancia Promote."
              exit 1
            fi
            echo "backend_image_tag=${{ inputs.backend_version }}" >> "$GITHUB_OUTPUT"
            echo "Backend: $TAG trovato, verrà deployata la versione ${{ inputs.backend_version }}."
          fi

          if [ -n "${{ inputs.frontend_version }}" ]; then
            TAG="frontend-v${{ inputs.frontend_version }}"
            if ! git tag -l "$TAG" | grep -qx "$TAG"; then
              echo "::error::Tag '$TAG' non trovato nel repo. Esegui prima il workflow Tag per crearlo, poi rilancia Promote."
              exit 1
            fi
            echo "frontend_image_tag=${{ inputs.frontend_version }}" >> "$GITHUB_OUTPUT"
            echo "Frontend: $TAG trovato, verrà deployata la versione ${{ inputs.frontend_version }}."
          fi

          if [ -n "${{ inputs.authorizer_version }}" ]; then
            TAG="authorizer-v${{ inputs.authorizer_version }}"
            if ! git tag -l "$TAG" | grep -qx "$TAG"; then
              echo "::error::Tag '$TAG' non trovato nel repo. Esegui prima il workflow Tag per crearlo, poi rilancia Promote."
              exit 1
            fi
            echo "authorizer_image_tag=${{ inputs.authorizer_version }}" >> "$GITHUB_OUTPUT"
            echo "Authorizer: $TAG trovato, verrà deployata la versione ${{ inputs.authorizer_version }}."
          fi

  # Migrazioni di schema prima dei deploy che usano un database, come in
  # build-deploy.yml: un club può essere fermo a una versione vecchia, quindi
  # qui possono risultarne pendenti parecchie in una volta. Sono applicate in
  # ordine e in transazioni separate, e quelle già presenti vengono saltate.
  #
  # Qui NON serve !cancelled(): l'unico needs è validate, che non può essere
  # saltato. Aggiungercelo toglierebbe il success() implicito, e un validate
  # fallito non fermerebbe più le migrazioni.
  migrate-db:
    needs: validate
    if: inputs.backend_version != '' || inputs.authorizer_version != ''
    uses: ./.github/workflows/migrate-db.yml
    with:
      environment: ${{ inputs.environment }}
      backend_image_tag: ${{ needs.validate.outputs.backend_image_tag }}
      authorizer_image_tag: ${{ needs.validate.outputs.authorizer_image_tag }}
    secrets: inherit

  # !cancelled() come in build-deploy.yml: senza una funzione di stato, uno
  # skip a monte (qui migrate-db, quando si promuove il solo frontend) salta
  # questo job PRIMA che la condizione venga valutata. Con la funzione di
  # stato il success() implicito sparisce, quindi "validate riuscito" va
  # richiesto per esteso: altrimenti un validate fallito non fermerebbe più
  # il deploy.
  deploy-backend:
    needs: [validate, migrate-db]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      inputs.backend_version != '' &&
      needs.migrate-db.result == 'success'
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.validate.outputs.backend_image_tag }}
    secrets: inherit

  # Come in build-deploy.yml: il frontend non usa il database, ma se la
  # migrazione fallisce il backend resta indietro e un frontend nuovo
  # chiamerebbe API non ancora deployate. "skipped" è ammesso perché
  # promuovendo il solo frontend il job delle migrazioni non gira affatto.
  deploy-frontend:
    needs: [validate, migrate-db]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      inputs.frontend_version != '' &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped')
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.validate.outputs.frontend_image_tag }}
    secrets: inherit

  # Vedi commento gemello in deploy-backend.
  deploy-authorizer:
    needs: [validate, migrate-db]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      inputs.authorizer_version != '' &&
      needs.migrate-db.result == 'success'
    uses: ./.github/workflows/deploy-authorizer.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.validate.outputs.authorizer_image_tag }}
    secrets: inherit
