name: Deploy CloudFormation Backend

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        description: 'AWS Region to deploy the stack'
        type: string
      stack-name:
        required: true
        description: 'CloudFormation stack name'
        type: string
      template-path:
        required: true
        description: 'Path to CloudFormation template file'
        type: string
      environment:
        required: true
        description: 'Deployment environment'
        type: string
      user-pool-id:
        required: true
        type: string
      user-pool-client-id:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Backend-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          ls -la dist/

      - name: Create Lambda deployment package
        working-directory: backend
        run: |
          zip -r ../backend-lambda-${{ github.sha }}.zip \
            dist/ \
            node_modules/ \
            package.json
          ls -lh ../backend-lambda-${{ github.sha }}.zip

      # FASE 1: Deploy stack CloudFormation
      - name: Deploy CloudFormation Stack
        run: |
          set +e
          aws cloudformation deploy \
            --template-file ${{ inputs.template-path }} \
            --stack-name ${{ inputs.stack-name }} \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              AwsRegion=${{ inputs.aws-region }} \
              UserPoolId=${{ inputs.user-pool-id }} \
              UserPoolClientId=${{ inputs.user-pool-client-id }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          
          EXIT_CODE=$?
          echo "CloudFormation deploy exit code: $EXIT_CODE"
          
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 255 ]; then
            exit $EXIT_CODE
          fi

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ inputs.stack-name }}
          max-wait-time: '120'
          poll-interval: '10'

      # FASE 2: Upload Lambda package a S3
      - name: Get S3 bucket name
        id: get-bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`LambdaArtifactsBucketName`].OutputValue' \
            --output text)
          
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "ERROR: Bucket name not found"
            exit 1
          fi
          
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp backend-lambda-${{ github.sha }}.zip \
            s3://${{ steps.get-bucket.outputs.bucket }}/backend-lambda-${{ github.sha }}.zip
          
          echo "Package uploaded to S3"

      # FASE 3: Update Lambda function
      - name: Update Lambda function
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendLambdaArn`].OutputValue' \
            --output text | cut -d: -f7)
          
          echo "Updating Lambda: $FUNCTION_NAME"
          
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket ${{ steps.get-bucket.outputs.bucket }} \
            --s3-key backend-lambda-${{ github.sha }}.zip

          # Aspetta update code
          aws lambda wait function-updated --function-name $FUNCTION_NAME

          # Update HANDLER per NestJS
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --handler dist/main.handler
          
          # Aspetta update config
          aws lambda wait function-updated --function-name $FUNCTION_NAME
          
          echo "Lambda function updated: $FUNCTION_NAME"

      - name: Show Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs' \
            --output table || echo "Stack not found"
      