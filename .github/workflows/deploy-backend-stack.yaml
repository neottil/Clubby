name: Deploy CloudFormation Backend

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      template-path:
        required: true
        type: string
      environment:
        required: true
        type: string
      tenant-config:
        required: true
        type: string
      user-pool-id:
        required: true
        type: string
      user-pool-client-id:
        required: true
        type: string
      db-cluster-arn:
        required: true
        type: string
      db-secret-arn:
        required: true
        type: string
      lambda-subnet-ids:
        required: true
        type: string
      lambda-sg-id:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Backend-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Load tenant config
        id: tenant
        run: |
          source "infra/tenants/${{ inputs.tenant-config }}.env"
          echo "tenant-id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "db-name=${DB_NAME:-clubmanager}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          echo "Build output:"
          find dist -name "*.js" | head -20

      - name: Create Lambda deployment package
        working-directory: backend
        run: |
          # Installa solo le dipendenze di produzione per ridurre la dimensione
          npm ci --omit=dev
          zip -r ../backend-lambda-${{ github.sha }}.zip dist/ node_modules/ package.json
          ls -lh ../backend-lambda-${{ github.sha }}.zip

      - name: Reinstalla devDependencies
        working-directory: backend
        run: npm ci

      # FASE 1: Deploy stack CloudFormation (infra)
      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ inputs.template-path }} \
            --stack-name ${{ inputs.stack-name }} \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              TenantId=${{ steps.tenant.outputs.tenant-id }} \
              AwsRegion=${{ inputs.aws-region }} \
              UserPoolId=${{ inputs.user-pool-id }} \
              UserPoolClientId=${{ inputs.user-pool-client-id }} \
              DBClusterArn=${{ inputs.db-cluster-arn }} \
              DBSecretArn=${{ inputs.db-secret-arn }} \
              DBName=${{ steps.tenant.outputs.db-name }} \
              LambdaSubnetIds=${{ inputs.lambda-subnet-ids }} \
              LambdaSecurityGroupId=${{ inputs.lambda-sg-id }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ inputs.stack-name }}
          max-wait-time: '300'
          poll-interval: '15'

      # FASE 2: Upload Lambda package a S3
      - name: Get S3 bucket name
        id: get-bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`LambdaArtifactsBucketName`].OutputValue' \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET"

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp backend-lambda-${{ github.sha }}.zip \
            s3://${{ steps.get-bucket.outputs.bucket }}/backend-lambda-${{ github.sha }}.zip

      # FASE 3: Aggiorna le Lambda functions
      - name: Update Lambda functions
        run: |
          STACK="${{ inputs.stack-name }}"
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"
          KEY="backend-lambda-${{ github.sha }}.zip"

          get_fn_name() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey==\`$1\`].OutputValue" \
              --output text | rev | cut -d: -f1 | rev
          }

          update_lambda() {
            local arn_key=$1
            local handler=$2
            local fn_name=$(get_fn_name "$arn_key")

            echo "Updating $fn_name (handler: $handler)..."

            aws lambda update-function-code \
              --function-name "$fn_name" \
              --s3-bucket "$BUCKET" \
              --s3-key "$KEY"

            aws lambda wait function-updated --function-name "$fn_name"

            aws lambda update-function-configuration \
              --function-name "$fn_name" \
              --handler "$handler"

            aws lambda wait function-updated --function-name "$fn_name"
            echo "Updated: $fn_name"
          }

          update_lambda LambdaSociArn    "dist/handlers/soci.handler"
          update_lambda LambdaIncontriArn "dist/handlers/incontri.handler"
          update_lambda LambdaBuoniArn   "dist/handlers/buoni.handler"
          update_lambda LambdaAdminArn   "dist/handlers/admin.handler"

          echo "All Lambda functions updated."
