name: Show Backend Stack Deployment Output

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        description: 'AWS Region to deploy the stack'
        type: string
      stack-name:
        required: true
        description: 'CloudFormation stack name'
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  produce-summary:
    runs-on: ubuntu-latest
    outputs:
      user-pool-id: ${{ steps.auth-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ steps.auth-outputs.outputs.user-pool-client-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Auth-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}
          
      - name: Summary
        run: |
          echo "## Stack Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Ottieni gli outputs come JSON e converti in Markdown table
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs' \
            --output json)
          
          # Crea header tabella Markdown
          echo "| Description | ExportName | Output Key | Output Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------------|-------------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          # Popola righe della tabella
          echo "$OUTPUTS" | jq -r '.[] | "| \(.Description // "N/A") | \(.ExportName // "N/A") | \(.OutputKey) | \(.OutputValue) |"' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully" >> $GITHUB_STEP_SUMMARY
