name: Auth Stack Outputs

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        description: 'AWS Region to deploy the stack'
        type: string
      stack-name:
        required: true
        description: 'CloudFormation stack name'
        type: string
      environment:
        required: true
        description: 'Deployment environment'
        type: string
    outputs:
      user-pool-id:
        description: "Cognito User Pool ID"
        value: ${{ jobs.deploy.outputs.user-pool-id }}
      user-pool-client-id:
        description: "Cognito User Pool Client ID"
        value: ${{ jobs.deploy.outputs.user-pool-client-id }}
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  produce-outputs:
    runs-on: ubuntu-latest
    outputs:
      user-pool-id: ${{ steps.auth-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ steps.auth-outputs.outputs.user-pool-client-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Auth-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Get Auth Stack Outputs
        id: auth-outputs
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)
          
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
            --output text)
          
          echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
