name: Auth Stack Outputs

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      environment:
        required: true
        type: string
    outputs:
      user-pool-id:
        value: ${{ jobs.produce-outputs.outputs.user-pool-id }}
      user-pool-client-id:
        value: ${{ jobs.produce-outputs.outputs.user-pool-client-id }}
      cognito-domain:
        value: ${{ jobs.produce-outputs.outputs.cognito-domain }}
      user-pool-arn:
        value: ${{ jobs.produce-outputs.outputs.user-pool-arn }}
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  produce-outputs:
    runs-on: ubuntu-latest
    outputs:
      user-pool-id:       ${{ steps.auth-outputs.outputs.user-pool-id }}
      user-pool-client-id: ${{ steps.auth-outputs.outputs.user-pool-client-id }}
      cognito-domain:     ${{ steps.auth-outputs.outputs.cognito-domain }}
      user-pool-arn:      ${{ steps.auth-outputs.outputs.user-pool-arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-Auth-Outputs-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Get Auth Stack Outputs
        id: auth-outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name ${{ inputs.stack-name }} \
              --query "Stacks[0].Outputs[?OutputKey==\`$1\`].OutputValue" \
              --output text
          }

          echo "user-pool-id=$(get_output UserPoolId)"           >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$(get_output UserPoolClientId)" >> $GITHUB_OUTPUT
          echo "cognito-domain=$(get_output UserPoolDomain)"     >> $GITHUB_OUTPUT
          echo "user-pool-arn=$(get_output UserPoolArn)"         >> $GITHUB_OUTPUT
