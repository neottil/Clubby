name: Cleanup build tags

# Elimina i tag "<scope>-<branch>-<data>" creati da Build & Deploy per i tre
# moduli (backend, frontend, authorizer) — sia i tag Git nel repo, sia le
# immagini Docker corrispondenti su ghcr.io (clubby-backend, clubby-frontend,
# clubby-authorizer).
#
# Attivazione MANUALE, oppure AUTOMATICA (fire-and-forget) alla fine di ogni
# promozione riuscita del workflow Tag, scoped a branch=main e
# preserve_latest=true. I tre moduli sono scope indipendenti (vedi input
# "scope" sotto): il trigger automatico da Tag lo passa quando ha promosso un
# solo scope in quella run, per non ripulire (e non generare rumore nei
# log/summary) uno scope che non ha subito nessuna modifica.
#
# Questi tag non sono "usa e getta": sono anche la baseline che Build & Deploy
# usa per calcolare il diff della prossima run su quel branch (vedi
# build-deploy.yml) e il riferimento che il workflow Tag usa per sapere cosa
# promuovere. Per questo, di default (preserve_latest=true), per ciascuno
# scope E per ciascun branch coinvolto viene sempre mantenuto il tag più
# recente (Git + immagine Docker corrispondente) — solo quelli PIÙ VECCHI
# vengono eliminati. Così è sicuro lanciarlo (anche in automatico) su un
# branch ancora attivo come main: dopo la pulizia resta comunque un tag da
# cui Build & Deploy può calcolare il prossimo diff.
#
# Metti preserve_latest=false solo quando un branch feature/fix è concluso e
# mergiato: in quel caso nessuno dei suoi tag serve più a nessuno, e si può
# ripulire per intero.
#
# Non tocca mai i tag di versione reale (server-v*/client-v*).
on:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Scope da ripulire: "backend", "frontend", "authorizer", o vuoto per tutti
          (default). Usa questo per limitare la pulizia a un solo scope — es.
          il trigger automatico da Tag lo imposta quando ha promosso un solo
          scope in quella run; per una pulizia manuale di un branch
          feature/fix di solito si lascia vuoto (entrambi).
        required: false
        default: ''
      branch:
        description: >-
          Branch da ripulire: (es. "main", "feature/refactoring").
          Vuoto = ripulisce i tag di TUTTI i branch.
        required: false
        default: ''
      preserve_latest:
        description: >-
          Se true, mantiene per ciascuno scope e per ciascun branch coinvolto
          il tag più recente (Git e immagine Docker), elimina solo quelli più
          vecchi. Necessario per ripulire un branch ANCORA ATTIVO (es. main)
          senza rompere il prossimo diff di Build & Deploy. Metti a false solo
          quando il branch è concluso/mergiato.
        type: boolean
        default: true
      dry_run:
        description: 'Se true, elenca solo cosa verrebbe eliminato (tag Git e immagini Docker), senza cancellare nulla'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determina gli scope da processare
        id: scopes
        run: |
          case "${{ inputs.scope }}" in
            '')
              echo "list=backend frontend authorizer" >> "$GITHUB_OUTPUT"
              ;;
            backend|frontend|authorizer)
              echo "list=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERRORE: scope non valido '${{ inputs.scope }}' (valori ammessi: backend, frontend, authorizer, o vuoto per tutti)." >&2
              exit 1
              ;;
          esac

      # Per ciascuno scope, elenca i tag "<scope>-<branch>-<data>" che
      # matchano il branch richiesto (o tutti, se vuoto), li raggruppa per
      # branch — estraendo lo slug dal nome: tutto tra "<scope>-" e la data
      # finale nel formato fisso "-YYYYMMDD_HHMM" — e per ciascun gruppo, se
      # preserve_latest=true, tiene da parte il più recente. Scrive su file
      # gli elenchi "tag Git da eliminare" e "date_tag Docker da mantenere",
      # riusati dagli step successivi.
      - name: Calcola cosa mantenere e cosa eliminare
        run: |
          mkdir -p /tmp/cleanup
          BRANCH_FILTER=$(echo "${{ inputs.branch }}" | tr '/' '-')

          for SCOPE in ${{ steps.scopes.outputs.list }}; do
            : > "/tmp/cleanup/${SCOPE}_delete_git.txt"
            : > "/tmp/cleanup/${SCOPE}_keep_datetags.txt"
            # Stessi tag di _keep_datetags, ma col nome completo: quello serve
            # al confronto con i tag Docker, questo al riepilogo finale.
            : > "/tmp/cleanup/${SCOPE}_keep_git.txt"
            : > "/tmp/cleanup/${SCOPE}_docker.txt"

            if [ -n "$BRANCH_FILTER" ]; then
              PATTERN="${SCOPE}-${BRANCH_FILTER}-*"
            else
              PATTERN="${SCOPE}-*"
            fi

            TAGS=$(git tag -l "$PATTERN" --sort=-creatordate)
            if [ -z "$TAGS" ]; then
              echo "[$SCOPE] Nessun tag '$PATTERN' trovato."
              continue
            fi

            declare -A SEEN_BRANCH=()
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              REST="${tag#${SCOPE}-}"
              if [[ "$REST" =~ ^(.+)-([0-9]{8}_[0-9]{4})$ ]]; then
                BR="${BASH_REMATCH[1]}"
                DATE_TAG="${BR}-${BASH_REMATCH[2]}"
              else
                echo "[$SCOPE] Tag '$tag' non nel formato atteso <scope>-<branch>-<data>, salto."
                continue
              fi

              if [ "${{ inputs.preserve_latest }}" = "true" ] && [ -z "${SEEN_BRANCH[$BR]:-}" ]; then
                SEEN_BRANCH[$BR]=1
                echo "[$SCOPE/$BR] mantengo $tag"
                echo "$DATE_TAG" >> "/tmp/cleanup/${SCOPE}_keep_datetags.txt"
                echo "$tag" >> "/tmp/cleanup/${SCOPE}_keep_git.txt"
              else
                echo "[$SCOPE/$BR] da eliminare: $tag"
                echo "$tag" >> "/tmp/cleanup/${SCOPE}_delete_git.txt"
              fi
            done <<< "$TAGS"
          done

      - name: Elimina i tag Git
        run: |
          for SCOPE in ${{ steps.scopes.outputs.list }}; do
            FILE="/tmp/cleanup/${SCOPE}_delete_git.txt"
            if [ ! -s "$FILE" ]; then
              echo "[$SCOPE] Nessun tag Git da eliminare."
              continue
            fi

            echo "[$SCOPE] Tag Git da eliminare:"
            cat "$FILE"

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "[$SCOPE] dry_run=true: nessun tag Git eliminato."
              continue
            fi

            while IFS= read -r tag; do
              git push origin ":refs/tags/$tag"
            done < "$FILE"
          done

      # Usa l'API di GitHub Packages direttamente (non actions/delete-package-versions,
      # che non supporta un filtro per tag): elenca ogni versione dell'immagine,
      # e cancella quelle il cui tag è nel formato "<branch>-<data>" MA non è tra
      # quelli da mantenere (calcolati nello step sopra) — saltando comunque
      # sempre qualunque versione che abbia ANCHE un tag di versione reale
      # (X.Y.Z), che potrebbe condividere lo stesso digest.
      - name: Elimina le immagini Docker corrispondenti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          BRANCH_FILTER_RAW: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          BRANCH_FILTER=$(echo "$BRANCH_FILTER_RAW" | tr '/' '-')
          if [ -n "$BRANCH_FILTER" ]; then
            DOCKER_REGEX="^${BRANCH_FILTER}-[0-9]{8}_[0-9]{4}$"
          else
            DOCKER_REGEX='^[a-zA-Z0-9.-]+-[0-9]{8}_[0-9]{4}$'
          fi

          declare -A IMAGE=(
            [backend]=clubby-backend
            [frontend]=clubby-frontend
            [authorizer]=clubby-authorizer
          )

          for SCOPE in ${{ steps.scopes.outputs.list }}; do
            IMG="${IMAGE[$SCOPE]}"
            # Uno scope senza immagine qui produrrebbe una URL con doppio slash,
            # una risposta che non è la lista attesa e un errore di jq a valle,
            # lontano dalla causa: meglio fermarsi qui dicendo cosa manca.
            if [ -z "$IMG" ]; then
              echo "::error::Nessuna immagine Docker associata allo scope '$SCOPE': aggiungila alla mappa IMAGE in questo workflow."
              exit 1
            fi
            KEEP_FILE="/tmp/cleanup/${SCOPE}_keep_datetags.txt"

            echo "=== $IMG ==="
            VERSIONS=$(gh api "/users/$OWNER/packages/container/$IMG/versions?per_page=100" --paginate 2>/dev/null || echo '[]')

            echo "$VERSIONS" | jq -c '.[]' | while read -r v; do
              ID=$(echo "$v" | jq -r '.id')
              TAGS=$(echo "$v" | jq -r '.metadata.container.tags[]?')

              [ -z "$TAGS" ] && continue
              echo "$TAGS" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' && continue

              MATCHED=$(echo "$TAGS" | grep -E "$DOCKER_REGEX" || true)
              [ -z "$MATCHED" ] && continue

              SKIP=false
              if [ -s "$KEEP_FILE" ] && grep -qxF "$MATCHED" "$KEEP_FILE"; then
                SKIP=true
              fi
              $SKIP && continue

              TAGS_INLINE=$(echo "$TAGS" | tr '\n' ' ')
              if [ "$DRY_RUN" = "true" ]; then
                echo "  [dry-run] Eliminerei versione $ID (tag: $TAGS_INLINE)"
              else
                echo "  Elimino versione $ID (tag: $TAGS_INLINE)"
                gh api -X DELETE "/users/$OWNER/packages/container/$IMG/versions/$ID"
              fi
              # Annotata per il riepilogo finale. Il file va scritto qui e non
              # ricostruito dopo: questo ciclo gira in una subshell (è in una
              # pipeline), quindi nessuna variabile sopravvive alla fine.
              echo "$IMG: $TAGS_INLINE(versione $ID)" >> "/tmp/cleanup/${SCOPE}_docker.txt"
            done
          done

      # Riepilogo leggibile nella pagina della run, come per Infra. if: always()
      # perché serve soprattutto quando qualcosa è fallito a metà: dice cosa era
      # già stato toccato prima dell'errore.
      - name: Riepilogo
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SCOPES: ${{ steps.scopes.outputs.list }}
        run: |
          # In dry-run non è stato cancellato nulla: il riepilogo deve dirlo al
          # tempo giusto, altrimenti si legge come un elenco di danni fatti.
          if [ "$DRY_RUN" = "true" ]; then
            VERBO_TAG="Tag Git che verrebbero eliminati"
            VERBO_IMG="Immagini Docker che verrebbero eliminate"
          else
            VERBO_TAG="Tag Git eliminati"
            VERBO_IMG="Immagini Docker eliminate"
          fi

          # Elenco puntato del contenuto di un file, o un trattino se è vuoto
          # o non esiste (uno step fallito prima può non averlo nemmeno creato).
          elenco() {
            if [ -s "$1" ]; then sed 's/^/- `/; s/$/`/' "$1"; else echo "_nessuno_"; fi
          }
          conta() { [ -s "$1" ] && wc -l < "$1" || echo 0; }

          {
            echo "## Cleanup build tags — riepilogo (${{ job.status }})"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **Prova a vuoto** (\`dry_run=true\`): non è stato eliminato nulla."
              echo "> Rilancia con \`dry_run=false\` per applicare quanto segue."
              echo ""
            fi
            echo "| Parametro | Valore |"
            echo "|---|---|"
            echo "| scope | \`${{ inputs.scope || 'tutti' }}\` |"
            echo "| branch | \`${{ inputs.branch || 'tutti' }}\` |"
            echo "| preserve_latest | \`${{ inputs.preserve_latest }}\` |"
            echo "| dry_run | \`${{ inputs.dry_run }}\` |"
            echo ""

            for SCOPE in $SCOPES; do
              DEL="/tmp/cleanup/${SCOPE}_delete_git.txt"
              KEEP="/tmp/cleanup/${SCOPE}_keep_git.txt"
              DOCK="/tmp/cleanup/${SCOPE}_docker.txt"

              echo "### $SCOPE"
              echo ""
              echo "**$VERBO_TAG** ($(conta "$DEL"))"
              echo ""
              elenco "$DEL"
              echo ""
              echo "**$VERBO_IMG** ($(conta "$DOCK"))"
              echo ""
              elenco "$DOCK"
              echo ""
              # I tag mantenuti sono la baseline del prossimo diff di Build &
              # Deploy: con preserve_latest=false non ne resta nessuno, e vale
              # la pena che si veda.
              echo "**Tag mantenuti** ($(conta "$KEEP"))"
              echo ""
              elenco "$KEEP"
              echo ""
            done

            if [ "${{ inputs.preserve_latest }}" != "true" ]; then
              echo "⚠️ \`preserve_latest=false\`: per i branch coinvolti non resta alcun tag di build."
              echo "La prossima run di **Build & Deploy** su quei branch non ha una baseline da cui"
              echo "calcolare il diff e ribuilderà tutti gli scope."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
