name: Deploy CloudFormation DB Stack

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      template-path:
        required: true
        type: string
      tenant-config:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-DB-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Load tenant config
        id: tenant
        run: |
          CONFIG_FILE="infra/tenants/${{ inputs.tenant-config }}.env"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Config file $CONFIG_FILE not found"
            exit 1
          fi
          source "$CONFIG_FILE"
          echo "tenant-id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "db-min-acu=${DB_MIN_ACU:-0.5}" >> $GITHUB_OUTPUT
          echo "db-max-acu=${DB_MAX_ACU:-4}" >> $GITHUB_OUTPUT
          echo "db-name=${DB_NAME:-clubmanager}" >> $GITHUB_OUTPUT

      - name: Deploy DB CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ inputs.template-path }} \
            --stack-name ${{ inputs.stack-name }} \
            --parameter-overrides \
              Environment=${{ steps.tenant.outputs.environment }} \
              TenantId=${{ steps.tenant.outputs.tenant-id }} \
              MinAcu=${{ steps.tenant.outputs.db-min-acu }} \
              MaxAcu=${{ steps.tenant.outputs.db-max-acu }} \
              DbName=${{ steps.tenant.outputs.db-name }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ inputs.stack-name }}
          max-wait-time: '900'
          poll-interval: '20'

      - name: Run DB migration
        run: |
          # Recupera outputs per eseguire lo schema SQL via RDS Data API
          DB_CLUSTER_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DBClusterArn`].OutputValue' \
            --output text)

          DB_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DBSecretArn`].OutputValue' \
            --output text)

          DB_NAME=${{ steps.tenant.outputs.db-name }}

          echo "Running schema migration on $DB_CLUSTER_ARN..."

          # Esegue lo schema SQL tramite RDS Data API
          # Legge il file e lo passa come SQL statement (max 65536 chars)
          SCHEMA=$(cat backend/src/db/schema.sql)

          aws rds-data execute-statement \
            --resource-arn "$DB_CLUSTER_ARN" \
            --secret-arn "$DB_SECRET_ARN" \
            --database "$DB_NAME" \
            --sql "$SCHEMA" \
            --region ${{ inputs.aws-region }} || echo "Migration may have partial results - check logs"

          echo "Migration completed"
