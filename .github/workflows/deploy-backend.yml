name: Deploy Backend

# Solo workflow_call: non compare come workflow lanciabile a sé nella tab
# Actions. Applica i manifest backend/k8s/* sull'Environment/immagine indicati
# dal chiamante e verifica il rollout — nessuna conoscenza di *perché* si sta
# deployando quel tag né di *dove* venga da (tag di data effimero da
# build-deploy.yml, o versione reale da promote.yml). Chi lo chiama decide
# tutto il resto (ambiente, immagine, cosa fare prima/dopo).
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment GitHub da usare (development o il nome di un club)'
        required: true
        type: string
      image_tag:
        description: 'Tag dell''immagine ghcr.io/.../clubby-backend da deployare (tag di data o versione reale X.Y.Z)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Tutto ciò che non ha un default, controllato prima di iniziare: senza,
      # un valore mancante emergerebbe più avanti come errore di scp, come un
      # Secret k8s vuoto o come un pod che non parte, lontano dalla causa.
      - name: Verifica Variables e Secrets dell'ambiente
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mancanti=0
          for nome in SSH_HOST SSH_USER APP_DOMAIN AUTH_DOMAIN; do
            if [ -z "${!nome}" ]; then
              echo "::error::La Variable $nome non è impostata sull'Environment ${{ inputs.environment }}."
              mancanti=1
            fi
          done
          for nome in SSH_PRIVATE_KEY GHCR_PAT DB_PASSWORD; do
            if [ -z "${!nome}" ]; then
              echo "::error::Il Secret $nome non è impostato sull'Environment ${{ inputs.environment }}."
              mancanti=1
            fi
          done
          exit $mancanti

      # Namespace, nome del database e cartella sulla VPS derivano dal nome
      # dell'Environment (clubby-<env>-app, <env>-clubby); l'indirizzo di
      # Postgres dal namespace della sua istanza (DB_NAMESPACE), che più club
      # possono condividere.
      # È una composite action locale: gli output letti più sotto come
      # steps.ambiente.outputs.* (app_namespace, db_host, db_name, deploy_path…)
      # sono dichiarati nella sezione outputs di .github/actions/ambiente/action.yml.
      - name: Ricava namespace e percorsi dall'ambiente
        id: ambiente
        uses: ./.github/actions/ambiente
        with:
          environment: ${{ inputs.environment }}
          db_namespace: ${{ vars.DB_NAMESPACE }}

      - name: Renderizza manifest k8s (backend)
        env:
          KUBE_NAMESPACE: ${{ steps.ambiente.outputs.app_namespace }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clubby-backend:${{ inputs.image_tag }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || 3000 }}
          DB_HOST: ${{ steps.ambiente.outputs.db_host }}
          DB_PORT: ${{ vars.DB_PORT || 5432 }}
          # Utente omonimo del database, creato da Infra come suo proprietario.
          DB_NAME: ${{ steps.ambiente.outputs.db_name }}
          DB_USER: ${{ steps.ambiente.outputs.db_name }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_VERSION: ${{ inputs.image_tag }}
          # Moduli opzionali: attivi solo con il valore esatto "true", quindi
          # una Variable non impostata li lascia spenti (vedi
          # backend/src/util/moduli.ts). Le stesse due Variables le legge il
          # deploy del frontend per nascondere pagine e voci di menu.
          ENABLE_MODULE_TESSERAMENTO: ${{ vars.ENABLE_MODULE_TESSERAMENTO }}
          ENABLE_MODULE_FATTURAZIONE: ${{ vars.ENABLE_MODULE_FATTURAZIONE }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p k8s/rendered
          VARS='$KUBE_NAMESPACE $BACKEND_IMAGE $BACKEND_PORT $DB_HOST $DB_PORT $DB_NAME $DB_USER $DB_PASSWORD $AUTH_DOMAIN $APP_DOMAIN $APP_VERSION $ENABLE_MODULE_TESSERAMENTO $ENABLE_MODULE_FATTURAZIONE'
          # Prefisso "backend-" nel nome renderizzato: frontend usa file con lo
          # stesso nome (deployment.yaml, service.yaml, ...) nella propria
          # cartella, ma sulla VPS finiscono nella STESSA directory di deploy
          # (DEPLOY_PATH, condivisa) — senza prefisso si sovrascriverebbero.
          for f in backend/k8s/*.yaml; do
            envsubst "$VARS" < "$f" > "k8s/rendered/backend-$(basename "$f")"
          done

      - name: Copia manifest backend sulla VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: "k8s/rendered/*"
          target: ${{ steps.ambiente.outputs.deploy_path }}
          strip_components: 2

      - name: Applica manifest backend e verifica rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          NS: ${{ steps.ambiente.outputs.app_namespace }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_PATH: ${{ steps.ambiente.outputs.deploy_path }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          envs: NS,GHCR_USER,GHCR_PAT,DEPLOY_PATH
          script: |
            set -e
            # Vedi commento gemello in infra.yml: kubectl (symlink a k3s) senza
            # KUBECONFIG esplicito risolve su /etc/rancher/k3s/k3s.yaml
            # (root:root), illeggibile dall'utente di deploy.
            export KUBECONFIG="$HOME/.kube/config"

            # I package ghcr.io sono privati di default: senza questo Secret
            # (referenziato da imagePullSecrets nei Deployment) i pod restano
            # in ImagePullBackOff. GHCR_PAT è un token dedicato (read:packages),
            # non il GITHUB_TOKEN della run: quello è valido solo per la durata
            # della pipeline, i pod invece devono poter fare pull in qualunque
            # momento futuro (restart, rischedulazione, ecc.). Idempotente:
            # ricreato anche da deploy-frontend, non fa danno.
            kubectl create secret docker-registry ghcr-secret -n "$NS" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USER" \
              --docker-password="$GHCR_PAT" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f "$DEPLOY_PATH/backend-configmap.yaml"
            kubectl apply -f "$DEPLOY_PATH/backend-secret.yaml"
            kubectl apply -f "$DEPLOY_PATH/backend-deployment.yaml"
            kubectl apply -f "$DEPLOY_PATH/backend-service.yaml"
            kubectl apply -f "$DEPLOY_PATH/backend-ingress.yaml"
            kubectl rollout status deployment/clubby-backend -n "$NS" --timeout=180s
