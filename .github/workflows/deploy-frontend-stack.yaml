name: Deploy CloudFormation Frontend

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      template-path:
        required: true
        type: string
      environment:
        required: true
        type: string
      tenant-config:
        required: true
        type: string
      user-pool-id:
        required: true
        type: string
      user-pool-client-id:
        required: true
        type: string
      cognito-domain:
        required: true
        type: string
      api-base-url:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Frontend-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Load tenant config
        id: tenant
        run: |
          source "infra/tenants/${{ inputs.tenant-config }}.env"
          echo "tenant-id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "domain-name=${DOMAIN_NAME:-}" >> $GITHUB_OUTPUT
          echo "acm-cert-arn=${ACM_CERTIFICATE_ARN:-}" >> $GITHUB_OUTPUT

      # FASE 1: Deploy infra S3 + CloudFront
      - name: Deploy Frontend CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ inputs.template-path }} \
            --stack-name ${{ inputs.stack-name }} \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              TenantId=${{ steps.tenant.outputs.tenant-id }} \
              DomainName="${{ steps.tenant.outputs.domain-name }}" \
              AcmCertificateArn="${{ steps.tenant.outputs.acm-cert-arn }}" \
              ApiBaseUrl=${{ inputs.api-base-url }} \
              CognitoUserPoolId=${{ inputs.user-pool-id }} \
              CognitoClientId=${{ inputs.user-pool-client-id }} \
              CognitoDomain=${{ inputs.cognito-domain }} \
              AwsRegion=${{ inputs.aws-region }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ inputs.stack-name }}
          max-wait-time: '300'
          poll-interval: '15'

      # FASE 2: Recupera output e build frontend
      - name: Get stack outputs
        id: stack-outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          FRONTEND_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack-name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendUrl`].OutputValue' \
            --output text)

          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "cf-id=$CF_ID"         >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL:         ${{ inputs.api-base-url }}
          VITE_COGNITO_USER_POOL_ID: ${{ inputs.user-pool-id }}
          VITE_COGNITO_CLIENT_ID:    ${{ inputs.user-pool-client-id }}
          VITE_COGNITO_DOMAIN:       ${{ inputs.cognito-domain }}
          VITE_AWS_REGION:           ${{ inputs.aws-region }}
          VITE_TENANT_ID:            ${{ steps.tenant.outputs.tenant-id }}
        run: |
          npm ci
          npm run build
          echo "Build output:"
          ls -la dist/

      # FASE 3: Upload a S3 + invalidazione CloudFront
      - name: Deploy to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ steps.stack-outputs.outputs.bucket }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ steps.stack-outputs.outputs.bucket }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack-outputs.outputs.cf-id }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "## Frontend Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.stack-outputs.outputs.frontend-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${{ steps.stack-outputs.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.stack-outputs.outputs.cf-id }}" >> $GITHUB_STEP_SUMMARY
