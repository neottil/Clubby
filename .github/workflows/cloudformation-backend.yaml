name: Deploy CloudFormation Backend

on:
  workflow_run:
    workflows: ["Deploy CloudFormation Auth"]
    types:
      - completed
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/cloudformation-backend.yaml'
      - 'infra/backend/**'
      - 'backend/**'

env:
  AWS_REGION: eu-central-1
  ENV: ${{ github.ref_name }}
  STACK_NAME: clubmanager-backend-${{ github.ref_name }}
  TEMPLATE_PATH: infra/backend/template.yaml

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CF-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Auth Stack Outputs
        id: auth-outputs
        run: |
          AUTH_STACK_NAME="clubmanager-auth-${{ env.ENV }}"
          
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name $AUTH_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)
          
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name $AUTH_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
            --output text)
          
          echo "user-pool-id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user-pool-client-id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
          
          echo "UserPoolId: $USER_POOL_ID"
          echo "ClientId: ${USER_POOL_CLIENT_ID:0:20}..."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          ls -la dist/

      - name: Create Lambda deployment package
        working-directory: backend
        run: |
          zip -r ../backend-lambda-${{ github.sha }}.zip \
            dist/ \
            node_modules/ \
            package.json
          ls -lh ../backend-lambda-${{ github.sha }}.zip

      # FASE 1: Deploy stack CloudFormation
      - name: Deploy CloudFormation Stack
        run: |
          set +e
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_PATH }} \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides \
              Environment=${{ env.ENV }} \
              AwsRegion=${{ env.AWS_REGION }} \
              UserPoolId=${{ steps.auth-outputs.outputs['user-pool-id'] }} \
              UserPoolClientId=${{ steps.auth-outputs.outputs['user-pool-client-id'] }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          
          EXIT_CODE=$?
          echo "CloudFormation deploy exit code: $EXIT_CODE"
          
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 255 ]; then
            exit $EXIT_CODE
          fi

      - name: Wait for stack completion
        uses: ./.github/actions/wait-cloudformation-stack
        with:
          stack-name: ${{ env.STACK_NAME }}
          max-wait-time: '120'
          poll-interval: '10'

      # FASE 2: Upload Lambda package a S3
      - name: Get S3 bucket name
        id: get-bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`LambdaArtifactsBucketName`].OutputValue' \
            --output text)
          
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "ERROR: Bucket name not found"
            exit 1
          fi
          
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp backend-lambda-${{ github.sha }}.zip \
            s3://${{ steps.get-bucket.outputs.bucket }}/backend-lambda-${{ github.sha }}.zip
          
          echo "Package uploaded to S3"

      # FASE 3: Update Lambda function
      - name: Update Lambda function
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BackendLambdaArn`].OutputValue' \
            --output text | cut -d: -f7)
          
          echo "Updating Lambda: $FUNCTION_NAME"
          
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket ${{ steps.get-bucket.outputs.bucket }} \
            --s3-key backend-lambda-${{ github.sha }}.zip

          # Aspetta update code
          aws lambda wait function-updated --function-name $FUNCTION_NAME

          # Update HANDLER per NestJS
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --handler dist/main.handler
          
          # Aspetta update config
          aws lambda wait function-updated --function-name $FUNCTION_NAME
          
          echo "Lambda function updated: $FUNCTION_NAME"

      - name: Show Outputs
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs' \
            --output table || echo "Stack not found"
