name: Deploy CloudFormation Backend

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/cloudformation-backend.yaml'
      - 'infra/backend/**'
      - 'backend/**'

env:
  AWS_REGION: eu-central-1
  STACK_NAME: clubmanager-backend-test
  TEMPLATE_PATH: infra/backend/template.yaml

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-CF-Backend-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Build Backend
      working-directory: backend
      run: |
        npm ci
        npm run build
        ls -la dist/

    - name: Create Lambda deployment package
      working-directory: backend
      run: |
        zip -r ../backend-lambda-${{ github.sha }}.zip \
          dist/ \
          node_modules/ \
          package.json
        ls -lh ../backend-lambda-${{ github.sha }}.zip

    # FASE 1: Deploy stack (crea bucket se non esiste)
    - name: Deploy CloudFormation Stack (infra only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        set +e
        aws cloudformation deploy \
          --template-file ${{ env.TEMPLATE_PATH }} \
          --stack-name ${{ env.STACK_NAME }} \
          --parameter-overrides \
            Environment=test \
            AwsRegion=${{ env.AWS_REGION }} \
            UserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} \
            UserPoolClientId=${{ secrets.COGNITO_USER_POOL_CLIENT_ID }} \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --no-fail-on-empty-changeset
        EXIT_CODE=$?
        echo "cloudformation deploy exit code: $EXIT_CODE"
        if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 255 ]; then
          exit $EXIT_CODE
        fi

    - name: Wait for stack completion
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: ./.github/actions/wait-cloudformation-stack
      with:
        stack-name: ${{ env.STACK_NAME }}
        max-wait-time: '120'
        poll-interval: '10'

    # FASE 3: Ottieni nome bucket dagli output CloudFormation
    - name: Get S3 bucket name from CloudFormation
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: get-bucket
      run: |        
        # Recupera nome bucket
        BUCKET_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs[?OutputKey==`LambdaArtifactsBucketName`].OutputValue' \
          --output text)
        
        if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
          echo "ERROR: Could not retrieve bucket name from CloudFormation outputs"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs'
          exit 1
        fi
        
        echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
        echo "Bucket name: $BUCKET_NAME"

    # FASE 4: Upload ZIP su S3
    - name: Upload Lambda package to S3
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        aws s3 cp backend-lambda-${{ github.sha }}.zip \
          s3://${{ steps.get-bucket.outputs.bucket }}/backend-lambda-${{ github.sha }}.zip

    # FASE 5: Aggiorna Lambda con nuovo codice
    - name: Update Lambda function code
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        FUNCTION_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs[?OutputKey==`BackendLambdaArn`].OutputValue' \
          --output text | cut -d: -f7)
        
        aws lambda update-function-code \
          --function-name $FUNCTION_NAME \
          --s3-bucket ${{ steps.get-bucket.outputs.bucket }} \
          --s3-key backend-lambda-${{ github.sha }}.zip
        
        echo "Lambda function updated: $FUNCTION_NAME"

    - name: Show Outputs
      if: always()
      run: |
        aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --query 'Stacks[0].Outputs' \
          --output table || echo "Stack not found or error"
