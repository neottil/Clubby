name: Deploy CloudFormation Auth

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        description: 'AWS Region to deploy the stack'
        type: string
      stack-name:
        required: true
        description: 'CloudFormation stack name'
        type: string
      user-pool-id:
        required: true
        type: string
      user-pool-client-id:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

env:
  EMAIL:  test@clubmanager.it
  USER_PASSWORD: TestPassword123!

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-CF-Auth-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Create Test User in Cognito
        run: |        
          EMAIL=${{ env.EMAIL }}
          PASSWORD=${{ env.USER_PASSWORD }}
          USER_POOL_ID=${{ inputs.user-pool-id }}
          CLIENT_ID=${{ inputs.user-pool-client-id }}

          echo "Managing user $EMAIL..."
          
          # Prova a creare, ignora se esiste già
          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --user-attributes Name=email,Value="$EMAIL" Name=email_verified,Value=true \
            --temporary-password "TempPass123!" \
            --message-action SUPPRESS 2>&1 | grep -v "UsernameExistsException" || true
          
          echo "Setting password..."
          
          # Imposta password (funziona sempre)
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --password "$PASSWORD" \
            --permanent
          
          echo "Configuring client..."
          
          # Configura auth flows
          aws cognito-idp update-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH
          
          echo "Done: $EMAIL / $PASSWORD"
