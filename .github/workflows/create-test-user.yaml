name: Create Test User in Cognito

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      user-pool-id:
        required: true
        type: string
      user-pool-client-id:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true
      # Opzionale: email e password vengono prese da secrets se disponibili,
      # altrimenti usano i valori di default (solo per dev/test)
      test-user-email:
        required: false
      test-user-password:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-TestUser-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Create or update test user in Cognito
        run: |
          # Usa secrets se disponibili, altrimenti default (solo dev)
          EMAIL="${{ secrets.test-user-email || 'admin@clubmanager.local' }}"
          PASSWORD="${{ secrets.test-user-password || 'Admin123!@#' }}"
          USER_POOL_ID="${{ inputs.user-pool-id }}"
          CLIENT_ID="${{ inputs.user-pool-client-id }}"

          echo "Managing user $EMAIL in pool $USER_POOL_ID..."

          # Crea utente (ignora se esiste già)
          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --user-attributes \
              Name=email,Value="$EMAIL" \
              Name=email_verified,Value=true \
            --temporary-password "TempPass123!" \
            --message-action SUPPRESS 2>&1 | grep -v "UsernameExistsException" || true

          # Imposta password permanente
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --password "$PASSWORD" \
            --permanent

          # Aggiunge al gruppo admin
          aws cognito-idp admin-add-user-to-group \
            --user-pool-id "$USER_POOL_ID" \
            --username "$EMAIL" \
            --group-name admin || true

          # Configura auth flows sul client
          aws cognito-idp update-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH

          echo "Test admin user ready: $EMAIL"
          echo "## Test User" >> $GITHUB_STEP_SUMMARY
          echo "- Email: $EMAIL" >> $GITHUB_STEP_SUMMARY
          echo "- Pool: $USER_POOL_ID" >> $GITHUB_STEP_SUMMARY
