name: DB Stack Outputs

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      stack-name:
        required: true
        type: string
    outputs:
      db-cluster-arn:
        value: ${{ jobs.produce-outputs.outputs.db-cluster-arn }}
      db-secret-arn:
        value: ${{ jobs.produce-outputs.outputs.db-secret-arn }}
      db-name:
        value: ${{ jobs.produce-outputs.outputs.db-name }}
      lambda-subnet-ids:
        value: ${{ jobs.produce-outputs.outputs.lambda-subnet-ids }}
      lambda-security-group-id:
        value: ${{ jobs.produce-outputs.outputs.lambda-security-group-id }}
    secrets:
      aws-role-arn:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  produce-outputs:
    runs-on: ubuntu-latest
    outputs:
      db-cluster-arn:           ${{ steps.outputs.outputs.db-cluster-arn }}
      db-secret-arn:            ${{ steps.outputs.outputs.db-secret-arn }}
      db-name:                  ${{ steps.outputs.outputs.db-name }}
      lambda-subnet-ids:        ${{ steps.outputs.outputs.lambda-subnet-ids }}
      lambda-security-group-id: ${{ steps.outputs.outputs.lambda-security-group-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: GitHubActions-DB-Outputs-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Get DB Stack Outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name ${{ inputs.stack-name }} \
              --query "Stacks[0].Outputs[?OutputKey==\`$1\`].OutputValue" \
              --output text
          }

          echo "db-cluster-arn=$(get_output DBClusterArn)"             >> $GITHUB_OUTPUT
          echo "db-secret-arn=$(get_output DBSecretArn)"               >> $GITHUB_OUTPUT
          echo "db-name=$(get_output DBName)"                          >> $GITHUB_OUTPUT
          echo "lambda-subnet-ids=$(get_output LambdaSubnetIds)"       >> $GITHUB_OUTPUT
          echo "lambda-security-group-id=$(get_output LambdaSecurityGroupId)" >> $GITHUB_OUTPUT
