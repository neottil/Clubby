AWSTemplateFormatVersion: '2010-09-09'
Description: 'ClubManager Frontend Stack - S3 + CloudFront + Route53 (opzionale)'

Parameters:
  Environment:
    Type: String
    Description: Environment name (dev, test, prod)
  TenantId:
    Type: String
    Description: Tenant identifier (e.g. asd1, asd2)
    Default: asd1
  DomainName:
    Type: String
    Description: >
      Custom domain name (e.g. asd1.miodominio.com).
      Leave empty to use CloudFront default domain.
    Default: ''
  AcmCertificateArn:
    Type: String
    Description: >
      ARN of ACM certificate in us-east-1 for custom domain.
      Required only if DomainName is set.
    Default: ''
  ApiBaseUrl:
    Type: String
    Description: Backend API base URL (HTTP API Gateway invoke URL)
    Default: ''
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID
  CognitoClientId:
    Type: String
    Description: Cognito App Client ID
  CognitoEndpoint:
    Type: String
    Description: >
      URL base OAuth Cognito completo.
      Es. https://clubmanager-dev.auth.eu-central-1.amazoncognito.com
      Locale (LocalStack): http://localhost:4566

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:

  # ---------------------------------------------------------------
  # S3 Bucket per i file statici del frontend
  # ---------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub clubmanager-frontend-${TenantId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Tenant
          Value: !Ref TenantId
        - Key: CostCenter
          Value: !Ref TenantId
        - Key: Project
          Value: ClubManager

  # Origin Access Control per CloudFront → S3
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub clubmanager-oac-${TenantId}-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy: accesso solo da CloudFront OAC
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ---------------------------------------------------------------
  # CloudFront Distribution
  # ---------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ClubManager frontend ${TenantId} ${Environment}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        # Alias e certificato (solo se dominio custom)
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true

        # SPA routing: errori 403/404 → index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Tenant
          Value: !Ref TenantId
        - Key: CostCenter
          Value: !Ref TenantId
        - Key: Project
          Value: ClubManager

  # ---------------------------------------------------------------
  # Parameter Store: configurazione runtime per il frontend
  # (sarà usata nel build per iniettare le env vars nel bundle)
  # ---------------------------------------------------------------
  FrontendConfigParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /clubmanager/${TenantId}/${Environment}/frontend-config
      Type: String
      Value: !Sub |
        {
          "VITE_API_BASE_URL": "${ApiBaseUrl}",
          "VITE_COGNITO_USER_POOL_ID": "${CognitoUserPoolId}",
          "VITE_COGNITO_CLIENT_ID": "${CognitoClientId}",
          "VITE_COGNITO_ENDPOINT": "${CognitoEndpoint}",
          "VITE_TENANT_ID": "${TenantId}"
        }
      Description: !Sub Frontend config for ClubManager ${TenantId} ${Environment}
      Tags:
        Environment: !Ref Environment
        Tenant: !Ref TenantId
        Project: ClubManager

Outputs:
  FrontendBucketName:
    Description: S3 bucket name for frontend assets
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucketName'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (needed for cache invalidation)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  CloudFrontDomainName:
    Description: CloudFront domain name (or custom domain if configured)
    Value: !If
      - HasCustomDomain
      - !Ref DomainName
      - !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomainName'

  FrontendUrl:
    Description: Full URL of the frontend application
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendUrl'

  FrontendConfigParamName:
    Description: SSM Parameter name with frontend config
    Value: !Ref FrontendConfigParam
    Export:
      Name: !Sub '${AWS::StackName}-FrontendConfigParam'
