# Esegue scripts/keycloak-realm-init.sh (montato da un ConfigMap creato dal
# workflow Infra) DENTRO al cluster: gira come pod, quindi risolve il DNS
# interno (*.svc.cluster.local) senza bisogno di port-forward o tunnel SSH.
# I parametri (KEYCLOAK_URL, REALM, secret generati, ecc.) arrivano dal
# Secret "clubmanager-init-params", creato ad-hoc dal workflow e mai
# committato nel repo.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-init
  namespace: ${KUBE_NAMESPACE}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: alpine:3.20
          command:
            - sh
            - -c
            - "apk add --no-cache bash curl jq >/dev/null && bash /scripts/keycloak-realm-init.sh"
          envFrom:
            - secretRef:
                name: clubmanager-init-params
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: keycloak-realm-init-script
            defaultMode: 0755
