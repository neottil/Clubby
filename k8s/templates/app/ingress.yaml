# Assume Traefik come Ingress Controller (incluso di default in k3s, ingressClassName
# "traefik") e cert-manager con il ClusterIssuer "letsencrypt", entrambi configurati da
# scripts/setup-vps-k3s.sh. Adatta ingressClassName/annotazione per un cluster diverso.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clubmanager
  namespace: ${KUBE_NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${FRONTEND_HOST}
        - ${BACKEND_HOST}
      secretName: clubmanager-tls
  rules:
    - host: ${FRONTEND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clubmanager-frontend
                port:
                  number: 80
    - host: ${BACKEND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clubmanager-backend
                port:
                  number: 80
