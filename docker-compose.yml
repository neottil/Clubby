services:

  # ----------------------------------------------------------
  # PostgreSQL 16 locale (dati applicativi)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: clubmanager-postgres
    environment:
      POSTGRES_DB:       clubmanager
      POSTGRES_USER:     clubmanager
      POSTGRES_PASSWORD: clubmanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # PostgreSQL per Keycloak (DB dedicato)
  # ----------------------------------------------------------
  keycloak-db:
    image: postgres:16.6-alpine
    container_name: clubmanager-keycloak-db
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: keycloak_dev
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # Keycloak 26.1 — Identity Provider (OIDC)
  # ----------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: clubmanager-keycloak
    command: start-dev
    environment:
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KC_HOSTNAME:    localhost
      KC_HTTP_PORT:   8080
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  keycloak_db_data:
