services:

  # ----------------------------------------------------------
  # PostgreSQL 16 locale
  # ----------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: clubmanager-postgres
    environment:
      POSTGRES_DB:       clubmanager
      POSTGRES_USER:     clubmanager
      POSTGRES_PASSWORD: clubmanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # LocalStack 4.14.0 — ultima versione community senza auth token.
  # NON aggiornare: versioni successive (>= 2026.03.0) richiedono
  # un account LocalStack. Vedi: https://localstack.cloud/2026-updates
  #
  # L'healthcheck usa curl -f su /_localstack/health: risponde
  # HTTP 200 solo quando LocalStack è pronto.
  # (La stringa "Ready." appare nei log, non nella risposta HTTP.)
  #
  # Per creare le risorse Cognito dopo l'avvio, esegui:
  #   ./scripts/init-localstack.sh
  # oppure: make init
  # ----------------------------------------------------------
  localstack:
    image: localstack/localstack:4.14.0
    container_name: clubmanager-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES:    cognito-idp,secretsmanager
      PERSISTENCE: 1
      DEBUG:       0
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  localstack_data:
