version: "3.9"

# ============================================================
# ClubManager - Ambiente di sviluppo locale
# ============================================================
#
# AVVIO COMPLETO (tutto via Docker):
#   docker compose up -d
#
# AVVIO SOLO INFRA (per debug FE/BE nativi):
#   docker compose up -d postgres localstack localstack-init
#   # poi avvia BE e FE nativamente (vedi README / .env.example)
#
# Stop:   docker compose down
# Reset:  docker compose down -v  (cancella tutti i dati)
# Logs:   docker compose logs -f [service]
#
# NOTA versioni:
#   localstack 4.14.0 = ultima versione community (pre-marzo 2026)
#   che non richiede auth token. Non aggiornare senza valutare
#   la necessità di un account LocalStack.
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL locale (Aurora-compatible schema)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: clubmanager-postgres
    environment:
      POSTGRES_DB:       clubmanager
      POSTGRES_USER:     clubmanager
      POSTGRES_PASSWORD: clubmanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - localnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # LocalStack 4.14.0: ultima versione community senza auth token.
  # L'healthcheck verifica che cognito-idp sia operativo usando
  # curl + python (disponibili nell'immagine) per parsare il JSON.
  # ----------------------------------------------------------
  localstack:
    image: localstack/localstack:4.14.0
    container_name: clubmanager-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES:    cognito-idp,secretsmanager
      PERSISTENCE: 1
      DEBUG:       0
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - localnet
    healthcheck:
      # Verifica che cognito-idp sia "available" o "running" nel health endpoint.
      # python3 e curl sono sempre disponibili nell'immagine localstack.
      test:
        - "CMD-SHELL"
        - >-
          curl -sf http://localhost:4566/_localstack/health |
          python3 -c "import sys,json;
          h=json.load(sys.stdin);
          s=h.get('services',{});
          ok=s.get('cognito-idp','') in ('available','running');
          sys.exit(0 if ok else 1)"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # ----------------------------------------------------------
  # Init container: crea le risorse Cognito e scrive gli ID
  # in /shared/localstack.env (volume condiviso).
  # Usa amazon/aws-cli che ha già il binario aws.
  # ----------------------------------------------------------
  localstack-init:
    image: amazon/aws-cli:2.22.35
    container_name: clubmanager-localstack-init
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID:     test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION:    eu-central-1
    volumes:
      - localstack_shared:/shared
      - ./scripts/localstack-init.sh:/localstack-init.sh:ro
    # cp in /tmp aggira il problema dei permessi del mount :ro
    entrypoint: ["/bin/sh", "-c", "cp /localstack-init.sh /tmp/init.sh && chmod +x /tmp/init.sh && /tmp/init.sh"]
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - localnet

  # ----------------------------------------------------------
  # Backend: server locale (tsx) con Postgres diretto + Cognito su LocalStack.
  # IMPORTANTE: le variabili lette da /shared/localstack.env vengono
  # caricate a runtime con `export $$(cat ...)` — i $$ evitano che
  # Docker Compose espanda le variabili al momento del parse.
  # ----------------------------------------------------------
  backend:
    image: node:22.14-alpine
    container_name: clubmanager-backend
    working_dir: /app
    command:
      - sh
      - -c
      - |
        echo 'Attendo /shared/localstack.env...'
        while [ ! -f /shared/localstack.env ]; do sleep 2; done
        export $$(cat /shared/localstack.env | xargs)
        echo "Pool ID: $$COGNITO_USER_POOL_ID"
        npm install
        npx tsx src/local/server.ts
    environment:
      NODE_ENV:              development
      TENANT_ID:             asd1
      DB_LOCAL:              "true"
      DB_HOST:               postgres
      DB_PORT:               "5432"
      DB_NAME:               clubmanager
      DB_USER:               clubmanager
      DB_PASSWORD:           clubmanager_dev
      DB_CLUSTER_ARN:        arn:aws:rds:eu-central-1:000000000000:cluster:local
      DB_SECRET_ARN:         arn:aws:secretsmanager:eu-central-1:000000000000:secret:local
      AWS_REGION_NAME:       eu-central-1
      AWS_ENDPOINT:          http://localstack:4566
      AWS_ACCESS_KEY_ID:     test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - localstack_shared:/shared
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    networks:
      - localnet

  # ----------------------------------------------------------
  # Frontend: Vite dev server.
  # Genera .env.local dai valori Cognito nel volume condiviso
  # prima di avviare Vite.
  # ----------------------------------------------------------
  frontend:
    image: node:22.14-alpine
    container_name: clubmanager-frontend
    working_dir: /app
    command:
      - sh
      - -c
      - |
        while [ ! -f /shared/localstack.env ]; do sleep 2; done
        export $$(cat /shared/localstack.env | xargs)
        echo "VITE_API_BASE_URL=http://localhost:3000"           >  .env.local
        echo "VITE_COGNITO_USER_POOL_ID=$$COGNITO_USER_POOL_ID" >> .env.local
        echo "VITE_COGNITO_CLIENT_ID=$$COGNITO_CLIENT_ID"        >> .env.local
        echo "VITE_COGNITO_ENDPOINT=http://localhost:4566"       >> .env.local
        echo "VITE_TENANT_ID=asd1"                               >> .env.local
        npm install
        npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - localstack_shared:/shared
    depends_on:
      - backend
    networks:
      - localnet

volumes:
  postgres_data:
  localstack_data:
  localstack_shared:

networks:
  localnet:
    driver: bridge
