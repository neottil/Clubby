# Infrastruttura per lo sviluppo locale
# Avvio:      docker compose up -d
# Poi:        cd backend && npm run dev
#             cd authorizer && npm run dev
#             cd frontend && npm run dev
#
# Un'unica istanza Postgres con due database separati — clubby (applicativo) e
# clubby_auth (credenziali) — con utenti distinti, come in produzione: il
# backend non deve poter leggere la tabella delle password nemmeno per errore.

services:

  postgres:
    image: postgres:16.3-alpine3.20
    container_name: clubby-postgres
    environment:
      POSTGRES_DB: clubby
      POSTGRES_USER: clubby
      POSTGRES_PASSWORD: clubby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Gli script in questa cartella vengono eseguiti in ordine alfabetico da
      # Postgres al PRIMO avvio, cioè solo su un volume dati vuoto: dopo un
      # `docker compose down -v` ripartono, altrimenti no.
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema-app.sql:ro
      - ./scripts/init-auth-db.sh:/docker-entrypoint-initdb.d/02-init-auth-db.sh:ro
      # Fuori dalla cartella di init di proposito: se stesse lì, Postgres lo
      # eseguirebbe sul database dell'app. Ci pensa lo script qui sopra ad
      # applicarlo al database giusto.
      - ./authorizer/src/db/schema.sql:/schema/authorizer-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubby -d clubby"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
