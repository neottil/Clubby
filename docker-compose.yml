version: "3.9"

# ============================================================
# ClubManager - Ambiente di sviluppo locale
# ============================================================
#
# AVVIO COMPLETO (tutto via Docker):
#   docker compose up -d
#
# AVVIO SOLO INFRA (per debug FE/BE nativi):
#   docker compose up -d postgres localstack
#   # poi avvia BE e FE con i comandi descritti nel README
#
# Stop:   docker compose down
# Reset:  docker compose down -v  (cancella tutti i dati)
# Logs:   docker compose logs -f [service]
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL locale (Aurora-compatible schema)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: clubmanager-postgres
    environment:
      POSTGRES_DB:       clubmanager
      POSTGRES_USER:     clubmanager
      POSTGRES_PASSWORD: clubmanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - localnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # LocalStack: simula Cognito (e altri servizi AWS se necessario)
  # Al termine dell'init scrive /shared/localstack.env con
  # COGNITO_USER_POOL_ID e COGNITO_CLIENT_ID generati.
  # ----------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: clubmanager-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES:       cognito-idp,secretsmanager
      DEFAULT_REGION: eu-central-1
      DATA_DIR:       /var/lib/localstack/data
      DEBUG:          0
    volumes:
      - localstack_data:/var/lib/localstack
      - localstack_shared:/shared
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-init.sh:ro
    networks:
      - localnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------
  # Backend: server locale che mappa le request alle Lambda handler
  # Usa Postgres diretto (DB_LOCAL=true) e Cognito su LocalStack
  # (AWS_ENDPOINT punta a LocalStack per CognitoIdentityProviderClient)
  # ----------------------------------------------------------
  backend:
    image: node:22-alpine
    container_name: clubmanager-backend
    working_dir: /app
    command: >
      sh -c "
        echo 'Attendo localstack.env...' &&
        while [ ! -f /shared/localstack.env ]; do sleep 2; done &&
        export \$(cat /shared/localstack.env | xargs) &&
        echo \"Pool: \$$COGNITO_USER_POOL_ID\" &&
        npm install &&
        npx tsx src/local/server.ts
      "
    environment:
      NODE_ENV:             development
      TENANT_ID:            asd1
      # Postgres locale (bypassa RDS Data API)
      DB_LOCAL:             "true"
      DB_HOST:              postgres
      DB_PORT:              "5432"
      DB_NAME:              clubmanager
      DB_USER:              clubmanager
      DB_PASSWORD:          clubmanager_dev
      # Finti ARN (non usati quando DB_LOCAL=true)
      DB_CLUSTER_ARN:       arn:aws:rds:eu-central-1:000000000000:cluster:local
      DB_SECRET_ARN:        arn:aws:secretsmanager:eu-central-1:000000000000:secret:local
      # Cognito: l'ID reale viene caricato da /shared/localstack.env al runtime
      # AWS_ENDPOINT fa puntare CognitoIdentityProviderClient a LocalStack
      AWS_REGION_NAME:      eu-central-1
      AWS_ENDPOINT:         http://localstack:4566
      AWS_ACCESS_KEY_ID:    test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - localstack_shared:/shared
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - localnet

  # ----------------------------------------------------------
  # Frontend: Vite dev server con hot reload
  # Legge VITE_* da env Docker; POOL_ID e CLIENT_ID sono
  # statici perché Vite li compila al build time.
  # Per valori dinamici (dopo primo avvio LocalStack) usa
  # il target "frontend-config" per generare .env.local.
  # ----------------------------------------------------------
  frontend:
    image: node:22-alpine
    container_name: clubmanager-frontend
    working_dir: /app
    command: >
      sh -c "
        while [ ! -f /shared/localstack.env ]; do sleep 2; done &&
        export \$(cat /shared/localstack.env | xargs) &&
        echo \"VITE_API_BASE_URL=http://localhost:3000\" > .env.local &&
        echo \"VITE_COGNITO_USER_POOL_ID=\$$COGNITO_USER_POOL_ID\" >> .env.local &&
        echo \"VITE_COGNITO_CLIENT_ID=\$$COGNITO_CLIENT_ID\" >> .env.local &&
        echo \"VITE_COGNITO_ENDPOINT=http://localhost:4566\" >> .env.local &&
        echo \"VITE_TENANT_ID=asd1\" >> .env.local &&
        npm install &&
        npm run dev -- --host 0.0.0.0
      "
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - localstack_shared:/shared
    depends_on:
      - backend
    networks:
      - localnet

volumes:
  postgres_data:
  localstack_data:
  localstack_shared:

networks:
  localnet:
    driver: bridge
